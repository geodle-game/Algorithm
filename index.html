<script>
var W = 100, H = 50;
var CELL = 5;
var RECORD_BUDGET = 1;
var RECORD_MAX_FRAMES = 15000;
var MASS_BUDGET = 8;
var TICK_DELAY = 16;
var NS_PER_FRAME = 10000;   // default: 10us of alg time per animation frame

var CUT_CHECK_INTERVAL = 500;
var CUT_MIN_VISITED_DELTA = 100;
var FORK_COOLDOWN = 4;

var REVIVE_DEADEND_THRESHOLD = 150;
var REVIVE_BATCH = 6;
var MAX_ARCHIVE = 500;

var START = [0, 0];
var GOAL = [W-1, H-1];
var grid = null;

function rng(seed){
  var s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
var seedCounter = 0;
function freshSeed(){
  seedCounter++;
  var t = Date.now() >>> 0;
  var r = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
  return (t ^ r ^ (seedCounter * 2654435761)) >>> 0;
}

function makeOpen(){
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(0); g.push(row); }
  return g;
}
function makeSparse(){
  var g = makeOpen();
  var sx = W/60, sy = H/30;
  var blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(var i=0; i<blocks.length; i++){
    var b = blocks[i];
    var x0 = Math.floor(b[0]*sx), y0 = Math.floor(b[1]*sy);
    var x1 = Math.floor(b[2]*sx), y1 = Math.floor(b[3]*sy);
    for(var yy=y0; yy<y1; yy++) for(var xx=x0; xx<x1; xx++)
      if(yy>=0 && yy<H && xx>=0 && xx<W) g[yy][xx] = 1;
  }
  g[0][0] = 0; g[H-1][W-1] = 0;
  return g;
}
function makeRandom(density, seed){
  var r = rng(seed);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(r() < density ? 1 : 0); g.push(row); }
  g[0][0] = 0; g[H-1][W-1] = 0;
  return g;
}
function makeMazeDFS(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  var visited = [];
  for(var yy=0; yy<ry; yy++){ var vr = []; for(var xx=0; xx<rx; xx++) vr.push(false); visited.push(vr); }
  var stack = [[0,0]]; visited[0][0] = true; g[1][1] = 0;
  while(stack.length > 0){
    var top = stack[stack.length-1];
    var cx = top[0], cy = top[1];
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=dirs.length-1; i>0; i--){ var j = Math.floor(r()*(i+1)); var tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp; }
    var moved = false;
    for(var k=0; k<dirs.length; k++){
      var nx = cx + dirs[k][0], ny = cy + dirs[k][1];
      if(nx<0 || nx>=rx || ny<0 || ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dirs[k][1]][cx*2+1+dirs[k][0]] = 0;
      g[ny*2+1][nx*2+1] = 0;
      visited[ny][nx] = true; stack.push([nx,ny]); moved = true; break;
    }
    if(!moved) stack.pop();
  }
  return g;
}
function makeMazePrim(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  var inMaze = [];
  for(var yy=0; yy<ry; yy++){ var vr = []; for(var xx=0; xx<rx; xx++) vr.push(false); inMaze.push(vr); }
  var frontier = [];
  inMaze[0][0] = true; g[1][1] = 0;
  var dirs4 = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs4.length; i++){
    var nx = dirs4[i][0], ny = dirs4[i][1];
    if(nx>=0 && nx<rx && ny>=0 && ny<ry) frontier.push([nx,ny,0,0]);
  }
  while(frontier.length > 0){
    var idx = Math.floor(r() * frontier.length);
    var item = frontier.splice(idx, 1)[0];
    var nx2 = item[0], ny2 = item[1], px = item[2], py = item[3];
    if(inMaze[ny2][nx2]) continue;
    g[ny2*2+1][nx2*2+1] = 0;
    g[py*2+1 + (ny2-py)][px*2+1 + (nx2-px)] = 0;
    inMaze[ny2][nx2] = true;
    for(var k=0; k<dirs4.length; k++){
      var ax = nx2 + dirs4[k][0], ay = ny2 + dirs4[k][1];
      if(ax>=0 && ax<rx && ay>=0 && ay<ry && !inMaze[ay][ax]) frontier.push([ax,ay,nx2,ny2]);
    }
  }
  return g;
}
function makeMazeKruskal(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  for(var yy=0; yy<ry; yy++) for(var xx=0; xx<rx; xx++) g[yy*2+1][xx*2+1] = 0;
  var parent = new Int32Array(rx*ry);
  for(var i=0; i<rx*ry; i++) parent[i] = i;
  function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  var walls = [];
  for(var y2=0; y2<ry; y2++) for(var x2=0; x2<rx; x2++){
    if(x2+1 < rx) walls.push([x2,y2,x2+1,y2]);
    if(y2+1 < ry) walls.push([x2,y2,x2,y2+1]);
  }
  for(var k=walls.length-1; k>0; k--){ var j = Math.floor(r()*(k+1)); var tmp = walls[k]; walls[k] = walls[j]; walls[j] = tmp; }
  for(var wi=0; wi<walls.length; wi++){
    var wall = walls[wi];
    var ra = find(wall[1]*rx + wall[0]);
    var rb = find(wall[3]*rx + wall[2]);
    if(ra !== rb){
      parent[ra] = rb;
      g[wall[1]*2+1 + (wall[3]-wall[1])][wall[0]*2+1 + (wall[2]-wall[0])] = 0;
    }
  }
  return g;
}
var MAZE_TYPES = [
  { name:'DFS',     fn: makeMazeDFS },
  { name:'Prim',    fn: makeMazePrim },
  { name:'Kruskal', fn: makeMazeKruskal }
];

function manhattan(a,b){ return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]); }
var N4 = [[1,0],[-1,0],[0,1],[0,-1]];

function keysOf(obj){
  var out = [];
  if(obj.length !== undefined){
    for(var i=0; i<obj.length; i++) if(obj[i]) out.push(i);
  } else {
    for(var k in obj) if(obj[k]) out.push(parseInt(k, 10));
  }
  return out;
}

function validatePath(g, path, start, goal, W, H){
  if(!path || path.length === 0) return { ok:false, reason:'empty path' };
  if(path[0][0] !== start[0] || path[0][1] !== start[1]) return { ok:false, reason:'start mismatch' };
  var last = path[path.length-1];
  if(last[0] !== goal[0] || last[1] !== goal[1]) return { ok:false, reason:'goal mismatch' };
  for(var i=0; i<path.length; i++){
    var x = path[i][0], y = path[i][1];
    if(x<0 || x>=W || y<0 || y>=H) return { ok:false, reason:'OOB at ' + i };
    if(g[y][x] !== 0) return { ok:false, reason:'wall at ' + i };
    if(i > 0){
      var px = path[i-1][0], py = path[i-1][1];
      if(Math.abs(x-px) + Math.abs(y-py) !== 1) return { ok:false, reason:'nonadj at ' + i };
    }
  }
  return { ok:true };
}

function fmtTime(ms){
  if(ms < 0.001) return (ms * 1e6).toFixed(0) + 'ns';
  if(ms < 1)     return (ms * 1000).toFixed(0) + 'us';
  if(ms < 1000)  return ms.toFixed(2) + 'ms';
  return (ms / 1000).toFixed(3) + 's';
}
function fmtNs(ns){
  if(ns < 1000) return ns + 'ns';
  if(ns < 1e6) return (ns/1000).toFixed(0) + 'us';
  if(ns < 1e9) return (ns/1e6).toFixed(ns < 1e7 ? 1 : 0) + 'ms';
  return (ns/1e9).toFixed(1) + 's';
}

function MinHeap(){ this.h = []; }
MinHeap.prototype.push = function(item){
  this.h.push(item);
  var i = this.h.length - 1;
  while(i > 0){
    var p = (i-1) >> 1;
    if(this.h[p][0] <= this.h[i][0]) break;
    var tmp = this.h[p]; this.h[p] = this.h[i]; this.h[i] = tmp;
    i = p;
  }
};
MinHeap.prototype.pop = function(){
  var top = this.h[0];
  var last = this.h.pop();
  if(this.h.length > 0){
    this.h[0] = last;
    var i = 0, n = this.h.length;
    while(true){
      var l = 2*i+1, r = 2*i+2, s = i;
      if(l < n && this.h[l][0] < this.h[s][0]) s = l;
      if(r < n && this.h[r][0] < this.h[s][0]) s = r;
      if(s === i) break;
      var tmp = this.h[s]; this.h[s] = this.h[i]; this.h[i] = tmp;
      i = s;
    }
  }
  return top;
};
Object.defineProperty(MinHeap.prototype, 'size', { get: function(){ return this.h.length; } });

// =============== A* ===============
function AStar(g, start, goal){
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W;
  var k0 = start[1]*W + start[0];
  this.k0 = k0;
  this.open = new MinHeap();
  this.open.push([manhattan(start,goal), 0, start]);
  this.gMap = {}; this.gMap[k0] = 0;
  this.came = {};
  this.closed = {};
  this.visited = {}; this.generated = {}; this.expanded = {}; this.frontier = {};
  this.visited[k0] = true; this.generated[k0] = true; this.frontier[k0] = true;
  this.done = false; this.exhausted = false; this.path = null; this.algMs = 0;
  this._visitedCount = 1;
  this._generatedCount = 1;
  this._expandedCount = 0;
  this._frontierCount = 1;
  this._recording = false;
  this._deltaVisited = [];
  this._deltaFrontier = [];
  this._deltaFrontierRemoved = [];
  this._deltaDead = [];
  this._pathValid = undefined;
  this._pathReason = undefined;
}
AStar.prototype.step = function(budget){
  var t0 = performance.now();
  var spent = 0;
  var g = this.grid, W = this.W, H = this.H;
  var rec = this._recording;
  while(spent < budget && !this.done){
    if(this.open.size === 0){ this.done = true; this.exhausted = true; break; }
    var item = this.open.pop();
    var gcost = item[1]; var c = item[2]; var kc = c[1]*W + c[0];
    if(this.closed[kc]) continue;
    this.closed[kc] = true;
    this.visited[kc] = true;
    this.expanded[kc] = true;
    this._expandedCount++;
    if(this.frontier[kc]){
      delete this.frontier[kc];
      this._frontierCount--;
      if(rec) this._deltaFrontierRemoved.push(kc);
    }
    spent++;
    if(c[0] === this.goal[0] && c[1] === this.goal[1]){ this.done = true; this._recon(c); break; }
    for(var i=0; i<N4.length; i++){
      var nx = c[0] + N4[i][0];
      var ny = c[1] + N4[i][1];
      if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      if(g[ny][nx] !== 0) continue;
      var ng = gcost + 1;
      var kn = ny * W + nx;
      if(this.closed[kn]) continue;
      var cur = this.gMap[kn];
      if(cur === undefined || ng < cur){
        this.gMap[kn] = ng;
        this.came[kn] = c;
        this.open.push([ng + manhattan([nx,ny], this.goal), ng, [nx,ny]]);
        if(!this.frontier[kn]){ this.frontier[kn] = true; this._frontierCount++; if(rec) this._deltaFrontier.push(kn); }
        if(!this.generated[kn]){ this.generated[kn] = true; this._generatedCount++; }
        if(!this.visited[kn]){ this.visited[kn] = true; this._visitedCount++; if(rec) this._deltaVisited.push(kn); }
      }
    }
  }
  this.algMs += performance.now() - t0;
};
AStar.prototype._recon = function(end){
  var p = []; var c = end; var W = this.W;
  while(c){ p.push(c); c = this.came[c[1]*W + c[0]]; }
  p.reverse(); this.path = p;
};

// =============== LSB ===============
function Branch(cell, path, cameFrom, N, parentPathSet, W){
  this.cell = cell;
  this.k = cell[1] * W + cell[0];
  this.path = path.slice();
  this.cameFrom = cameFrom;
  this.W = W;
  if(parentPathSet){
    this.pathSet = new Uint8Array(N);
    this.pathSet.set(parentPathSet);
  } else {
    this.pathSet = new Uint8Array(N);
    for(var i=0; i<this.path.length; i++){
      var c = this.path[i];
      this.pathSet[c[1]*W + c[0]] = 1;
    }
  }
  this.stack = [];
  this.parked = false;
  this.scoreCache = 0;
  this.depth = this.path.length - 1;
  this.lastForkDepth = -999;
}
Branch.prototype.clone = function(N){
  var b = new Branch(this.cell, this.path, this.cameFrom, N, this.pathSet, this.W);
  b.k = this.k;
  b.scoreCache = this.scoreCache;
  b.depth = this.depth;
  b.lastForkDepth = this.lastForkDepth;
  for(var i=0; i<this.stack.length; i++){
    var s = this.stack[i];
    b.stack.push({
      cell: s.cell, k: s.k,
      options: s.options.slice(),
      nextIdx: s.nextIdx,
      pathIdx: s.pathIdx
    });
  }
  return b;
};

function LSB(g, start, goal){
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W, H = this.H;
  var N = W * H;
  this.N = N;

  var scale = Math.max(1, Math.floor((W*H) / 3000));
  this.max_branches      = 16 * scale;
  this.max_parked        = 100 * scale;
  this.scar_threshold    = 2.5;
  this.scar_decay        = 0.004;
  this.tryEps            = 0.5;
  this.minActive         = 4 * scale;
  this.stallThreshold    = 200 * scale;

  var dtg = new Float32Array(N);
  var gx = goal[0], gy = goal[1];
  for(var y=0; y<H; y++){
    var dy = y - gy; var base = y * W;
    for(var x=0; x<W; x++){ var dx = x - gx; dtg[base + x] = Math.sqrt(dx*dx + dy*dy); }
  }
  this.dtg = dtg;
  this.goalK = goal[1]*W + goal[0];

  var openCount = new Uint8Array(N);
  for(var yy=0; yy<H; yy++){
    var bb = yy * W;
    for(var xx=0; xx<W; xx++){
      if(g[yy][xx] !== 0) continue;
      var c = 0;
      if(xx + 1 < W && g[yy][xx + 1] === 0) c++;
      if(xx - 1 >= 0 && g[yy][xx - 1] === 0) c++;
      if(yy + 1 < H && g[yy + 1][xx] === 0) c++;
      if(yy - 1 >= 0 && g[yy - 1][xx] === 0) c++;
      openCount[bb + xx] = c;
    }
  }
  this.openCount = openCount;

  var openMinX = W, openMaxX = -1, openMinY = H, openMaxY = -1;
  for(var oy=0; oy<H; oy++){
    for(var ox=0; ox<W; ox++){
      if(g[oy][ox] === 0){
        if(ox < openMinX) openMinX = ox;
        if(ox > openMaxX) openMaxX = ox;
        if(oy < openMinY) openMinY = oy;
        if(oy > openMaxY) openMaxY = oy;
      }
    }
  }
  this.openMinX = openMinX; this.openMaxX = openMaxX;
  this.openMinY = openMinY; this.openMaxY = openMaxY;

  this.visited   = new Uint8Array(N);
  this.generated = new Uint8Array(N);
  this.expanded  = new Uint8Array(N);
  this.dead      = new Uint8Array(N);
  this.cutDead   = new Uint8Array(N);
  this.frontier  = new Uint8Array(N);
  this.scar      = new Float32Array(N);
  this.scarKeys  = {};

  this._visitedCount = 0;
  this._generatedCount = 0;
  this._expandedCount = 0;
  this._frontierCount = 0;
  this._deadCount = 0;

  this._recording = false;
  this._deltaVisited = [];
  this._deltaFrontier = [];
  this._deltaFrontierRemoved = [];
  this._deltaDead = [];

  this._pathValid = undefined;
  this._pathReason = undefined;

  this.vMinX = W; this.vMaxX = -1; this.vMinY = H; this.vMaxY = -1;
  this._frontierKeys = [];

  var k0 = start[1]*W + start[0];
  this.visited[k0] = 1; this._visitedCount++;
  this.generated[k0] = 1; this._generatedCount++;
  this.vMinX = this.vMaxX = start[0];
  this.vMinY = this.vMaxY = start[1];

  var b = new Branch(start, [start], null, N, null, W);
  b.scoreCache = dtg[b.k];
  this.branches = [b];
  this._frontierKeys = [b.k];
  this.frontier[b.k] = 1;
  this._frontierCount = 1;

  this.parked = [];
  this.archive = [];
  this.done = false; this.exhausted = false; this.path = null;
  this.tick = 0; this.lastNovelTick = 0;
  this.backtracks = 0; this.parks = 0; this.resumes = 0; this.kills = 0;
  this.earlyDeaths = 0;
  this.deadEndStreak = 0;
  this.archived = 0;
  this.revived = 0;

  this.cutCheckTick = 0;
  this.lastCutCheckVisited = 0;
  this.cutsMade = 0;
  this.cutCellsPruned = 0;
  this.cutKilledBranches = 0;
  this.cutChecksRun = 0;
  this.cutGateSkips = 0;

  this.layerMedian = 0;
  this.parkedFull = false;

  this.algMs = 0;
}

LSB.prototype._addGenerated = function(k){
  if(!this.visited[k]){
    this.visited[k] = 1; this._visitedCount++;
    this.generated[k] = 1; this._generatedCount++;
    if(this._recording) this._deltaVisited.push(k);
    var W = this.W;
    var x = k % W, y = (k - x) / W;
    if(x < this.vMinX) this.vMinX = x;
    if(x > this.vMaxX) this.vMaxX = x;
    if(y < this.vMinY) this.vMinY = y;
    if(y > this.vMaxY) this.vMaxY = y;
  }
};

LSB.prototype._markDead = function(k){
  if(!this.dead[k]){
    this.dead[k] = 1;
    this._deadCount++;
    if(this._recording) this._deltaDead.push(k);
  }
};

LSB.prototype._unpark = function(n){
  this.parked.sort(function(a,b){ return a.scoreCache - b.scoreCache; });
  var take = Math.min(n, this.parked.length);
  for(var j=0; j<take; j++){
    var b = this.parked.shift();
    b.parked = false;
    this.branches.push(b);
    this.resumes++;
  }
};

LSB.prototype._reviveFromArchive = function(n){
  if(this.archive.length === 0) return 0;
  this.archive.sort(function(a,b){ return a.scoreCache - b.scoreCache; });
  var take = Math.min(n, this.archive.length);
  for(var j=0; j<take; j++){
    var b = this.archive.shift();
    b.parked = false;
    b.lastForkDepth = -999;
    this.branches.push(b);
    this.revived++;
  }
  return take;
};

LSB.prototype._shouldPark = function(b){
  if(this.branches.length <= this.minActive) return false;
  if(this.parkedFull) return false;
  return b.scoreCache > this.layerMedian * 1.5;
};

LSB.prototype._checkForCuts = function(){
  var W = this.W, H = this.H;
  var N = this.N;
  this.cutChecksRun++;

  var canV = this.vMinY <= this.openMinY && this.vMaxY >= this.openMaxY;
  var canH = this.vMinX <= this.openMinX && this.vMaxX >= this.openMaxX;
  if(!canV && !canH){ this.cutGateSkips++; return; }

  if(this._visitedCount - this.lastCutCheckVisited < CUT_MIN_VISITED_DELTA) return;
  this.lastCutCheckVisited = this._visitedCount;

  var parent = new Int32Array(N);
  for(var i=0; i<N; i++) parent[i] = i;
  function find(x){
    var r = x;
    while(parent[r] !== r) r = parent[r];
    while(parent[x] !== r){ var nx = parent[x]; parent[x] = r; x = nx; }
    return r;
  }
  function union(a, b){
    var ra = find(a), rb = find(b);
    if(ra !== rb) parent[ra] = rb;
  }

  for(var y=0; y<H; y++){
    var base = y * W;
    for(var x=0; x<W; x++){
      var k = base + x;
      if(!this.visited[k]) continue;
      if(x + 1 < W && this.visited[k + 1]) union(k, k + 1);
      if(y + 1 < H && this.visited[k + W]) union(k, k + W);
    }
  }

  var bbox = {};
  for(var yy=0; yy<H; yy++){
    var b2 = yy * W;
    for(var xx=0; xx<W; xx++){
      var kk = b2 + xx;
      if(!this.visited[kk]) continue;
      var r = find(kk);
      var bb = bbox[r];
      if(!bb){ bb = { minX: xx, maxX: xx, minY: yy, maxY: yy }; bbox[r] = bb; }
      else {
        if(xx < bb.minX) bb.minX = xx;
        if(xx > bb.maxX) bb.maxX = xx;
        if(yy < bb.minY) bb.minY = yy;
        if(yy > bb.maxY) bb.maxY = yy;
      }
    }
  }

  var cutRoots = {};
  var anyCut = false;
  var oMinX = this.openMinX, oMaxX = this.openMaxX;
  var oMinY = this.openMinY, oMaxY = this.openMaxY;
  for(var r2 in bbox){
    var b3 = bbox[r2];
    if(b3.minY <= oMinY && b3.maxY >= oMaxY){ cutRoots[r2] = 'V'; anyCut = true; }
    else if(b3.minX <= oMinX && b3.maxX >= oMaxX){ cutRoots[r2] = 'H'; anyCut = true; }
  }
  if(!anyCut) return;

  var inCut = new Uint8Array(N);
  for(var y3=0; y3<H; y3++){
    var b4 = y3 * W;
    for(var x3=0; x3<W; x3++){
      var k3 = b4 + x3;
      if(!this.visited[k3]) continue;
      var r3 = find(k3);
      if(cutRoots[r3]) inCut[k3] = 1;
    }
  }

  var goalK = this.goalK;
  var reached = new Uint8Array(N);
  var queue = new Int32Array(N);
  var qh = 0, qt = 0;
  queue[qt++] = goalK;
  reached[goalK] = 1;
  while(qh < qt){
    var kc = queue[qh++];
    var cx = kc % W, cy = (kc - cx) / W;
    for(var di=0; di<4; di++){
      var nx2 = cx + N4[di][0], ny2 = cy + N4[di][1];
      if(nx2 < 0 || nx2 >= W || ny2 < 0 || ny2 >= H) continue;
      if(this.grid[ny2][nx2] !== 0) continue;
      var nk = ny2 * W + nx2;
      if(reached[nk]) continue;
      if(inCut[nk]) continue;
      reached[nk] = 1;
      queue[qt++] = nk;
    }
  }

  var pruned = 0;
  for(var y4=0; y4<H; y4++){
    var b5 = y4 * W;
    for(var x4=0; x4<W; x4++){
      var k4 = b5 + x4;
      if(this.grid[y4][x4] !== 0) continue;
      if(reached[k4]) continue;
      if(inCut[k4]) continue;
      if(this.visited[k4]) continue;
      if(this.dead[k4]) continue;
      this.dead[k4] = 1;
      this._deadCount++;
      if(this._recording) this._deltaDead.push(k4);
      this.cutDead[k4] = 1;
      this.scar[k4] += 0.5;
      this.scarKeys[k4] = 1;
      pruned++;
    }
  }

  var survivingActive = [];
  for(var bi2=0; bi2<this.branches.length; bi2++){
    var br = this.branches[bi2];
    if(reached[br.k] || inCut[br.k]) survivingActive.push(br);
    else this.cutKilledBranches++;
  }
  this.branches = survivingActive;

  var survivingParked = [];
  for(var pi2=0; pi2<this.parked.length; pi2++){
    var pb = this.parked[pi2];
    if(reached[pb.k] || inCut[pb.k]) survivingParked.push(pb);
    else this.cutKilledBranches++;
  }
  this.parked = survivingParked;

  var survivingArchive = [];
  for(var ai=0; ai<this.archive.length; ai++){
    var ab = this.archive[ai];
    if(reached[ab.k] || inCut[ab.k]) survivingArchive.push(ab);
    else this.cutKilledBranches++;
  }
  this.archive = survivingArchive;

  if(pruned > 0){
    this.cutsMade++;
    this.cutCellsPruned += pruned;
  }
};

LSB.prototype.step = function(budget){
  var t0 = performance.now();
  var W = this.W, H = this.H, N = this.N;
  var rec = this._recording;
  for(var i=0; i<budget && !this.done; i++){
    if(this.branches.length < this.minActive && this.parked.length > 0){
      this._unpark(this.minActive - this.branches.length);
    }
    if(this.branches.length === 0){
      if(this.parked.length > 0){
        this._unpark(this.minActive);
      } else if(this.archive.length > 0){
        this._reviveFromArchive(this.minActive);
      } else {
        this.done = true; this.exhausted = true; break;
      }
    }

    this.tick++;
    var novelBefore = this._visitedCount;
    var oldBranches = this.branches;
    var ol = oldBranches.length;

    var scores = new Array(ol);
    for(var si=0; si<ol; si++) scores[si] = oldBranches[si].scoreCache;
    scores.sort(function(a,b){ return a - b; });
    this.layerMedian = scores[Math.floor(ol / 2)];
    this.parkedFull = this.parked.length >= this.max_parked;

    var next = [];
    var stop = false;
    for(var bi=0; bi<ol; bi++){
      this.stepBranch(oldBranches[bi], next);
      if(this.done){ stop = true; break; }
    }
    if(stop) break;

    if(next.length > this.max_branches){
      next.sort(function(a,b){ return a.scoreCache - b.scoreCache; });
    }
    var overflow = [];
    if(next.length > this.max_branches){
      overflow = next.slice(this.max_branches);
      next.length = this.max_branches;
    }
    this.branches = next;

    for(var oi=0; oi<overflow.length; oi++){
      var ob = overflow[oi];
      if(this.parked.length < this.max_parked){
        ob.parked = true; this.parked.push(ob); this.parks++;
      } else if(this.archive.length < MAX_ARCHIVE){
        this.archive.push(ob);
        this.archived++;
      } else {
        for(var pc=0; pc<ob.path.length; pc++){
          var c = ob.path[pc];
          var k = c[1]*W + c[0];
          this.scar[k] += 0.5;
          this.scarKeys[k] = 1;
          this._markDead(k);
        }
        this.kills++;
      }
    }

    var newKeys = new Array(this.branches.length);
    for(var fj=0; fj<this.branches.length; fj++) newKeys[fj] = this.branches[fj].k;
    var newSet = {};
    for(var fj=0; fj<newKeys.length; fj++) newSet[newKeys[fj]] = 1;
    var oldSet = {};
    for(var fi=0; fi<this._frontierKeys.length; fi++) oldSet[this._frontierKeys[fi]] = 1;

    for(var fi=0; fi<this._frontierKeys.length; fi++){
      var kk = this._frontierKeys[fi];
      if(!newSet[kk] && this.frontier[kk]){
        this.frontier[kk] = 0;
        this._frontierCount--;
        if(rec) this._deltaFrontierRemoved.push(kk);
      }
    }
    for(var fj=0; fj<newKeys.length; fj++){
      var kk = newKeys[fj];
      if(!oldSet[kk] && !this.frontier[kk]){
        this.frontier[kk] = 1;
        this._frontierCount++;
        if(rec) this._deltaFrontier.push(kk);
      }
    }
    this._frontierKeys = newKeys;

    var novelAfter = this._visitedCount;
    if(novelAfter > novelBefore){
      this.lastNovelTick = this.tick;
      this.deadEndStreak = 0;
    } else {
      this.deadEndStreak++;
    }

    if(this.deadEndStreak >= REVIVE_DEADEND_THRESHOLD){
      if(this.parked.length > 0){
        this._unpark(REVIVE_BATCH);
      } else if(this.archive.length > 0){
        this._reviveFromArchive(REVIVE_BATCH);
      }
      this.deadEndStreak = 0;
    }

    if(this.tick - this.lastNovelTick > this.stallThreshold && this.parked.length > 0){
      this._unpark(this.minActive);
      this.lastNovelTick = this.tick;
    }

    if(this.scar_decay > 0 && this.tick % 300 === 0){
      for(var sk in this.scarKeys){
        var kv = parseInt(sk, 10);
        var v = this.scar[kv] * (1 - this.scar_decay * 5);
        if(v < 0.05){ this.scar[kv] = 0; delete this.scarKeys[sk]; }
        else this.scar[kv] = v;
      }
    }

    if(this.tick - this.cutCheckTick >= CUT_CHECK_INTERVAL){
      this.cutCheckTick = this.tick;
      this._checkForCuts();
    }
  }
  this.algMs += performance.now() - t0;
};

LSB.prototype.stepBranch = function(b, next){
  var W = this.W, H = this.H, N = this.N;
  if(b.k === this.goalK){ this.done = true; this.path = b.path; return; }
  if(!this.expanded[b.k]){ this.expanded[b.k] = 1; this._expandedCount++; }

  var x0 = b.cell[0], y0 = b.cell[1];
  var grid = this.grid;
  var openCount = this.openCount;
  var pathSet = b.pathSet;
  var opts = [];

  for(var i=0; i<4; i++){
    var nx = x0 + N4[i][0];
    var ny = y0 + N4[i][1];
    if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if(grid[ny][nx] !== 0) continue;
    var kk = ny * W + nx;
    if(pathSet[kk]) continue;
    if(kk === this.goalK){ opts.push([nx, ny, kk]); continue; }
    if(this.dead[kk]) continue;
    if(openCount[kk] <= 1){
      this.scar[kk] += 1.0;
      this.scarKeys[kk] = 1;
      this._markDead(kk);
      this.earlyDeaths++;
      continue;
    }
    opts.push([nx, ny, kk]);
  }

  if(opts.length === 0){
    if(this.backtrack(b, next)) return;
    next.push(b);
    return;
  }

  var dtg = this.dtg;
  opts.sort(function(p, q){ return dtg[p[2]] - dtg[q[2]]; });
  var primary = opts[0];

  var canFork = (b.depth - b.lastForkDepth) >= FORK_COOLDOWN;

  if(opts.length > 1 && canFork){
    var bestD = dtg[primary[2]];
    var tiedCount = 1;
    for(var ti=1; ti<opts.length; ti++) if(Math.abs(dtg[opts[ti][2]] - bestD) < this.tryEps) tiedCount++;

    if(tiedCount > 1){
      var wrote = 1;
      for(var k2=1; k2<opts.length && wrote<tiedCount; k2++){
        if(Math.abs(dtg[opts[k2][2]] - bestD) >= this.tryEps) continue;
        var nb = b.clone(N);
        var nt = opts[k2];
        nb.stack.push({
          cell: b.cell, k: b.k,
          options: opts.slice(),
          nextIdx: tiedCount,
          pathIdx: b.path.length - 1
        });
        nb.path.push(nt);
        nb.pathSet[nt[2]] = 1;
        nb.cameFrom = b.cell;
        nb.cell = nt; nb.k = nt[2];
        nb.depth = b.depth + 1;
        nb.lastForkDepth = nb.depth;
        nb.scoreCache = dtg[nt[2]] + 0.25 * nb.depth;
        this._addGenerated(nt[2]);
        next.push(nb);
        wrote++;
      }
      b.stack.push({
        cell: b.cell, k: b.k,
        options: opts,
        nextIdx: tiedCount,
        pathIdx: b.path.length - 1
      });
      b.lastForkDepth = b.depth;
    } else {
      b.stack.push({
        cell: b.cell, k: b.k,
        options: opts,
        nextIdx: 1,
        pathIdx: b.path.length - 1
      });
    }
  } else if(opts.length > 1){
    b.stack.push({
      cell: b.cell, k: b.k,
      options: opts,
      nextIdx: 1,
      pathIdx: b.path.length - 1
    });
  }

  b.path.push(primary);
  b.pathSet[primary[2]] = 1;
  b.cameFrom = b.cell;
  b.cell = primary; b.k = primary[2];
  b.depth++;
  b.scoreCache = dtg[primary[2]] + 0.25 * b.depth;
  this._addGenerated(primary[2]);

  if(b.k === this.goalK){ this.done = true; this.path = b.path; return; }

  if(this._shouldPark(b)){
    if(this.parked.length < this.max_parked){
      b.parked = true; this.parked.push(b); this.parks++;
      return;
    }
  }
  next.push(b);
};

LSB.prototype.backtrack = function(b, next){
  var W = this.W;
  this.backtracks++;
  this.deadEndStreak++;
  while(b.stack.length > 0){
    var top = b.stack[b.stack.length - 1];
    if(top.nextIdx < top.options.length){
      var nt = top.options[top.nextIdx];
      top.nextIdx++;
      if(this.dead[nt[2]] && nt[2] !== this.goalK) continue;

      for(var i = b.path.length - 1; i > top.pathIdx; i--){
        var c = b.path[i];
        b.pathSet[c[1]*W + c[0]] = 0;
      }
      b.path.length = top.pathIdx + 1;
      b.path.push(nt);
      b.pathSet[nt[2]] = 1;
      b.cameFrom = top.cell;
      b.cell = nt; b.k = nt[2];
      b.depth = b.path.length - 1;
      b.scoreCache = this.dtg[nt[2]] + 0.25 * b.depth;
      this._addGenerated(nt[2]);
      if(b.k === this.goalK){ this.done = true; this.path = b.path; return false; }
      return false;
    }
    b.stack.pop();
  }
  for(var j=0; j<b.path.length; j++){
    var c2 = b.path[j];
    var k2 = c2[1]*W + c2[0];
    this.scar[k2] += 0.5;
    this.scarKeys[k2] = 1;
    this._markDead(k2);
  }
  this.kills++;
  return true;
};

// =============== stats ===============
function getStats(algo, isLSB){
  var validPath;
  if(!algo.path){
    validPath = { ok:false, reason:'no path' };
  } else if(algo._pathValid !== undefined){
    validPath = { ok:algo._pathValid, reason:algo._pathReason };
  } else {
    validPath = validatePath(algo.grid, algo.path, algo.start, algo.goal, algo.W, algo.H);
    algo._pathValid = validPath.ok;
    algo._pathReason = validPath.reason;
  }
  return {
    expanded: algo._expandedCount,
    generated: algo._generatedCount,
    uniqueVisited: algo._visitedCount,
    pathLen: algo.path ? algo.path.length : null,
    pathValid: validPath.ok,
    pathReason: validPath.reason,
    success: algo.done && validPath.ok,
    exhausted: !!algo.exhausted,
    done: algo.done,
    frontier: algo._frontierCount,
    backtracks: isLSB ? algo.backtracks : null,
    parks: isLSB ? algo.parks : null,
    resumes: isLSB ? algo.resumes : null,
    kills: isLSB ? algo.kills : null,
    earlyDeaths: isLSB ? algo.earlyDeaths : null,
    cutsMade: isLSB ? algo.cutsMade : null,
    cutCellsPruned: isLSB ? algo.cutCellsPruned : null,
    cutKilledBranches: isLSB ? algo.cutKilledBranches : null,
    cutChecksRun: isLSB ? algo.cutChecksRun : null,
    cutGateSkips: isLSB ? algo.cutGateSkips : null,
    archived: isLSB ? algo.archived : null,
    revived: isLSB ? algo.revived : null,
    archiveSize: isLSB ? algo.archive.length : null,
    parkedCount: isLSB ? algo.parked.length : null,
    algMs: algo.algMs,
    isLSB: isLSB
  };
}

// =============== recording (lockstep + timestamps) ===============
function initFrame(algo, isLSB, t_ms){
  return {
    t_ms: t_ms,
    addVisited: keysOf(algo.visited),
    addFrontier: keysOf(algo.frontier),
    remFrontier: [],
    addDead: isLSB ? keysOf(algo.dead) : [],
    path: algo.path ? algo.path.slice() : null,
    parked: isLSB && algo.parked ? algo.parked.map(function(b){ return b.k; }) : null,
    stats: getStats(algo, isLSB)
  };
}

function makeFrame(algo, isLSB, t_ms){
  var addVisited = algo._deltaVisited; algo._deltaVisited = [];
  var addFrontier = algo._deltaFrontier; algo._deltaFrontier = [];
  var remFrontier = algo._deltaFrontierRemoved; algo._deltaFrontierRemoved = [];
  var addDead = algo._deltaDead; algo._deltaDead = [];
  return {
    t_ms: t_ms,
    addVisited: addVisited,
    addFrontier: addFrontier,
    remFrontier: remFrontier,
    addDead: addDead,
    path: algo.path ? algo.path.slice() : null,
    parked: isLSB && algo.parked ? algo.parked.map(function(b){ return b.k; }) : null,
    stats: getStats(algo, isLSB)
  };
}

function buildRecording(){
  var a = new AStar(grid, START, GOAL);
  var l = new LSB(grid, START, GOAL);
  a._recording = true; l._recording = true;

  var framesA = [ initFrame(a, false, 0) ];
  var framesL = [ initFrame(l, true, 0) ];

  while((!a.done || !l.done) && framesA.length < RECORD_MAX_FRAMES){
    if(!a.done) a.step(RECORD_BUDGET);
    if(!l.done) l.step(RECORD_BUDGET);
    var t_ms = Math.max(a.algMs, l.algMs);
    framesA.push(makeFrame(a, false, t_ms));
    framesL.push(makeFrame(l, true, t_ms));
  }

  a._recording = false; l._recording = false;

  return {
    framesA: framesA,
    framesL: framesL,
    ticks: framesA.length,
    totalMs: Math.max(a.algMs, l.algMs),
    grid: grid, START: START, GOAL: GOAL, W: W, H: H
  };
}

// =============== playback ===============
var recording = null;
var playbackIdx = -1;
var playbackMs = 0;
var paused = false;
var finished = false;
var lastFrameTime = 0;

var playbackA = { visited:{}, frontier:{}, dead:{} };
var playbackL = { visited:{}, frontier:{}, dead:{} };
var currentA = { path:null, parked:null, stats:null };
var currentL = { path:null, parked:null, stats:null };

function applyFrame(state, frame){
  for(var i=0; i<frame.addVisited.length; i++) state.visited[frame.addVisited[i]] = true;
  for(var j=0; j<frame.addFrontier.length; j++) state.frontier[frame.addFrontier[j]] = true;
  for(var k=0; k<frame.remFrontier.length; k++) delete state.frontier[frame.remFrontier[k]];
  for(var m=0; m<frame.addDead.length; m++) state.dead[frame.addDead[m]] = true;
}

// Advance to the latest frame whose t_ms <= target_ms (monotonic).
function advanceToTime(target_ms){
  var lastIdx = recording.ticks - 1;
  while(playbackIdx < lastIdx && recording.framesA[playbackIdx + 1].t_ms <= target_ms){
    playbackIdx++;
    var fa = recording.framesA[playbackIdx];
    var fl = recording.framesL[playbackIdx];
    applyFrame(playbackA, fa);
    applyFrame(playbackL, fl);
    currentA.path = fa.path; currentA.parked = fa.parked; currentA.stats = fa.stats;
    currentL.path = fl.path; currentL.parked = fl.parked; currentL.stats = fl.stats;
  }
}

function resetPlayback(){
  playbackIdx = -1;
  playbackMs = 0;
  playbackA = { visited:{}, frontier:{}, dead:{} };
  playbackL = { visited:{}, frontier:{}, dead:{} };
  currentA = { path:null, parked:null, stats:null };
  currentL = { path:null, parked:null, stats:null };
  advanceToTime(0);
}

// =============== rendering ===============
var cA = document.getElementById('cA');
var cL = document.getElementById('cL');
var ctxA = cA.getContext('2d');
var ctxL = cL.getContext('2d');

var COLOR = {
  wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', parked:'#f80', visited:'#2a4a7a', path:'#0ff', dead:'#a00'
};

function draw(ctx, g, view, path, parked, W, H){
  ctx.fillStyle = COLOR.open;
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  var pathSet = {};
  if(path){ for(var pi=0; pi<path.length; pi++) pathSet[path[pi][1]*W + path[pi][0]] = true; }
  var parkedSet = {};
  if(parked){ for(var qi=0; qi<parked.length; qi++) parkedSet[parked[qi]] = true; }
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      var k = y*W + x;
      var col = null;
      if(g[y][x] === 1) col = COLOR.wall;
      else if(view.dead[k]) col = COLOR.dead;
      else if(view.visited[k]) col = COLOR.visited;
      if(parkedSet[k]) col = COLOR.parked;
      if(view.frontier[k]) col = COLOR.frontier;
      if(pathSet[k]) col = COLOR.path;
      if(x === START[0] && y === START[1]) col = COLOR.start;
      if(x === GOAL[0] && y === GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle = col; ctx.fillRect(x*CELL, y*CELL, CELL, CELL); }
    }
  }
}

function fmtStats(stats){
  if(!stats) return '';
  var s = 'expanded: <b>' + stats.expanded + '</b><br>';
  if(stats.generated !== null) s += 'generated: <b>' + stats.generated + '</b><br>';
  s += 'path: <b>' + (stats.pathLen !== null ? stats.pathLen : '-') + '</b>';
  if(stats.done) s += stats.pathValid ? ' <span style="color:#6f6">valid</span>' : ' <span style="color:#f88">invalid</span>';
  s += '<br>frontier: <b>' + stats.frontier + '</b><br>';
  if(stats.isLSB){
    s += 'bt: <b>' + stats.backtracks + '</b>  parks: <b>' + stats.parks + '</b>  res: <b>' + stats.resumes + '</b><br>';
    s += 'kills: <b>' + stats.kills + '</b>  parked: <b>' + stats.parkedCount + '</b><br>';
    s += 'early dead: <b>' + stats.earlyDeaths + '</b><br>';
    s += 'archive: <b>' + stats.archiveSize + '</b>  archived: <b>' + stats.archived + '</b>  revived: <b>' + stats.revived + '</b><br>';
    s += 'cuts: <b>' + stats.cutsMade + '</b>  checks: <b>' + stats.cutChecksRun + '</b>  gate-skips: <b>' + stats.cutGateSkips + '</b>  pruned: <b>' + stats.cutCellsPruned + '</b><br>';
    s += 'cut-killed branches: <b>' + stats.cutKilledBranches + '</b><br>';
  }
  s += 'done: <b>' + stats.done + '</b>';
  if(stats.exhausted) s += ' <span style="color:#f88">(exhausted)</span>';
  if(stats.done) s += '  success: <b>' + (stats.success ? 'yes' : 'NO') + '</b>';
  s += '<br>alg time (recorded): <b>' + fmtTime(stats.algMs) + '</b>';
  return s;
}

function renderCurrent(){
  draw(ctxA, recording.grid, playbackA, currentA.path, currentA.parked, recording.W, recording.H);
  draw(ctxL, recording.grid, playbackL, currentL.path, currentL.parked, recording.W, recording.H);
  var showA = finished ? recording.framesA[recording.framesA.length - 1].stats : currentA.stats;
  var showL = finished ? recording.framesL[recording.framesL.length - 1].stats : currentL.stats;
  document.getElementById('sA').innerHTML = fmtStats(showA);
  document.getElementById('sL').innerHTML = fmtStats(showL);
  if(recording){
    var total = recording.totalMs;
    var meta = 't = ' + fmtTime(playbackMs) + ' / ' + fmtTime(total) +
               '   frame ' + (playbackIdx < 0 ? 0 : playbackIdx) + ' / ' + (recording.ticks - 1) +
               '   wall clock (record): <b>' + fmtTime(recording.computeMs || 0) + '</b>';
    document.getElementById('metaA').innerHTML = meta;
    document.getElementById('metaL').innerHTML = meta;
  }
}

function setNsPerFrame(ns){
  NS_PER_FRAME = ns;
  var btns = document.querySelectorAll('.speed-btn');
  for(var i=0; i<btns.length; i++){
    var v = parseFloat(btns[i].getAttribute('data-ns'));
    btns[i].className = (v === ns) ? 'speed-btn speed-on' : 'speed-btn';
  }
}

function setSize(w, h){
  W = w; H = h;
  CELL = Math.max(2, Math.floor(600 / W));
  cA.width = W * CELL; cA.height = H * CELL;
  cL.width = W * CELL; cL.height = H * CELL;
  var btns = document.querySelectorAll('.size-btn');
  for(var i=0; i<btns.length; i++){
    var bw = parseInt(btns[i].getAttribute('data-w'),10);
    var bh = parseInt(btns[i].getAttribute('data-h'),10);
    btns[i].className = (bw === W && bh === H) ? 'size-btn size-on' : 'size-btn';
  }
  setScenario('maze_any');
}

function setScenario(name){
  if(name === 'open'){        START = [0,0]; GOAL = [W-1,H-1]; grid = makeOpen(); }
  else if(name === 'sparse'){ START = [0,0]; GOAL = [W-1,H-1]; grid = makeSparse(); }
  else if(name === 'r020'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.20, freshSeed()); }
  else if(name === 'r030'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.30, freshSeed()); }
  else if(name === 'r038'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.38, freshSeed()); }
  else if(name === 'maze_dfs'){     grid = makeMazeDFS(freshSeed());     START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_prim'){    grid = makeMazePrim(freshSeed());    START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_kruskal'){ grid = makeMazeKruskal(freshSeed()); START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_any'){
    var t = MAZE_TYPES[Math.floor(Math.random() * MAZE_TYPES.length)];
    grid = t.fn(freshSeed());
    START = [1,1]; GOAL = [W-3,H-3];
  }
  buildAndPlay();
}
function restartSame(){ buildAndPlay(); }

function buildAndPlay(){
  var banner = document.getElementById('banner');
  banner.style.display = 'block';
  banner.textContent = 'Calculating...';
  document.getElementById('sA').innerHTML = '';
  document.getElementById('sL').innerHTML = '';
  document.getElementById('metaA').innerHTML = '';
  document.getElementById('metaL').innerHTML = '';
  setTimeout(function(){
    var t0 = performance.now();
    recording = buildRecording();
    var computeMs = performance.now() - t0;
    recording.computeMs = computeMs;
    banner.textContent = 'Recorded ' + recording.ticks + ' frames, alg time ' +
                         fmtTime(recording.totalMs) + ' in wall ' + fmtTime(computeMs);
    setTimeout(function(){ banner.style.display = 'none'; }, 2500);
    resetPlayback();
    paused = false; finished = false; lastFrameTime = 0;
    document.getElementById('pauseBtn').innerText = 'Pause';
    renderCurrent();
  }, 20);
}

function togglePause(){
  if(finished) return;
  paused = !paused;
  document.getElementById('pauseBtn').innerText = paused ? 'Resume' : 'Pause';
}

function loop(now){
  requestAnimationFrame(loop);
  if(paused || finished || !recording) return;
  if(now - lastFrameTime < TICK_DELAY) return;
  lastFrameTime = now;

  var total = recording.totalMs;

  if(NS_PER_FRAME >= 1e8){
    playbackMs = total;
    advanceToTime(playbackMs);
    finished = true;
    renderCurrent();
    document.getElementById('pauseBtn').innerText = 'Done';
    return;
  }

  // advance alg-time clock by NS_PER_FRAME each animation frame
  playbackMs += NS_PER_FRAME / 1e6;

  if(playbackMs >= total){
    playbackMs = total;
    advanceToTime(playbackMs);
    finished = true;
    renderCurrent();
    document.getElementById('pauseBtn').innerText = 'Done';
    return;
  }

  advanceToTime(playbackMs);
  renderCurrent();
}

// =============== mass test ===============
var MASS_N = 12;
var MASS_MIN_TIME_MS = 5;
var MASS_MAX_REPS = 30;
var lastSeeds = null;

function runOneOnce(factory, isLSB){
  var algo = factory();
  var iters = 0;
  while(!algo.done && iters < 60000){ algo.step(MASS_BUDGET); iters++; }
  var s = getStats(algo, isLSB);
  return { stats: s, algMs: algo.algMs };
}
function runBench(factory, isLSB){
  var totalMs = 0, reps = 0, last = null;
  while(reps < MASS_MAX_REPS){
    last = runOneOnce(factory, isLSB);
    totalMs += last.algMs; reps++;
    if(totalMs >= MASS_MIN_TIME_MS) break;
  }
  return {
    stats: last.stats,
    avgMs: totalMs / reps, reps: reps
  };
}

function massTest(reuse){
  paused = true;
  document.getElementById('pauseBtn').innerText = 'Resume';
  var out = document.getElementById('results');
  out.style.display = 'block';
  out.textContent = 'Running ' + MASS_N + ' mazes...';
  setTimeout(function(){
    var plans;
    if(reuse && lastSeeds){ plans = lastSeeds.slice(); }
    else {
      plans = [];
      for(var i=0; i<MASS_N; i++){
        var t = MAZE_TYPES[i % MAZE_TYPES.length];
        plans.push({ type: t.name, fn: t.fn, seed: freshSeed() });
      }
      lastSeeds = plans;
    }
    var rows = [];
    var aSuccess = 0, lSuccess = 0, aWins = 0, lWins = 0, ties = 0;
    var acc = { aTime:0, lTime:0, aExp:0, lExp:0, aPath:0, lPath:0, lBT:0, lParks:0, lRes:0, lKills:0, lED:0, lCuts:0, lPruned:0, lCutKill:0, lChecks:0, lGate:0, lArch:0, lReviv:0, n:0 };
    for(var pi=0; pi<plans.length; pi++){
      var plan = plans[pi];
      var g = plan.fn(plan.seed);
      var S = [1,1], G = [W-3, H-3];
      var ra = runBench(function(){ return new AStar(g, S, G); }, false);
      var rl = runBench(function(){ return new LSB(g, S, G); }, true);
      var aOk = ra.stats.success, lOk = rl.stats.success;
      if(aOk) aSuccess++;
      if(lOk) lSuccess++;
      var verdict;
      if(!aOk && !lOk) verdict = 'both FAIL';
      else if(!lOk) verdict = 'A* (LSB fail)';
      else if(!aOk) verdict = 'LSB (A* fail)';
      else if(ra.stats.expanded < rl.stats.expanded){ verdict = 'A*'; aWins++; }
      else if(rl.stats.expanded < ra.stats.expanded){ verdict = 'LSB'; lWins++; }
      else { verdict = 'tie'; ties++; }
      if(aOk && lOk){
        acc.aTime += ra.avgMs; acc.lTime += rl.avgMs;
        acc.aExp += ra.stats.expanded; acc.lExp += rl.stats.expanded;
        acc.aPath += ra.stats.pathLen || 0; acc.lPath += rl.stats.pathLen || 0;
        acc.lBT += rl.stats.backtracks || 0; acc.lParks += rl.stats.parks || 0;
        acc.lRes += rl.stats.resumes || 0; acc.lKills += rl.stats.kills || 0;
        acc.lED += rl.stats.earlyDeaths || 0;
        acc.lCuts += rl.stats.cutsMade || 0;
        acc.lPruned += rl.stats.cutCellsPruned || 0;
        acc.lCutKill += rl.stats.cutKilledBranches || 0;
        acc.lChecks += rl.stats.cutChecksRun || 0;
        acc.lGate += rl.stats.cutGateSkips || 0;
        acc.lArch += rl.stats.archived || 0;
        acc.lReviv += rl.stats.revived || 0;
        acc.n++;
      }
      rows.push({
        type: plan.type, seed: plan.seed,
        aTime: ra.avgMs, lTime: rl.avgMs,
        aReps: ra.reps, lReps: rl.reps,
        aExp: ra.stats.expanded, lExp: rl.stats.expanded,
        aPath: ra.stats.pathLen, lPath: rl.stats.pathLen,
        aSuccess: aOk, lSuccess: lOk, lReason: rl.stats.pathReason,
        lBT: rl.stats.backtracks, lParks: rl.stats.parks, lRes: rl.stats.resumes, lKills: rl.stats.kills,
        lED: rl.stats.earlyDeaths, lCuts: rl.stats.cutsMade, lPruned: rl.stats.cutCellsPruned,
        lCutKill: rl.stats.cutKilledBranches, lChecks: rl.stats.cutChecksRun, lGate: rl.stats.cutGateSkips,
        lArch: rl.stats.archived, lReviv: rl.stats.revived,
        verdict: verdict
      });
    }
    function pad(s, n){ s = String(s); while(s.length < n) s += ' '; return s.slice(0, n); }
    function padL(s, n){ s = String(s); while(s.length < n) s = ' ' + s; return s.slice(-n); }
    var txt = '';
    txt += 'MASS TEST - ' + MASS_N + ' mazes (' + W + 'x' + H + ')' + (reuse ? '  [reused]' : '  [fresh]') + '\n';
    txt += 'Verdict by expanded-cells. Success requires validated path.\n\n';
    txt += pad('type', 9) + padL('seed', 12) + padL('A*t', 10) + padL('LSBt', 10)
         + padL('A*exp', 8) + padL('LSBexp', 9) + padL('A*pth', 7) + padL('LSBpth', 8)
         + padL('ok', 4) + padL('rep', 7) + padL('LSBbt', 8) + padL('park', 6) + padL('res', 5) + padL('kill', 6)
         + padL('eDead', 7) + padL('chk', 5) + padL('gate', 6) + padL('cuts', 6) + padL('prune', 7) + padL('cKill', 7)
         + padL('arch', 6) + padL('rev', 5)
         + '  verdict\n';
    txt += '------------------------------------------------------------------------------------------------------------------------------------------------------\n';
    for(var ri=0; ri<rows.length; ri++){
      var r = rows[ri];
      txt += pad(r.type, 9) + padL(r.seed.toString(16), 12)
          + padL(fmtTime(r.aTime), 10) + padL(fmtTime(r.lTime), 10)
          + padL(r.aExp, 8) + padL(r.lExp, 9)
          + padL(r.aPath === null ? '-' : r.aPath, 7) + padL(r.lPath === null ? '-' : r.lPath, 8)
          + padL(r.aSuccess && r.lSuccess ? 'Y/Y' : (r.aSuccess ? 'Y/N' : 'N/N'), 4)
          + padL(r.aReps + '/' + r.lReps, 7)
          + padL(r.lBT === null ? '-' : r.lBT, 8) + padL(r.lParks === null ? '-' : r.lParks, 6)
          + padL(r.lRes === null ? '-' : r.lRes, 5) + padL(r.lKills === null ? '-' : r.lKills, 6)
          + padL(r.lED === null ? '-' : r.lED, 7)
          + padL(r.lChecks === null ? '-' : r.lChecks, 5)
          + padL(r.lGate === null ? '-' : r.lGate, 6)
          + padL(r.lCuts === null ? '-' : r.lCuts, 6)
          + padL(r.lPruned === null ? '-' : r.lPruned, 7)
          + padL(r.lCutKill === null ? '-' : r.lCutKill, 7)
          + padL(r.lArch === null ? '-' : r.lArch, 6)
          + padL(r.lReviv === null ? '-' : r.lReviv, 5)
          + '  ' + r.verdict + '\n';
      if(!r.lSuccess && r.lReason && r.lReason !== 'no path') txt += '  LSB path invalid: ' + r.lReason + '\n';
    }
    txt += '------------------------------------------------------------------------------------------------------------------------------------------------------\n';
    if(acc.n > 0){
      txt += pad('AVG', 9) + padL('', 12)
          + padL(fmtTime(acc.aTime/acc.n), 10) + padL(fmtTime(acc.lTime/acc.n), 10)
          + padL(Math.round(acc.aExp/acc.n), 8) + padL(Math.round(acc.lExp/acc.n), 9)
          + padL(Math.round(acc.aPath/acc.n), 7) + padL(Math.round(acc.lPath/acc.n), 8)
          + padL('', 4) + padL('', 7)
          + padL(Math.round(acc.lBT/acc.n), 8) + padL(Math.round(acc.lParks/acc.n), 6)
          + padL(Math.round(acc.lRes/acc.n), 5) + padL(Math.round(acc.lKills/acc.n), 6)
          + padL(Math.round(acc.lED/acc.n), 7)
          + padL(Math.round(acc.lChecks/acc.n), 5)
          + padL(Math.round(acc.lGate/acc.n), 6)
          + padL(Math.round(acc.lCuts/acc.n), 6)
          + padL(Math.round(acc.lPruned/acc.n), 7)
          + padL(Math.round(acc.lCutKill/acc.n), 7)
          + padL(Math.round(acc.lArch/acc.n), 6)
          + padL(Math.round(acc.lReviv/acc.n), 5)
          + '  (n=' + acc.n + ')\n';
    }
    txt += '\nSUCCESS  A*: ' + aSuccess + '/' + MASS_N + '   LSB: ' + lSuccess + '/' + MASS_N + '\n';
    txt += 'WINS  A*: ' + aWins + '   LSB: ' + lWins + '   tie: ' + ties + '\n\n';
    txt += 'Per-type breakdown (both solved):\n';
    for(var mi=0; mi<MAZE_TYPES.length; mi++){
      var t2 = MAZE_TYPES[mi];
      var sub = [];
      for(var si=0; si<rows.length; si++)
        if(rows[si].type === t2.name && rows[si].aSuccess && rows[si].lSuccess) sub.push(rows[si]);
      if(sub.length === 0){ txt += '  ' + pad(t2.name, 9) + '  (none)\n'; continue; }
      var aAvgSum = 0, lAvgSum = 0, lBTSum = 0, lEDSum = 0, lCutsSum = 0, lPrunedSum = 0, lCutKillSum = 0, lChecksSum = 0, lArchSum = 0, lRevivSum = 0;
      for(var xi=0; xi<sub.length; xi++){
        aAvgSum += sub[xi].aExp; lAvgSum += sub[xi].lExp;
        lBTSum += sub[xi].lBT || 0; lEDSum += sub[xi].lED || 0;
        lCutsSum += sub[xi].lCuts || 0; lPrunedSum += sub[xi].lPruned || 0;
        lCutKillSum += sub[xi].lCutKill || 0; lChecksSum += sub[xi].lChecks || 0;
        lArchSum += sub[xi].lArch || 0; lRevivSum += sub[xi].lReviv || 0;
      }
      txt += '  ' + pad(t2.name, 9) + '  A* exp ' + padL(Math.round(aAvgSum/sub.length), 7)
           + '   LSB exp ' + padL(Math.round(lAvgSum/sub.length), 7)
           + '   bt ' + padL(Math.round(lBTSum/sub.length), 6)
           + '   eDead ' + padL(Math.round(lEDSum/sub.length), 6)
           + '   chk ' + padL(Math.round(lChecksSum/sub.length), 4)
           + '   cuts ' + padL(Math.round(lCutsSum/sub.length), 5)
           + '   pruned ' + padL(Math.round(lPrunedSum/sub.length), 6)
           + '   cKill ' + padL(Math.round(lCutKillSum/sub.length), 6)
           + '   arch ' + padL(Math.round(lArchSum/sub.length), 5)
           + '   rev ' + padL(Math.round(lRevivSum/sub.length), 4)
           + '   n=' + sub.length + '\n';
    }
    out.textContent = txt;
  }, 30);
}

setNsPerFrame(10000);
setSize(100, 50);
requestAnimationFrame(loop);
</script>
