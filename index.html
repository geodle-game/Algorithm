<script>
var W = 100, H = 50;
var CELL = 5;
var RECORD_BUDGET = 1;
var RECORD_MAX_FRAMES = 40000;
var MASS_BUDGET = 8;
var MASS_MAX_ITERS = 100000;
var MASS_MIN_TIME_MS = 5;
var MASS_MAX_REPS = 20;
var TICK_DELAY = 16;
var PLAYBACK_SPEED = 1;

var CUT_CHECK_INTERVAL = 500;
var CUT_MIN_VISITED_DELTA = 100;
var FORK_COOLDOWN = 4;
var REVIVE_DEADEND_THRESHOLD = 150;
var REVIVE_BATCH = 6;
var MAX_ARCHIVE = 500;

var SCS_CUT_INTERVAL = 200;
var TSCS_TILE_SIZE = 10;

var LEFT_ALGO = 'A*';
var RIGHT_ALGO = 'TSCS';

var START = [0, 0];
var GOAL = [W-1, H-1];
var grid = null;

function rng(seed){ var s = seed >>> 0; return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
var seedCounter = 0;
function freshSeed(){ seedCounter++; var t = Date.now() >>> 0; var r = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0; return (t ^ r ^ (seedCounter * 2654435761)) >>> 0; }

function makeOpen(){
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(0); g.push(row); }
  return g;
}
function makeSparse(){
  var g = makeOpen();
  var sx = W/60, sy = H/30;
  var blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(var i=0; i<blocks.length; i++){
    var b = blocks[i];
    var x0 = Math.floor(b[0]*sx), y0 = Math.floor(b[1]*sy);
    var x1 = Math.floor(b[2]*sx), y1 = Math.floor(b[3]*sy);
    for(var yy=y0; yy<y1; yy++) for(var xx=x0; xx<x1; xx++)
      if(yy>=0 && yy<H && xx>=0 && xx<W) g[yy][xx] = 1;
  }
  g[0][0] = 0; g[H-1][W-1] = 0;
  return g;
}
function makeRandom(density, seed){
  var r = rng(seed);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(r() < density ? 1 : 0); g.push(row); }
  g[0][0] = 0; g[H-1][W-1] = 0;
  return g;
}
function makeMazeDFS(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  var visited = [];
  for(var yy=0; yy<ry; yy++){ var vr = []; for(var xx=0; xx<rx; xx++) vr.push(false); visited.push(vr); }
  var stack = [[0,0]]; visited[0][0] = true; g[1][1] = 0;
  while(stack.length > 0){
    var top = stack[stack.length-1];
    var cx = top[0], cy = top[1];
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=dirs.length-1; i>0; i--){ var j = Math.floor(r()*(i+1)); var tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp; }
    var moved = false;
    for(var k=0; k<dirs.length; k++){
      var nx = cx + dirs[k][0], ny = cy + dirs[k][1];
      if(nx<0 || nx>=rx || ny<0 || ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dirs[k][1]][cx*2+1+dirs[k][0]] = 0;
      g[ny*2+1][nx*2+1] = 0;
      visited[ny][nx] = true; stack.push([nx,ny]); moved = true; break;
    }
    if(!moved) stack.pop();
  }
  return g;
}
function makeMazePrim(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  var inMaze = [];
  for(var yy=0; yy<ry; yy++){ var vr = []; for(var xx=0; xx<rx; xx++) vr.push(false); inMaze.push(vr); }
  var frontier = [];
  inMaze[0][0] = true; g[1][1] = 0;
  var dirs4 = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs4.length; i++){
    var nx = dirs4[i][0], ny = dirs4[i][1];
    if(nx>=0 && nx<rx && ny>=0 && ny<ry) frontier.push([nx,ny,0,0]);
  }
  while(frontier.length > 0){
    var idx = Math.floor(r() * frontier.length);
    var item = frontier.splice(idx, 1)[0];
    var nx2 = item[0], ny2 = item[1], px = item[2], py = item[3];
    if(inMaze[ny2][nx2]) continue;
    g[ny2*2+1][nx2*2+1] = 0;
    g[py*2+1 + (ny2-py)][px*2+1 + (nx2-px)] = 0;
    inMaze[ny2][nx2] = true;
    for(var k=0; k<dirs4.length; k++){
      var ax = nx2 + dirs4[k][0], ay = ny2 + dirs4[k][1];
      if(ax>=0 && ax<rx && ay>=0 && ay<ry && !inMaze[ay][ax]) frontier.push([ax,ay,nx2,ny2]);
    }
  }
  return g;
}
function makeMazeKruskal(seed){
  var r = rng(seed);
  var rx = Math.floor((W-1)/2), ry = Math.floor((H-1)/2);
  var g = [];
  for(var y=0; y<H; y++){ var row = []; for(var x=0; x<W; x++) row.push(1); g.push(row); }
  for(var yy=0; yy<ry; yy++) for(var xx=0; xx<rx; xx++) g[yy*2+1][xx*2+1] = 0;
  var parent = new Int32Array(rx*ry);
  for(var i=0; i<rx*ry; i++) parent[i] = i;
  function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  var walls = [];
  for(var y2=0; y2<ry; y2++) for(var x2=0; x2<rx; x2++){
    if(x2+1 < rx) walls.push([x2,y2,x2+1,y2]);
    if(y2+1 < ry) walls.push([x2,y2,x2,y2+1]);
  }
  for(var k=walls.length-1; k>0; k--){ var j = Math.floor(r()*(k+1)); var tmp = walls[k]; walls[k] = walls[j]; walls[j] = tmp; }
  for(var wi=0; wi<walls.length; wi++){
    var wall = walls[wi];
    var ra = find(wall[1]*rx + wall[0]);
    var rb = find(wall[3]*rx + wall[2]);
    if(ra !== rb){
      parent[ra] = rb;
      g[wall[1]*2+1 + (wall[3]-wall[1])][wall[0]*2+1 + (wall[2]-wall[0])] = 0;
    }
  }
  return g;
}
var MAZE_TYPES = [
  { name:'DFS',     fn: makeMazeDFS },
  { name:'Prim',    fn: makeMazePrim },
  { name:'Kruskal', fn: makeMazeKruskal }
];

function manhattan(a,b){ return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]); }
var N4 = [[1,0],[-1,0],[0,1],[0,-1]];

function keysOf(obj){
  var out = [];
  if(!obj) return out;
  if(obj.length !== undefined){
    for(var i=0; i<obj.length; i++) if(obj[i]) out.push(i);
  } else {
    for(var k in obj) if(obj[k]) out.push(parseInt(k, 10));
  }
  return out;
}
function countObjEntries(o){ if(!o) return 0; var n = 0; for(var k in o) if(o[k]) n++; return n; }

function validatePath(g, path, start, goal, W, H){
  if(!path || path.length === 0) return { ok:false, reason:'empty path' };
  if(path[0][0] !== start[0] || path[0][1] !== start[1]) return { ok:false, reason:'start mismatch' };
  var last = path[path.length-1];
  if(last[0] !== goal[0] || last[1] !== goal[1]) return { ok:false, reason:'goal mismatch' };
  for(var i=0; i<path.length; i++){
    var x = path[i][0], y = path[i][1];
    if(x<0 || x>=W || y<0 || y>=H) return { ok:false, reason:'OOB at ' + i };
    if(g[y][x] !== 0) return { ok:false, reason:'wall at ' + i };
    if(i > 0){
      var px = path[i-1][0], py = path[i-1][1];
      if(Math.abs(x-px) + Math.abs(y-py) !== 1) return { ok:false, reason:'nonadj at ' + i };
    }
  }
  return { ok:true };
}

function fmtTime(ms){
  if(ms < 0.001) return (ms * 1e6).toFixed(0) + 'ns';
  if(ms < 1)     return (ms * 1000).toFixed(0) + 'us';
  if(ms < 1000)  return ms.toFixed(2) + 'ms';
  return (ms / 1000).toFixed(3) + 's';
}
function fmtBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function fmtBytesShort(b){
  if(b < 1024) return b + 'B';
  if(b < 1024*1024) return (b/1024).toFixed(0) + 'K';
  return (b/1024/1024).toFixed(1) + 'M';
}

function MinHeap(){ this.h = []; }
MinHeap.prototype.push = function(item){
  this.h.push(item);
  var i = this.h.length - 1;
  while(i > 0){
    var p = (i-1) >> 1;
    if(this.h[p][0] <= this.h[i][0]) break;
    var tmp = this.h[p]; this.h[p] = this.h[i]; this.h[i] = tmp;
    i = p;
  }
};
MinHeap.prototype.pop = function(){
  var top = this.h[0];
  var last = this.h.pop();
  if(this.h.length > 0){
    this.h[0] = last;
    var i = 0, n = this.h.length;
    while(true){
      var l = 2*i+1, r = 2*i+2, s = i;
      if(l < n && this.h[l][0] < this.h[s][0]) s = l;
      if(r < n && this.h[r][0] < this.h[s][0]) s = r;
      if(s === i) break;
      var tmp = this.h[s]; this.h[s] = this.h[i]; this.h[i] = tmp;
      i = s;
    }
  }
  return top;
};
Object.defineProperty(MinHeap.prototype, 'size', { get: function(){ return this.h.length; } });

// =============== A* ===============
function AStar(g, start, goal){
  this.kind = 'astar';
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W;
  var k0 = start[1]*W + start[0];
  this.open = new MinHeap();
  this.open.push([manhattan(start,goal), 0, start]);
  this.gMap = {}; this.gMap[k0] = 0;
  this.came = {};
  this.closed = {};
  this.visited = {}; this.generated = {}; this.expanded = {}; this.frontier = {};
  this.dead = {};
  this.visited[k0] = true; this.generated[k0] = true; this.frontier[k0] = true;
  this.done = false; this.exhausted = false; this.path = null; this.algMs = 0;
  this._visitedCount = 1; this._generatedCount = 1; this._expandedCount = 0; this._frontierCount = 1;
  this._recording = false;
  this._deltaVisited = []; this._deltaFrontier = []; this._deltaFrontierRemoved = []; this._deltaDead = [];
  this._pathValid = undefined; this._pathReason = undefined;
}
AStar.prototype.step = function(budget){
  var t0 = performance.now();
  var spent = 0;
  var g = this.grid, W = this.W, H = this.H;
  var rec = this._recording;
  while(spent < budget && !this.done){
    if(this.open.size === 0){ this.done = true; this.exhausted = true; break; }
    var item = this.open.pop();
    var gcost = item[1]; var c = item[2]; var kc = c[1]*W + c[0];
    if(this.closed[kc]) continue;
    this.closed[kc] = true;
    this.visited[kc] = true; this.expanded[kc] = true;
    this._expandedCount++;
    if(this.frontier[kc]){ delete this.frontier[kc]; this._frontierCount--; if(rec) this._deltaFrontierRemoved.push(kc); }
    spent++;
    if(c[0] === this.goal[0] && c[1] === this.goal[1]){ this.done = true; this._recon(c); break; }
    for(var i=0; i<N4.length; i++){
      var nx = c[0] + N4[i][0], ny = c[1] + N4[i][1];
      if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      if(g[ny][nx] !== 0) continue;
      var ng = gcost + 1, kn = ny * W + nx;
      if(this.closed[kn]) continue;
      var cur = this.gMap[kn];
      if(cur === undefined || ng < cur){
        this.gMap[kn] = ng; this.came[kn] = c;
        this.open.push([ng + manhattan([nx,ny], this.goal), ng, [nx,ny]]);
        if(!this.frontier[kn]){ this.frontier[kn] = true; this._frontierCount++; if(rec) this._deltaFrontier.push(kn); }
        if(!this.generated[kn]){ this.generated[kn] = true; this._generatedCount++; }
        if(!this.visited[kn]){ this.visited[kn] = true; this._visitedCount++; if(rec) this._deltaVisited.push(kn); }
      }
    }
  }
  this.algMs += performance.now() - t0;
};
AStar.prototype._recon = function(end){
  var p = []; var c = end; var W = this.W;
  while(c){ p.push(c); c = this.came[c[1]*W + c[0]]; }
  p.reverse(); this.path = p;
};

// =============== DFS ===============
function DFS(g, start, goal){
  this.kind = 'dfs';
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W;
  var k0 = start[1]*W + start[0];
  this.stack = [start];
  this.came = {};
  this.visited = {}; this.generated = {}; this.expanded = {}; this.frontier = {};
  this.dead = {};
  this.visited[k0] = true; this.generated[k0] = true; this.frontier[k0] = true;
  this.done = false; this.exhausted = false; this.path = null; this.algMs = 0;
  this._visitedCount = 1; this._generatedCount = 1; this._expandedCount = 0; this._frontierCount = 1;
  this._recording = false;
  this._deltaVisited = []; this._deltaFrontier = []; this._deltaFrontierRemoved = []; this._deltaDead = [];
  this._pathValid = undefined; this._pathReason = undefined;
}
DFS.prototype.step = function(budget){
  var t0 = performance.now();
  var spent = 0;
  var g = this.grid, W = this.W, H = this.H;
  var rec = this._recording;
  var goal = this.goal;
  while(spent < budget && !this.done){
    if(this.stack.length === 0){ this.done = true; this.exhausted = true; break; }
    var c = this.stack.pop();
    var kc = c[1]*W + c[0];
    this.expanded[kc] = true;
    this._expandedCount++;
    if(this.frontier[kc]){ delete this.frontier[kc]; this._frontierCount--; if(rec) this._deltaFrontierRemoved.push(kc); }
    spent++;
    if(c[0] === goal[0] && c[1] === goal[1]){ this.done = true; this._recon(c); break; }
    for(var i=N4.length-1; i>=0; i--){
      var nx = c[0] + N4[i][0], ny = c[1] + N4[i][1];
      if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      if(g[ny][nx] !== 0) continue;
      var kn = ny * W + nx;
      if(this.visited[kn]) continue;
      this.visited[kn] = true; this._visitedCount++;
      this.generated[kn] = true; this._generatedCount++;
      this.came[kn] = c;
      this.frontier[kn] = true; this._frontierCount++;
      this.stack.push([nx, ny]);
      if(rec){ this._deltaVisited.push(kn); this._deltaFrontier.push(kn); }
    }
  }
  this.algMs += performance.now() - t0;
};
DFS.prototype._recon = function(end){
  var p = []; var c = end; var W = this.W;
  while(c){ p.push(c); c = this.came[c[1]*W + c[0]]; }
  p.reverse(); this.path = p;
};

// =============== LSB ===============
function Branch(cell, path, cameFrom, W){
  this.cell = cell; this.k = cell[1] * W + cell[0];
  this.path = path.slice(); this.cameFrom = cameFrom; this.W = W;
  this.stack = []; this.parked = false; this.scoreCache = 0;
  this.depth = this.path.length - 1; this.lastForkDepth = -999;
}
Branch.prototype.clone = function(){
  var b = new Branch(this.cell, this.path, this.cameFrom, this.W || 0);
  b.k = this.k; b.scoreCache = this.scoreCache; b.depth = this.depth; b.lastForkDepth = this.lastForkDepth;
  for(var i=0; i<this.stack.length; i++){
    var s = this.stack[i];
    b.stack.push({ cell: s.cell, k: s.k, options: s.options.slice(), nextIdx: s.nextIdx, pathIdx: s.pathIdx });
  }
  return b;
};
function LSB(g, start, goal){
  this.kind = 'lsb';
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W, H = this.H;
  var N = W * H; this.N = N;
  var scale = Math.max(1, Math.floor((W*H) / 3000));
  this.max_branches = 16 * scale; this.max_parked = 100 * scale;
  this.scar_threshold = 2.5; this.scar_decay = 0.004; this.tryEps = 0.5;
  this.minActive = 4 * scale; this.stallThreshold = 200 * scale;
  var dtg = new Float32Array(N);

    var dy = y - gy; var base = y * W;
    for(var x=0; x<W; x++){ var dx = x - gx; dtg[base + x] = Math.sqrt(dx*dx + dy*dy); }
  }

  for(var yy=0; yy<H; yy++){
    var bb = yy * W;
    for(var xx=0; xx<W; xx++){
      if(g[yy][xx] !== 0) continue;
      var c = 0;
      if(xx + 1 < W && g[yy][xx + 1] === 0) c++;
      if(xx - 1 >= 0 && g[yy][xx - 1] === 0) c++;
      if(yy + 1 < H && g[yy + 1][xx] === 0) c++;
      if(yy - 1 >= 0 && g[yy - 1][xx] === 0) c++;
      openCount[bb + xx] = c;
    }
  }

  var openMinX = W, openMaxX = -1, openMinY = H, openMaxY = -1;
  for(var oy=0; oy<H; oy++) for(var ox=0; ox<W; ox++) if(g[oy][ox] === 0){
    if(ox < openMinX) openMinX = ox; if(ox > openMaxX) openMaxX = ox;
    if(oy < openMinY) openMinY = oy; if(oy > openMaxY) openMaxY = oy;
  }
  this.openMinX = openMinX; this.openMaxX = openMaxX;
  this.openMinY = openMinY; this.openMaxY = openMaxY;
  this.visited = new Uint8Array(N); this.generated = new Uint8Array(N);
  this.expanded = new Uint8Array(N); this.dead = new Uint8Array(N);
  this.blocked = new Uint8Array(N); this.cutDead = new Uint8Array(N);
  this.frontier = new Uint8Array(N);
  this.scar = new Float32Array(N); this.scarKeys = {};
  this._visitedCount = 0; this._generatedCount = 0; this._expandedCount = 0;
  this._frontierCount = 0; this._deadCount = 0;
  this._recording = false;
  this._deltaVisited = []; this._deltaFrontier = []; this._deltaFrontierRemoved = []; this._deltaDead = [];
  this._pathValid = undefined; this._pathReason = undefined;
  this._reconPathCalls = 0; this._scoreBuf = [];
  this.vMinX = W; this.vMaxX = -1; this.vMinY = H; this.vMaxY = -1;
  this._frontierKeys = [];
  var k0 = start[1]*W + start[0];
  this.visited[k0] = 1; this._visitedCount++;
  this.generated[k0] = 1; this._generatedCount++;
  this.blocked[k0] = 1;
  this.vMinX = this.vMaxX = start[0];
  this.vMinY = this.vMaxY = start[1];
  var b = new Branch(start, [start], null, W);
  b.scoreCache = dtg[b.k];
  this.branches = [b];
  this._frontierKeys = [b.k];
  this.frontier[b.k] = 1; this._frontierCount = 1;
  this.parked = []; this.archive = [];
  this.done = false; this.exhausted = false; this.path = null;
  this.tick = 0; this.lastNovelTick = 0;
  this.backtracks = 0; this.parks = 0; this.resumes = 0; this.kills = 0;
  this.earlyDeaths = 0; this.deadEndStreak = 0; this.archived = 0; this.revived = 0;
  this.cutCheckTick = 0; this.lastCutCheckVisited = 0;
  this.cutsMade = 0; this.cutCellsPruned = 0; this.cutKilledBranches = 0;
  this.cutChecksRun = 0; this.cutGateSkips = 0; this.skippedBlocked = 0;
  this.layerMedian = 0; this.parkedFull = false;

LSB.prototype._addGenerated = function(k){
  if(!this.visited[k]){
    this.visited[k] = 1; this._visitedCount++;
    this.blocked[k] = 1;
    this.generated[k] = 1; this._generatedCount++;
    if(this._recording) this._deltaVisited.push(k);
    var W = this.W; var x = k % W, y = (k - x) / W;
    if(x < this.vMinX) this.vMinX = x; if(x > this.vMaxX) this.vMaxX = x;
    if(y < this.vMinY) this.vMinY = y; if(y > this.vMaxY) this.vMaxY = y;
  }
};
LSB.prototype._markDead = function(k){
  if(!this.dead[k]){
    this.dead[k] = 1; this.blocked[k] = 1; this._deadCount++;
    if(this._recording) this._deltaDead.push(k);
  }
};
LSB.prototype._unpark = function(n){
  this.parked.sort(function(a,b){ return a.scoreCache - b.scoreCache; });
  var take = Math.min(n, this.parked.length);
  for(var j=0; j<take; j++){
    var b = this.parked.shift(); b.parked = false;
    this.branches.push(b); this.resumes++;
  }
};
LSB.prototype._reviveFromArchive = function(n){
  if(this.archive.length === 0) return 0;
  this.archive.sort(function(a,b){ return a.scoreCache - b.scoreCache; });
  var take = Math.min(n, this.archive.length);
  for(var j=0; j<take; j++){
    var b = this.archive.shift(); b.parked = false; b.lastForkDepth = -999;
    this.branches.push(b); this.revived++;
  }
  return take;
};
LSB.prototype._shouldPark = function(b){
  if(this.branches.length <= this.minActive) return false;
  if(this.parkedFull) return false;
  return b.scoreCache > this.layerMedian * 1.5;
};
LSB.prototype._checkForCuts = function(){
  var W = this.W, H = this.H, N = this.N;
  this.cutChecksRun++;
  var canV = this.vMinY <= this.openMinY && this.vMaxY >= this.openMaxY;
  var canH = this.vMinX <= this.openMinX && this.vMaxX >= this.openMaxX;
  if(!canV && !canH){ this.cutGateSkips++; return; }
  if(this._visitedCount - this.lastCutCheckVisited < CUT_MIN_VISITED_DELTA) return;
  this.lastCutCheckVisited = this._visitedCount;
  var parent = new Int32Array(N);
  for(var i=0; i<N; i++) parent[i] = i;
  function find(x){ var r = x; while(parent[r] !== r) r = parent[r]; while(parent[x] !== r){ var nx = parent[x]; parent[x] = r; x = nx; } return r; }
  function union(a, b){ var ra = find(a), rb = find(b); if(ra !== rb) parent[ra] = rb; }
  for(var y=0; y<H; y++){
    var base = y * W;
    for(var x=0; x<W; x++){
      var k = base + x; if(!this.visited[k]) continue;
      if(x + 1 < W && this.visited[k + 1]) union(k, k + 1);
      if(y + 1 < H && this.visited[k + W]) union(k, k + W);
    }
  }
  var bbox = {};
  for(var yy=0; yy<H; yy++){
    var b2 = yy * W;
    for(var xx=0; xx<W; xx++){
      var kk = b2 + xx; if(!this.visited[kk]) continue;
      var r = find(kk);
      var bb = bbox[r];
      if(!bb){ bb = { minX: xx, maxX: xx, minY: yy, maxY: yy }; bbox[r] = bb; }
      else { if(xx < bb.minX) bb.minX = xx; if(xx > bb.maxX) bb.maxX = xx; if(yy < bb.minY) bb.minY = yy; if(yy > bb.maxY) bb.maxY = yy; }
    }
  }
  var cutRoots = {}, anyCut = false;
  var oMinX = this.openMinX, oMaxX = this.openMaxX, oMinY = this.openMinY, oMaxY = this.openMaxY;
  for(var r2 in bbox){
    var b3 = bbox[r2];
    if(b3.minY <= oMinY && b3.maxY >= oMaxY){ cutRoots[r2] = 'V'; anyCut = true; }
    else if(b3.minX <= oMinX && b3.maxX >= oMaxX){ cutRoots[r2] = 'H'; anyCut = true; }
  }
  if(!anyCut) return;
  var inCut = new Uint8Array(N);
  for(var y3=0; y3<H; y3++){
    var b4 = y3 * W;
    for(var x3=0; x3<W; x3++){
      var k3 = b4 + x3; if(!this.visited[k3]) continue;
      var r3 = find(k3); if(cutRoots[r3]) inCut[k3] = 1;
    }
  }
  var goalK = this.goalK;
  var reached = new Uint8Array(N);
  var queue = new Int32Array(N);
  var qh = 0, qt = 0;
  queue[qt++] = goalK; reached[goalK] = 1;
  while(qh < qt){
    var kc = queue[qh++];
    var cx = kc % W, cy = (kc - cx) / W;
    for(var di=0; di<4; di++){
      var nx2 = cx + N4[di][0], ny2 = cy + N4[di][1];
      if(nx2 < 0 || nx2 >= W || ny2 < 0 || ny2 >= H) continue;
      if(this.grid[ny2][nx2] !== 0) continue;
      var nk = ny2 * W + nx2;
      if(reached[nk]) continue;
      if(inCut[nk]) continue;
      reached[nk] = 1; queue[qt++] = nk;
    }
  }
  var pruned = 0;
  for(var y4=0; y4<H; y4++){
    var b5 = y4 * W;
    for(var x4=0; x4<W; x4++){
      var k4 = b5 + x4;
      if(this.grid[y4][x4] !== 0) continue;
      if(reached[k4] || inCut[k4] || this.visited[k4] || this.dead[k4]) continue;
      this._markDead(k4);
      this.cutDead[k4] = 1;
      this.scar[k4] += 0.5; this.scarKeys[k4] = 1;
      pruned++;
    }
  }
  var survivingActive = [];
  for(var bi2=0; bi2<this.branches.length; bi2++){
    var br = this.branches[bi2];
    if(reached[br.k] || inCut[br.k]) survivingActive.push(br);
    else this.cutKilledBranches++;
  }
  this.branches = survivingActive;
  var survivingParked = [];
  for(var pi2=0; pi2<this.parked.length; pi2++){
    var pb = this.parked[pi2];
    if(reached[pb.k] || inCut[pb.k]) survivingParked.push(pb);
    else this.cutKilledBranches++;
  }
  this.parked = survivingParked;
  var survivingArchive = [];
  for(var ai=0; ai<this.archive.length; ai++){
    var ab = this.archive[ai];
    if(reached[ab.k] || inCut[ab.k]) survivingArchive.push(ab);
    else this.cutKilledBranches++;
  }
  this.archive = survivingArchive;
  if(pruned > 0){ this.cutsMade++; this.cutCellsPruned += pruned; }
};
LSB.prototype.step = function(budget){
  var t0 = performance.now();
  var W = this.W, H = this.H, N = this.N;
  var rec = this._recording;
  for(var i=0; i<budget && !this.done; i++){
    if(this.branches.length < this.minActive && this.parked.length > 0){
      this._unpark(this.minActive - this.branches.length);
    }
    if(this.branches.length === 0){
      if(this.parked.length > 0){ this._unpark(this.minActive); }
      else if(this.archive.length > 0){ this._reviveFromArchive(this.minActive); }
      else { this.done = true; this.exhausted = true; break; }
    }
    this.tick++;
    var novelBefore = this._visitedCount;
    var oldBranches = this.branches;
    var ol = oldBranches.length;
    var needMedian = ol > this.minActive && this.parked.length < this.max_parked;
    if(needMedian){
      var scores = this._scoreBuf; scores.length = ol;
      for(var si=0; si<ol; si++) scores[si] = oldBranches[si].scoreCache;
      scores.sort(function(a,b){ return a - b; });
      this.layerMedian = scores[Math.floor(ol / 2)];
    } else { this.layerMedian = Infinity; }
    this.parkedFull = this.parked.length >= this.max_parked;
    var next = [];
    var stop = false;
    for(var bi=0; bi<ol; bi++){
      this.stepBranch(oldBranches[bi], next);
      if(this.done){ stop = true; break; }
    }
    if(stop) break;
    if(next.length > this.max_branches){ next.sort(function(a,b){ return a.scoreCache - b.scoreCache; }); }
    var overflow = [];
    if(next.length > this.max_branches){ overflow = next.slice(this.max_branches); next.length = this.max_branches; }
    this.branches = next;
    for(var oi=0; oi<overflow.length; oi++){
      var ob = overflow[oi];
      if(this.parked.length < this.max_parked){ ob.parked = true; this.parked.push(ob); this.parks++; }
      else if(this.archive.length < MAX_ARCHIVE){ this.archive.push(ob); this.archived++; }
      else {
        for(var pc=0; pc<ob.path.length; pc++){
          var c = ob.path[pc]; var k = c[1]*W + c[0];
          this.scar[k] += 0.5; this.scarKeys[k] = 1; this._markDead(k);
        }
        this.kills++;
      }
    }
    var newKeys = new Array(this.branches.length);
    for(var fj=0; fj<this.branches.length; fj++) newKeys[fj] = this.branches[fj].k;
    var newSet = {};
    for(var fj=0; fj<newKeys.length; fj++) newSet[newKeys[fj]] = 1;
    var oldSet = {};
    for(var fi=0; fi<this._frontierKeys.length; fi++) oldSet[this._frontierKeys[fi]] = 1;
    for(var fi=0; fi<this._frontierKeys.length; fi++){
      var kk = this._frontierKeys[fi];
      if(!newSet[kk] && this.frontier[kk]){ this.frontier[kk] = 0; this._frontierCount--; if(rec) this._deltaFrontierRemoved.push(kk); }
    }
    for(var fj=0; fj<newKeys.length; fj++){
      var kk = newKeys[fj];
      if(!oldSet[kk] && !this.frontier[kk]){ this.frontier[kk] = 1; this._frontierCount++; if(rec) this._deltaFrontier.push(kk); }
    }
    this._frontierKeys = newKeys;
    var novelAfter = this._visitedCount;
    if(novelAfter > novelBefore){ this.lastNovelTick = this.tick; this.deadEndStreak = 0; }
    else this.deadEndStreak++;
    if(this.deadEndStreak >= REVIVE_DEADEND_THRESHOLD){
      if(this.parked.length > 0) this._unpark(REVIVE_BATCH);
      else if(this.archive.length > 0) this._reviveFromArchive(REVIVE_BATCH);
      this.deadEndStreak = 0;
    }
    if(this.tick - this.lastNovelTick > this.stallThreshold && this.parked.length > 0){
      this._unpark(this.minActive); this.lastNovelTick = this.tick;
    }
    if(this.scar_decay > 0 && this.tick % 300 === 0){
      for(var sk in this.scarKeys){
        var kv = parseInt(sk, 10);
        var v = this.scar[kv] * (1 - this.scar_decay * 5);
        if(v < 0.05){ this.scar[kv] = 0; delete this.scarKeys[sk]; }
        else this.scar[kv] = v;
      }
    }
    if(this.tick - this.cutCheckTick >= CUT_CHECK_INTERVAL){
      this.cutCheckTick = this.tick;
      this._checkForCuts();
    }
  }
  this.algMs += performance.now() - t0;
};
LSB.prototype.stepBranch = function(b, next){
  var W = this.W, H = this.H;
  if(b.k === this.goalK){ this.done = true; this.path = b.path; return; }
  if(!this.expanded[b.k]){ this.expanded[b.k] = 1; this._expandedCount++; }
  var x0 = b.cell[0], y0 = b.cell[1];
  var grid = this.grid, openCount = this.openCount, blocked = this.blocked, goalK = this.goalK;
  var opts = [];
  for(var i=0; i<4; i++){
    var nx = x0 + N4[i][0], ny = y0 + N4[i][1];
    if(nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if(grid[ny][nx] !== 0) continue;

    if(kk === goalK){ opts.push([nx, ny, kk]); continue; }
    if(blocked[kk]){ this.skippedBlocked++; continue; }

      this.scar[kk] += 1.0; this.scarKeys[kk] = 1;
      this._markDead(kk); this.earlyDeaths++;
      continue;
    }
    opts.push([nx, ny, kk]);
  }
  if(opts.length === 0){
    if(this.backtrack(b, next)) return;
    next.push(b);
    return;
  }
  var dtg = this.dtg;
  opts.sort(function(p, q){ return dtg[p[2]] - dtg[q[2]]; });
  var primary = opts[0];
  var canFork = (b.depth - b.lastForkDepth) >= FORK_COOLDOWN;
  if(opts.length > 1 && canFork){
    var bestD = dtg[primary[2]], tiedCount = 1;
    for(var ti=1; ti<opts.length; ti++) if(Math.abs(dtg[opts[ti][2]] - bestD) < this.tryEps) tiedCount++;
    if(tiedCount > 1){
      var wrote = 1;
      for(var k2=1; k2<opts.length && wrote<tiedCount; k2++){
        if(Math.abs(dtg[opts[k2][2]] - bestD) >= this.tryEps) continue;
        var nb = b.clone();
        var nt = opts[k2];
        nb.stack.push({ cell: b.cell, k: b.k, options: opts.slice(), nextIdx: tiedCount, pathIdx: b.path.length - 1 });
        nb.path.push(nt); nb.cameFrom = b.cell;
        nb.cell = nt; nb.k = nt[2];
        nb.depth = b.depth + 1; nb.lastForkDepth = nb.depth;
        nb.scoreCache = dtg[nt[2]] + 0.25 * nb.depth;
        this._addGenerated(nt[2]);
        next.push(nb); wrote++;
      }
      b.stack.push({ cell: b.cell, k: b.k, options: opts, nextIdx: tiedCount, pathIdx: b.path.length - 1 });
      b.lastForkDepth = b.depth;
    } else {
      b.stack.push({ cell: b.cell, k: b.k, options: opts, nextIdx: 1, pathIdx: b.path.length - 1 });
    }
  } else if(opts.length > 1){
    b.stack.push({ cell: b.cell, k: b.k, options: opts, nextIdx: 1, pathIdx: b.path.length - 1 });
  }
  b.path.push(primary);
  b.cameFrom = b.cell;
  b.cell = primary; b.k = primary[2];
  b.depth++;
  b.scoreCache = dtg[primary[2]] + 0.25 * b.depth;
  this._addGenerated(primary[2]);
  if(b.k === this.goalK){ this.done = true; this.path = b.path; return; }
  if(this._shouldPark(b)){
    if(this.parked.length < this.max_parked){
      b.parked = true; this.parked.push(b); this.parks++;
      return;
    }
  }
  next.push(b);
};
LSB.prototype.backtrack = function(b, next){
  var W = this.W, blocked = this.blocked, goalK = this.goalK;
  this.backtracks++;
  this.deadEndStreak++;
  while(b.stack.length > 0){
    var top = b.stack[b.stack.length - 1];
    if(top.nextIdx < top.options.length){
      var nt = top.options[top.nextIdx]; top.nextIdx++;
      if(blocked[nt[2]] && nt[2] !== goalK){ this.skippedBlocked++; continue; }
      b.path.length = top.pathIdx + 1; b.path.push(nt);
      b.cameFrom = top.cell;
      b.cell = nt; b.k = nt[2];
      b.depth = b.path.length - 1;
      b.scoreCache = this.dtg[nt[2]] + 0.25 * b.depth;
      this._addGenerated(nt[2]);
      if(b.k === goalK){ this.done = true; this.path = b.path; return false; }
      return false;
    }
    b.stack.pop();
  }
  for(var j=0; j<b.path.length; j++){
    var c2 = b.path[j]; var k2 = c2[1]*W + c2[0];
    this.scar[k2] += 0.5; this.scarKeys[k2] = 1; this._markDead(k2);
  }
  this.kills++;
  return true;
};

// =============== SCS ===============
function SCS(g, start, goal){
  this.kind = 'scs';
  this.grid = g; this.start = start; this.goal = goal;
  this.W = g[0].length; this.H = g.length;
  var W = this.W, H = this.H, N = W*H;
  this.N = N;
  var sk = start[1]*W + start[0];
  var gk = goal[1]*W + goal[0];
  this.sk = sk; this.gk = gk;
  this.openF = new MinHeap();
  this.openF.push([manhattan(start, goal), 0, start]);
  this.gF = new Map(); this.gF.set(sk, 0);
  this.cameF = new Map();
  this.closedF = new Uint8Array(N);
  this.sealedF = new Uint8Array(N);
  this.fVisited = new Uint8Array(N); this.fVisited[sk] = 1;
  this.openB = new MinHeap();
  this.openB.push([manhattan(goal, start), 0, goal]);
  this.gB = new Map(); this.gB.set(gk, 0);
  this.cameB = new Map();
  this.closedB = new Uint8Array(N);
  this.sealedB = new Uint8Array(N);
  this.bVisited = new Uint8Array(N); this.bVisited[gk] = 1;
  this.visited = new Uint8Array(N); this.generated = new Uint8Array(N);
  this.expanded = new Uint8Array(N); this.frontier = new Uint8Array(N);
  this.dead = new Uint8Array(N);
  this.visited[sk] = 1; this.visited[gk] = 1;
  this.generated[sk] = 1; this.generated[gk] = 1;
  this.frontier[sk] = 1; this.frontier[gk] = 1;
  this.bestCost = Infinity; this.bestMeet = null; this.bestSide = null;
  this.done = false; this.exhausted = false; this.path = null; this.algMs = 0;
  this._visitedCount = 2; this._generatedCount = 2; this._expandedCount = 0; this._frontierCount = 2;
  this._recording = false;
  this._deltaVisited = []; this._deltaFrontier = []; this._deltaFrontierRemoved = []; this._deltaDead = [];
  this._pathValid = undefined; this._pathReason = undefined;
  this.cutChecksRun = 0; this.cutsF = 0; this.cutsB = 0;
  this.cellsSealedF = 0; this.cellsSealedB = 0;
  this.forwardExpanded = 0; this.backwardExpanded = 0;
  this._sinceCut = 0;
}
SCS.prototype._reconFromSide = function(side, endCell){
  var W = this.W, p = [], c = endCell;
  if(side === 'F'){ while(c){ p.push(c); c = this.cameF.get(c[1]*W + c[0]); } p.reverse(); }
  else { while(c){ p.push(c); c = this.cameB.get(c[1]*W + c[0]); } }
  this.path = p;
};
SCS.prototype._reconMeet = function(){
  var W = this.W, v = this.bestMeet;
  if(!v) return;
  var pathF = []; var c = v;
  while(c){ pathF.push(c); c = this.cameF.get(c[1]*W + c[0]); }
  pathF.reverse();
  var pathB = []; c = v;
  while(c){ pathB.push(c); c = this.cameB.get(c[1]*W + c[0]); }
  this.path = pathF.concat(pathB.slice(1));
};
SCS.prototype._expandSide = function(side){
  var W = this.W, H = this.H;
  var g = this.grid, rec = this._recording;
  var isF = side === 'F';

SCS.prototype.step = function(budget){

// =============== TSCS: Tile-based SCS ===============
// Split grid into TILE x TILE mini-mazes. Portals = open cells on tile
// borders that connect to adjacent tiles. Build a portal graph where
// edges are (a) intra-tile BFS distances and (b) cross-tile adjacent
// portal pairs (cost 1). A* over this portal graph. Reconstruct by

  this._addPortal(start[0], start[1], true);

  for(var ty = 0; ty < this.tilesY; ty++){
    for(var tx = 0; tx < this.tilesX; tx++){
      for(var ly = 0; ly < TS; ly++){
        for(var lx = 0; lx < TS; lx++){
          var x = tx * TS + lx, y = ty * TS + ly;
          if(x >= W || y >= H) continue;

          var kk = y * W + x;
          if(this.portalAt.has(kk)) continue;
          var isLeft = (lx === 0 && tx > 0 && g[y][x-1] === 0);
          var isRight = (lx === TS - 1 && tx < this.tilesX - 1 && x + 1 < W && g[y][x+1] === 0);
          var isTop = (ly === 0 && ty > 0 && g[y-1][x] === 0);
          var isBottom = (ly === TS - 1 && ty < this.tilesY - 1 && y + 1 < H && g[y+1][x] === 0);
          if(isLeft || isRight || isTop || isBottom) this._addPortal(x, y, false);

TSCS.prototype._addPortal = function(x, y, isStart){

TSCS.prototype._h = function(p){

TSCS.prototype._revealTile = function(tileIdx){

TSCS.prototype._bfsBetweenInTile = function(pA, pB){

    if(this.closed[pi]) continue;
    this.closed[pi] = 1;
    this.portalExpansions++; this._expandedCount++;

    var p = this.portals[pi];
    this._revealTile(p.tile);

    if(this.frontier[p.y * this.W + p.x]){ this.frontier[p.y * this.W + p.x] = 0; this._frontierCount--; }

    if(pi === this.goalPortalIdx){

    var localIdx = -1;
    for(var li = 0; li < tileData.portals.length; li++) if(tileData.portals[li] === pi){ localIdx = li; break; }

      if(ng2 < this.gScore[qj2]){

        var q2 = this.portals[qj2];
        this.open.push([ng2 + this._h(q2), ng2, qj2]);
        var qk2 = q2.y * this.W + q2.x;

// =============== memory estimation ===============
var BYTES_OBJ_HEADER = 48;
var BYTES_SMALL_ARRAY = 32;
var BYTES_PER_NUMBER = 8;
var BYTES_PER_SMALL_ARRAY = 48;
var BYTES_OBJECT_MAP_ENTRY = 72;
var BYTES_LSB_BRANCH = 80;
var BYTES_LSB_FRAME = 64;

function estimateLSBBytes(l){
  var bytes = l.visited.byteLength + l.generated.byteLength + l.expanded.byteLength;
  bytes += l.dead.byteLength + l.blocked.byteLength + l.cutDead.byteLength;
  bytes += l.frontier.byteLength + l.scar.byteLength + l.dtg.byteLength + l.openCount.byteLength;
  function branchBytes(b){
    var sz = BYTES_OBJ_HEADER + BYTES_SMALL_ARRAY + b.path.length * BYTES_PER_SMALL_ARRAY;
    for(var si=0; si<b.stack.length; si++) sz += BYTES_LSB_FRAME + BYTES_SMALL_ARRAY + b.stack[si].options.length * BYTES_PER_SMALL_ARRAY;
    return sz;
  }
  for(var bi=0; bi<l.branches.length; bi++) bytes += branchBytes(l.branches[bi]);
  for(var pi=0; pi<l.parked.length; pi++) bytes += branchBytes(l.parked[pi]);
  for(var ai=0; ai<l.archive.length; ai++) bytes += branchBytes(l.archive[ai]);
  return bytes;
}
function estimateAStarBytes(a){
  var bytes = a.open.h.length * (BYTES_SMALL_ARRAY + 3 * BYTES_PER_NUMBER + BYTES_PER_SMALL_ARRAY);
  bytes += countObjEntries(a.gMap) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(a.came) * (BYTES_OBJECT_MAP_ENTRY + BYTES_PER_SMALL_ARRAY);
  bytes += countObjEntries(a.closed) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(a.visited) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(a.generated) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(a.expanded) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(a.frontier) * BYTES_OBJECT_MAP_ENTRY;
  return bytes;
}
function estimateDFSBytes(d){
  var bytes = d.stack.length * (BYTES_SMALL_ARRAY + 2 * BYTES_PER_NUMBER);
  bytes += countObjEntries(d.came) * (BYTES_OBJECT_MAP_ENTRY + BYTES_PER_SMALL_ARRAY);
  bytes += countObjEntries(d.visited) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(d.generated) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(d.expanded) * BYTES_OBJECT_MAP_ENTRY;
  bytes += countObjEntries(d.frontier) * BYTES_OBJECT_MAP_ENTRY;
  return bytes;
}
function estimateSCSBytes(s){
  var bytes = 0;
  bytes += s.closedF.byteLength + s.closedB.byteLength;
  bytes += s.sealedF.byteLength + s.sealedB.byteLength;
  bytes += s.fVisited.byteLength + s.bVisited.byteLength;
  bytes += s.visited.byteLength + s.generated.byteLength + s.expanded.byteLength + s.frontier.byteLength + s.dead.byteLength;
  bytes += s.openF.h.length * (BYTES_SMALL_ARRAY + 3 * BYTES_PER_NUMBER + BYTES_PER_SMALL_ARRAY);
  bytes += s.openB.h.length * (BYTES_SMALL_ARRAY + 3 * BYTES_PER_NUMBER + BYTES_PER_SMALL_ARRAY);
  bytes += s.gF.size * BYTES_OBJECT_MAP_ENTRY + s.gB.size * BYTES_OBJECT_MAP_ENTRY;
  bytes += s.cameF.size * (BYTES_OBJECT_MAP_ENTRY + BYTES_PER_SMALL_ARRAY) + s.cameB.size * (BYTES_OBJECT_MAP_ENTRY + BYTES_PER_SMALL_ARRAY);
  return bytes;
}
function estimateTSCSBytes(t){
  var bytes = 0;
  bytes += t.visited.byteLength + t.generated.byteLength + t.expanded.byteLength + t.frontier.byteLength + t.dead.byteLength;
  bytes += t._revealedTiles.byteLength;
  bytes += t.gScore.byteLength + t.cameFrom.byteLength + t.closed.byteLength;
  bytes += t.portalAt.size * BYTES_OBJECT_MAP_ENTRY;
  bytes += t.portals.length * (BYTES_OBJ_HEADER + 4 * BYTES_PER_NUMBER);
  bytes += t.open.h.length * (BYTES_SMALL_ARRAY + 3 * BYTES_PER_NUMBER + BYTES_PER_SMALL_ARRAY);
  var tiles = 0;
  for(var i = 0; i < t.numTiles; i++){
    if(t.tileDist[i]){
      tiles++;
      var n = t.tileDist[i].portals.length;
      bytes += n * n * 4;
    }
  }
  bytes += t.crossEdges.length * BYTES_SMALL_ARRAY;
  for(var j = 0; j < t.crossEdges.length; j++) bytes += t.crossEdges[j].length * BYTES_PER_NUMBER;
  return bytes;
}
function estimateBytes(algo){
  if(algo.kind === 'lsb') return estimateLSBBytes(algo);
  if(algo.kind === 'dfs') return estimateDFSBytes(algo);
  if(algo.kind === 'scs') return estimateSCSBytes(algo);
  if(algo.kind === 'tscs') return estimateTSCSBytes(algo);
  return estimateAStarBytes(algo);
}

function makeAlgo(kind, g, start, goal){
  if(kind === 'A*') return new AStar(g, start, goal);
  if(kind === 'LSB') return new LSB(g, start, goal);
  if(kind === 'DFS') return new DFS(g, start, goal);
  if(kind === 'SCS') return new SCS(g, start, goal);
  if(kind === 'TSCS') return new TSCS(g, start, goal);
  throw new Error('unknown algo ' + kind);
}

// =============== stats ===============
function getStats(algo){
  var validPath;
  if(!algo.path) validPath = { ok:false, reason:'no path' };
  else if(algo._pathValid !== undefined) validPath = { ok:algo._pathValid, reason:algo._pathReason };
  else {
    validPath = validatePath(algo.grid, algo.path, algo.start, algo.goal, algo.W, algo.H);
    algo._pathValid = validPath.ok; algo._pathReason = validPath.reason;
  }
  var stats = {
    expanded: algo._expandedCount, generated: algo._generatedCount,
    uniqueVisited: algo._visitedCount,
    pathLen: algo.path ? algo.path.length : null,
    pathValid: validPath.ok, pathReason: validPath.reason,
    success: algo.done && validPath.ok, exhausted: !!algo.exhausted, done: algo.done,
    frontier: algo._frontierCount,
    memBytes: estimateBytes(algo),
    algMs: algo.algMs, isLSB: algo.kind === 'lsb', isSCS: algo.kind === 'scs', isTSCS: algo.kind === 'tscs'
  };
  if(algo.kind === 'lsb'){
    stats.backtracks = algo.backtracks; stats.parks = algo.parks; stats.resumes = algo.resumes;
    stats.kills = algo.kills; stats.earlyDeaths = algo.earlyDeaths;
    stats.cutsMade = algo.cutsMade; stats.cutCellsPruned = algo.cutCellsPruned;
    stats.cutKilledBranches = algo.cutKilledBranches; stats.cutChecksRun = algo.cutChecksRun;
    stats.cutGateSkips = algo.cutGateSkips; stats.archived = algo.archived; stats.revived = algo.revived;
    stats.archiveSize = algo.archive.length; stats.parkedCount = algo.parked.length;
    stats.skippedBlocked = algo.skippedBlocked;
    stats.liveBranches = algo.branches.length + algo.parked.length + algo.archive.length;
  }
  if(algo.kind === 'scs'){
    stats.scsCutChecks = algo.cutChecksRun;
    stats.scsCutsF = algo.cutsF; stats.scsCutsB = algo.cutsB;
    stats.scsSealedF = algo.cellsSealedF; stats.scsSealedB = algo.cellsSealedB;
    stats.scsFExpanded = algo.forwardExpanded; stats.scsBExpanded = algo.backwardExpanded;
    stats.scsBestCost = algo.bestCost === Infinity ? null : algo.bestCost;
  }
  if(algo.kind === 'tscs'){
    stats.tscsPortals = algo.portals.length;
    stats.tscsPortalExpansions = algo.portalExpansions;
    stats.tscsTileBfsCalls = algo.tileBfsCalls;
    stats.tscsCellsBfsed = algo.cellsBfsed;
    stats.tscsTiles = algo.numTiles;
    stats.tscsRevealed = 0;
    for(var i = 0; i < algo._revealedTiles.length; i++) if(algo._revealedTiles[i]) stats.tscsRevealed++;
  }
  return stats;
}

// =============== recording ===============
function recordFrames(algo){
  var frames = [];
  var isLSB = algo.kind === 'lsb';
  algo._recording = true;
  algo._deltaVisited = []; algo._deltaFrontier = []; algo._deltaFrontierRemoved = []; algo._deltaDead = [];
  frames.push({
    addVisited: keysOf(algo.visited), addFrontier: keysOf(algo.frontier),
    remFrontier: [], addDead: algo.dead ? keysOf(algo.dead) : [],
    path: null, parked: isLSB && algo.parked ? algo.parked.map(function(b){ return b.k; }) : null,
    stats: getStats(algo)
  });
  var recorded = 1;
  while(!algo.done && recorded < RECORD_MAX_FRAMES){
    algo.step(RECORD_BUDGET);
    var addVisited = algo._deltaVisited; algo._deltaVisited = [];
    var addFrontier = algo._deltaFrontier; algo._deltaFrontier = [];
    var remFrontier = algo._deltaFrontierRemoved; algo._deltaFrontierRemoved = [];
    var addDead = algo._deltaDead; algo._deltaDead = [];
    frames.push({
      addVisited: addVisited, addFrontier: addFrontier, remFrontier: remFrontier, addDead: addDead,
      path: algo.path ? algo.path.slice() : null,
      parked: isLSB && algo.parked ? algo.parked.map(function(b){ return b.k; }) : null,
      stats: getStats(algo)
    });
    recorded++;
  }
  algo._recording = false;
  return frames;
}

function buildRecording(){
  var L = makeAlgo(LEFT_ALGO, grid, START, GOAL);
  var R = makeAlgo(RIGHT_ALGO, grid, START, GOAL);
  var framesL = recordFrames(L);
  var framesR = recordFrames(R);
  var ticks = Math.max(framesL.length, framesR.length);
  var idleL = framesL[framesL.length-1];
  while(framesL.length < ticks) framesL.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[], path: idleL.path, parked: idleL.parked, stats: idleL.stats });
  var idleR = framesR[framesR.length-1];
  while(framesR.length < ticks) framesR.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[], path: idleR.path, parked: idleR.parked, stats: idleR.stats });
  return { framesA: framesL, framesL: framesR, ticks: ticks, grid: grid, START: START, GOAL: GOAL, W: W, H: H };
}

// =============== playback ===============
var recording = null, playbackIdx = -1, paused = false, finished = false, lastFrameTime = 0, tickAccumulator = 0;
var playbackA = { visited:{}, frontier:{}, dead:{} }, playbackL = { visited:{}, frontier:{}, dead:{} };
var currentA = { path:null, parked:null, stats:null }, currentL = { path:null, parked:null, stats:null };

function applyFrame(state, frame){
  for(var i=0; i<frame.addVisited.length; i++) state.visited[frame.addVisited[i]] = true;
  for(var j=0; j<frame.addFrontier.length; j++) state.frontier[frame.addFrontier[j]] = true;
  for(var k=0; k<frame.remFrontier.length; k++) delete state.frontier[frame.remFrontier[k]];
  for(var m=0; m<frame.addDead.length; m++) state.dead[frame.addDead[m]] = true;
}
function advanceToFrame(target){
  if(target <= playbackIdx) return;
  while(playbackIdx < target){
    playbackIdx++;
    var fa = recording.framesA[playbackIdx], fl = recording.framesL[playbackIdx];
    applyFrame(playbackA, fa); applyFrame(playbackL, fl);
    currentA.path = fa.path; currentA.parked = fa.parked; currentA.stats = fa.stats;
    currentL.path = fl.path; currentL.parked = fl.parked; currentL.stats = fl.stats;
  }
}
function resetPlayback(){
  playbackIdx = -1; tickAccumulator = 0;
  playbackA = { visited:{}, frontier:{}, dead:{} }; playbackL = { visited:{}, frontier:{}, dead:{} };
  currentA = { path:null, parked:null, stats:null }; currentL = { path:null, parked:null, stats:null };
  advanceToFrame(0);
}

// =============== rendering ===============
var cA = document.getElementById('cA'), cL = document.getElementById('cL');
var ctxA = cA.getContext('2d'), ctxL = cL.getContext('2d');
var COLOR = { wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', parked:'#f80', visited:'#2a4a7a', path:'#0ff', dead:'#a00' };

function draw(ctx, g, view, path, parked, W, H, showTiles, tilesX, tilesY, TS){
  ctx.fillStyle = COLOR.open;
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  var pathSet = {};
  if(path){ for(var pi=0; pi<path.length; pi++) pathSet[path[pi][1]*W + path[pi][0]] = true; }
  var parkedSet = {};
  if(parked){ for(var qi=0; qi<parked.length; qi++) parkedSet[parked[qi]] = true; }
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      var k = y*W + x;
      var col = null;
      if(g[y][x] === 1) col = COLOR.wall;
      else if(view.dead[k]) col = COLOR.dead;
      else if(view.visited[k]) col = COLOR.visited;
      if(parkedSet[k]) col = COLOR.parked;
      if(view.frontier[k]) col = COLOR.frontier;
      if(pathSet[k]) col = COLOR.path;
      if(x === START[0] && y === START[1]) col = COLOR.start;
      if(x === GOAL[0] && y === GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle = col; ctx.fillRect(x*CELL, y*CELL, CELL, CELL); }
    }
  }
  if(showTiles){
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for(var tx = 1; tx < tilesX; tx++){
      var xg = tx * TS * CELL;
      ctx.beginPath(); ctx.moveTo(xg, 0); ctx.lineTo(xg, ctx.canvas.height); ctx.stroke();
    }
    for(var ty = 1; ty < tilesY; ty++){
      var yg = ty * TS * CELL;
      ctx.beginPath(); ctx.moveTo(0, yg); ctx.lineTo(ctx.canvas.width, yg); ctx.stroke();
    }
  }
}
function fmtStats(stats){
  if(!stats) return '';
  var s = 'expanded: <b>' + stats.expanded + '</b><br>';
  if(stats.generated !== null) s += 'generated: <b>' + stats.generated + '</b><br>';
  s += 'path: <b>' + (stats.pathLen !== null ? stats.pathLen : '-') + '</b>';
  if(stats.done) s += stats.pathValid ? ' <span style="color:#6f6">valid</span>' : ' <span style="color:#f88">invalid</span>';
  s += '<br>frontier: <b>' + stats.frontier + '</b><br>';
  s += '<span class="mem">memory ~ <b>' + fmtBytes(stats.memBytes) + '</b></span>';
  if(stats.liveBranches !== null) s += ' <span class="mem">(' + stats.liveBranches + ' live)</span>';
  s += '<br>';
  if(stats.isLSB){
    s += 'bt: <b>' + stats.backtracks + '</b>  parks: <b>' + stats.parks + '</b>  res: <b>' + stats.resumes + '</b><br>';
    s += 'kills: <b>' + stats.kills + '</b>  parked: <b>' + stats.parkedCount + '</b>  skipB: <b>' + stats.skippedBlocked + '</b><br>';
    s += 'cuts: <b>' + stats.cutsMade + '</b>  checks: <b>' + stats.cutChecksRun + '</b>  pruned: <b>' + stats.cutCellsPruned + '</b><br>';
  }
  if(stats.isSCS){
    s += 'checks: <b>' + stats.scsCutChecks + '</b>  cutsF/B: <b>' + stats.scsCutsF + '/' + stats.scsCutsB + '</b><br>';
    s += 'sealedF/B: <b>' + stats.scsSealedF + '/' + stats.scsSealedB + '</b><br>';
    s += 'fExp/bExp: <b>' + stats.scsFExpanded + '/' + stats.scsBExpanded + '</b><br>';
  }
  if(stats.isTSCS){
    s += 'portals: <b>' + stats.tscsPortals + '</b>  expanded: <b>' + stats.tscsPortalExpansions + '</b><br>';
    s += 'tiles revealed: <b>' + stats.tscsRevealed + '/' + stats.tscsTiles + '</b><br>';
    s += 'tileBFS calls: <b>' + stats.tscsTileBfsCalls + '</b>  cellsBFSed: <b>' + stats.tscsCellsBfsed + '</b><br>';
  }
  s += 'done: <b>' + stats.done + '</b>';
  if(stats.exhausted) s += ' <span style="color:#f88">(exhausted)</span>';
  if(stats.done) s += '  success: <b>' + (stats.success ? 'yes' : 'NO') + '</b>';
  s += '<br>alg time (recorded): <b>' + fmtTime(stats.algMs) + '</b>';
  return s;
}
function renderCurrent(){
  var lTSCS = currentL.stats && currentL.stats.isTSCS;
  var rTSCS = currentA.stats && currentA.stats.isTSCS;
  var lTS = lTSCS ? recording.tscsTileInfoL : null;
  var rTS = rTSCS ? recording.tscsTileInfoR : null;
  draw(ctxA, recording.grid, playbackA, currentA.path, currentA.parked, recording.W, recording.H,
       rTSCS, rTS ? rTS.tilesX : 0, rTS ? rTS.tilesY : 0, rTS ? rTS.TS : 0);
  draw(ctxL, recording.grid, playbackL, currentL.path, currentL.parked, recording.W, recording.H,
       lTSCS, lTS ? lTS.tilesX : 0, lTS ? lTS.tilesY : 0, lTS ? lTS.TS : 0);
  var showA = finished ? recording.framesA[recording.framesA.length - 1].stats : currentA.stats;
  var showL = finished ? recording.framesL[recording.framesL.length - 1].stats : currentL.stats;
  document.getElementById('sA').innerHTML = fmtStats(showA);
  document.getElementById('sL').innerHTML = fmtStats(showL);
  if(recording){
    var meta = 'frame ' + (playbackIdx < 0 ? 0 : playbackIdx) + ' / ' + (recording.ticks - 1) +
               '  |  speed ' + (PLAYBACK_SPEED >= 9999 ? 'Instant' : PLAYBACK_SPEED + 'x') +
               '  |  wall ' + fmtTime(recording.computeMs || 0);
    document.getElementById('metaA').innerHTML = meta;
    document.getElementById('metaL').innerHTML = meta;
  }
}
function setSpeed(s){
  PLAYBACK_SPEED = s;
  var btns = document.querySelectorAll('.speed-btn');
  for(var i=0; i<btns.length; i++){
    var v = parseFloat(btns[i].getAttribute('data-sp'));
    btns[i].className = (Math.abs(v - s) < 1e-6) ? 'speed-btn speed-on' : 'speed-btn';
  }
}
function setSize(w, h){
  W = w; H = h;
  CELL = Math.max(1, Math.floor(600 / W));
  cA.width = W * CELL; cA.height = H * CELL;
  cL.width = W * CELL; cL.height = H * CELL;
  var btns = document.querySelectorAll('.size-btn');
  for(var i=0; i<btns.length; i++){
    var bw = parseInt(btns[i].getAttribute('data-w'),10);
    var bh = parseInt(btns[i].getAttribute('data-h'),10);
    btns[i].className = (bw === W && bh === H) ? 'size-btn size-on' : 'size-btn';
  }
  setScenario('maze_any');
}
function setScenario(name){
  if(name === 'open'){        START = [0,0]; GOAL = [W-1,H-1]; grid = makeOpen(); }
  else if(name === 'sparse'){ START = [0,0]; GOAL = [W-1,H-1]; grid = makeSparse(); }
  else if(name === 'r020'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.20, freshSeed()); }
  else if(name === 'r030'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.30, freshSeed()); }
  else if(name === 'r038'){   START = [0,0]; GOAL = [W-1,H-1]; grid = makeRandom(0.38, freshSeed()); }
  else if(name === 'maze_dfs'){     grid = makeMazeDFS(freshSeed());     START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_prim'){    grid = makeMazePrim(freshSeed());    START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_kruskal'){ grid = makeMazeKruskal(freshSeed()); START = [1,1]; GOAL = [W-3,H-3]; }
  else if(name === 'maze_any'){
    var t = MAZE_TYPES[Math.floor(Math.random() * MAZE_TYPES.length)];
    grid = t.fn(freshSeed());
    START = [1,1]; GOAL = [W-3,H-3];
  }
  buildAndPlay();
}
function restartSame(){ buildAndPlay(); }
function changeAlgo(side, kind){
  if(side === 'left') LEFT_ALGO = kind;
  else RIGHT_ALGO = kind;
  document.getElementById('hLeft').innerText = LEFT_ALGO;
  document.getElementById('hRight').innerText = RIGHT_ALGO;
  buildAndPlay();
}
function buildAndPlay(){
  var banner = document.getElementById('banner');
  banner.style.display = 'block'; banner.textContent = 'Calculating...';
  document.getElementById('sA').innerHTML = '';
  document.getElementById('sL').innerHTML = '';
  document.getElementById('metaA').innerHTML = '';
  document.getElementById('metaL').innerHTML = '';
  setTimeout(function(){
    var t0 = performance.now();
    var lAlgo = makeAlgo(LEFT_ALGO, grid, START, GOAL);
    var rAlgo = makeAlgo(RIGHT_ALGO, grid, START, GOAL);
    var framesL = recordFrames(lAlgo);
    var framesR = recordFrames(rAlgo);
    var ticks = Math.max(framesL.length, framesR.length);
    var idleL = framesL[framesL.length-1];
    while(framesL.length < ticks) framesL.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[], path: idleL.path, parked: idleL.parked, stats: idleL.stats });
    var idleR = framesR[framesR.length-1];
    while(framesR.length < ticks) framesR.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[], path: idleR.path, parked: idleR.parked, stats: idleR.stats });
    recording = { framesA: framesL, framesL: framesR, ticks: ticks, grid: grid, START: START, GOAL: GOAL, W: W, H: H };
    if(lAlgo.kind === 'tscs'){
      recording.tscsTileInfoL = { tilesX: lAlgo.tilesX, tilesY: lAlgo.tilesY, TS: lAlgo.TS };
    }
    if(rAlgo.kind === 'tscs'){
      recording.tscsTileInfoR = { tilesX: rAlgo.tilesX, tilesY: rAlgo.tilesY, TS: rAlgo.TS };
    }
    var computeMs = performance.now() - t0;
    recording.computeMs = computeMs;
    banner.textContent = 'Recorded ' + recording.ticks + ' frames in ' + fmtTime(computeMs) +
                         ' (' + LEFT_ALGO + ': ' + framesL.length + ', ' + RIGHT_ALGO + ': ' + framesR.length + ')';
    setTimeout(function(){ banner.style.display = 'none'; }, 2500);
    resetPlayback();
    paused = false; finished = false; lastFrameTime = 0;
    document.getElementById('pauseBtn').innerText = 'Pause';
    renderCurrent();
  }, 20);
}
function togglePause(){
  if(finished) return;
  paused = !paused;
  document.getElementById('pauseBtn').innerText = paused ? 'Resume' : 'Pause';
}
function loop(now){
  requestAnimationFrame(loop);
  if(paused || finished || !recording) return;
  if(now - lastFrameTime < TICK_DELAY) return;
  lastFrameTime = now;
  var lastIdx = recording.ticks - 1;
  if(PLAYBACK_SPEED >= 9999){ advanceToFrame(lastIdx); finished = true; renderCurrent(); document.getElementById('pauseBtn').innerText = 'Done'; return; }
  tickAccumulator += PLAYBACK_SPEED;
  var advanceBy = Math.floor(tickAccumulator);
  if(advanceBy <= 0){ renderCurrent(); return; }
  tickAccumulator -= advanceBy;
  var target = playbackIdx + advanceBy;
  if(target >= lastIdx){ advanceToFrame(lastIdx); finished = true; renderCurrent(); document.getElementById('pauseBtn').innerText = 'Done'; return; }
  advanceToFrame(target);
  renderCurrent();
}

// =============== mass test ===============
var lastSeeds = null, lastN = 0;

function runOneOnce(factory){
  var algo = factory();
  var iters = 0;
  while(!algo.done && iters < MASS_MAX_ITERS){ algo.step(MASS_BUDGET); iters++; }
  return { stats: getStats(algo), algMs: algo.algMs };
}
function runBench(factory){
  var totalMs = 0, reps = 0, last = null;
  while(reps < MASS_MAX_REPS){
    last = runOneOnce(factory);
    totalMs += last.algMs; reps++;
    if(totalMs >= MASS_MIN_TIME_MS) break;
  }
  return { stats: last.stats, avgMs: totalMs / reps, reps: reps };
}

function massTest(reuse, N){
  N = N || 12;
  paused = true;
  document.getElementById('pauseBtn').innerText = 'Resume';
  var out = document.getElementById('results');
  out.style.display = 'block';
  out.textContent = 'Running ' + N + ' mazes...';
  setTimeout(function(){
    var plans;
    if(reuse && lastSeeds && lastN === N){ plans = lastSeeds.slice(); }
    else {
      plans = [];
      for(var i=0; i<N; i++){
        var t = MAZE_TYPES[i % MAZE_TYPES.length];
        plans.push({ type: t.name, fn: t.fn, seed: freshSeed() });
      }
      lastSeeds = plans; lastN = N;
    }
    var LKind = LEFT_ALGO, RKind = RIGHT_ALGO;
    var rows = [];
    var aSuccess = 0, lSuccess = 0, aWins = 0, lWins = 0, ties = 0;
    var acc = { aTime:0, lTime:0, aExp:0, lExp:0, aPath:0, lPath:0, aMem:0, lMem:0,
                aUniq:0, lUniq:0, n:0 };
    for(var pi=0; pi<plans.length; pi++){
      var plan = plans[pi];
      var g = plan.fn(plan.seed);
      var S = [1,1], G = [W-3, H-3];
      var ra = runBench(function(){ return makeAlgo(LKind, g, S, G); });
      var rl = runBench(function(){ return makeAlgo(RKind, g, S, G); });
      var aOk = ra.stats.success, lOk = rl.stats.success;
      if(aOk) aSuccess++;
      if(lOk) lSuccess++;
      var verdict;
      if(!aOk && !lOk) verdict = 'both FAIL';
      else if(!lOk) verdict = LKind + ' (' + RKind + ' fail)';
      else if(!aOk) verdict = RKind + ' (' + LKind + ' fail)';
      else if(ra.stats.uniqueVisited < rl.stats.uniqueVisited){ verdict = LKind; aWins++; }
      else if(rl.stats.uniqueVisited < ra.stats.uniqueVisited){ verdict = RKind; lWins++; }
      else { verdict = 'tie'; ties++; }
      if(aOk && lOk){
        acc.aTime += ra.avgMs; acc.lTime += rl.avgMs;
        acc.aExp += ra.stats.expanded; acc.lExp += rl.stats.expanded;
        acc.aUniq += ra.stats.uniqueVisited; acc.lUniq += rl.stats.uniqueVisited;
        acc.aPath += ra.stats.pathLen || 0; acc.lPath += rl.stats.pathLen || 0;
        acc.aMem += ra.stats.memBytes; acc.lMem += rl.stats.memBytes;
        acc.n++;
      }
      rows.push({ type: plan.type, seed: plan.seed,
        aTime: ra.avgMs, lTime: rl.avgMs, aReps: ra.reps, lReps: rl.reps,
        aExp: ra.stats.expanded, lExp: rl.stats.expanded,
        aUniq: ra.stats.uniqueVisited, lUniq: rl.stats.uniqueVisited,
        aPath: ra.stats.pathLen, lPath: rl.stats.pathLen,
        aMem: ra.stats.memBytes, lMem: rl.stats.memBytes,
        aSuccess: aOk, lSuccess: lOk, lReason: rl.stats.pathReason, verdict: verdict });
    }
    function pad(s, n){ s = String(s); while(s.length < n) s += ' '; return s.slice(0, n); }
    function padL(s, n){ s = String(s); while(s.length < n) s = ' ' + s; return s.slice(-n); }
    var txt = '';
    txt += 'MASS TEST - ' + N + ' mazes (' + W + 'x' + H + ')' + (reuse && lastN === N ? '  [reused]' : '  [fresh]') + '\n';
    txt += 'Left: ' + LKind + '   Right: ' + RKind + '\n';
    txt += 'Verdict by UNIQUE CELLS TOUCHED (fairer for tiled algorithms).\n';
    txt += 'Memory is a rough estimate (typed arrays exact; JS objects estimated).\n\n';
    txt += pad('type', 9) + padL('seed', 12)
         + padL('Lt', 9) + padL('Rt', 9)
         + padL('Lexp', 6) + padL('Rexp', 6)
         + padL('Luniq', 6) + padL('Runiq', 6)
         + padL('Lmem', 6) + padL('Rmem', 6)
         + padL('Lpth', 6) + padL('Rpth', 6)
         + padL('ok', 4) + padL('rep', 7)
         + '  verdict\n';
    txt += '--------------------------------------------------------------------------------------------------------\n';
    for(var ri=0; ri<rows.length; ri++){
      var r = rows[ri];
      txt += pad(r.type, 9) + padL(r.seed.toString(16), 12)
          + padL(fmtTime(r.aTime), 9) + padL(fmtTime(r.lTime), 9)
          + padL(r.aExp, 6) + padL(r.lExp, 6)
          + padL(r.aUniq, 6) + padL(r.lUniq, 6)
          + padL(fmtBytesShort(r.aMem), 6) + padL(fmtBytesShort(r.lMem), 6)
          + padL(r.aPath === null ? '-' : r.aPath, 6) + padL(r.lPath === null ? '-' : r.lPath, 6)
          + padL(r.aSuccess && r.lSuccess ? 'Y/Y' : (r.aSuccess ? 'Y/N' : 'N/N'), 4)
          + padL(r.aReps + '/' + r.lReps, 7)
          + '  ' + r.verdict + '\n';
      if(!r.lSuccess && r.lReason && r.lReason !== 'no path') txt += '  ' + RKind + ' path invalid: ' + r.lReason + '\n';
    }
    txt += '--------------------------------------------------------------------------------------------------------\n';
    if(acc.n > 0){
      txt += pad('AVG', 9) + padL('', 12)
          + padL(fmtTime(acc.aTime/acc.n), 9) + padL(fmtTime(acc.lTime/acc.n), 9)
          + padL(Math.round(acc.aExp/acc.n), 6) + padL(Math.round(acc.lExp/acc.n), 6)
          + padL(Math.round(acc.aUniq/acc.n), 6) + padL(Math.round(acc.lUniq/acc.n), 6)
          + padL(fmtBytesShort(acc.aMem/acc.n), 6) + padL(fmtBytesShort(acc.lMem/acc.n), 6)
          + padL(Math.round(acc.aPath/acc.n), 6) + padL(Math.round(acc.lPath/acc.n), 6)
          + padL('', 4) + padL('', 7)
          + '  (n=' + acc.n + ')\n';
    }
    txt += '\nSUCCESS  ' + LKind + ': ' + aSuccess + '/' + N + '   ' + RKind + ': ' + lSuccess + '/' + N + '\n';
    txt += 'WINS  ' + LKind + ': ' + aWins + '   ' + RKind + ': ' + lWins + '   tie: ' + ties + '\n';
    out.textContent = txt;
  }, 30);
}

document.getElementById('hLeft').innerText = LEFT_ALGO;
document.getElementById('hRight').innerText = RIGHT_ALGO;
document.getElementById('leftSel').value = LEFT_ALGO;
document.getElementById('rightSel').value = RIGHT_ALGO;

setSpeed(1);
setSize(100, 50);
requestAnimationFrame(loop);
</script>
