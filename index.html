<script>
// ===================================================================
// config
// ===================================================================
const W = 60, H = 30;
const CELL = Math.floor(480 / W);
const TICK_DELAY = 16;              // ms per frame
const BUDGET_PER_TICK = 8;          // algo steps per recorded tick
const RECORD_MAX_TICKS = 5000;

let PLAYBACK_SPEED = 1;             // recorded ticks per frame (can be <1)

let START = [0, 0];
let GOAL  = [W-1, H-1];

// ===================================================================
// rng / seeds
// ===================================================================
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
let seedCounter = 0;
function freshSeed(){
  seedCounter++;
  const t = Date.now() >>> 0;
  const r = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
  return ((t ^ r ^ (seedCounter * 2654435761)) >>> 0);
}

// ===================================================================
// grid generators
// ===================================================================
function makeOpen(){ return Array.from({length:H},()=>Array(W).fill(0)); }
function makeSparse(){
  const g = Array.from({length:H},()=>Array(W).fill(0));
  const blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(const [x0,y0,x1,y1] of blocks)
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}
function makeRandom(density, seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(r()<density) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}
function roomDims(){ return [Math.floor((W-1)/2), Math.floor((H-1)/2)]; }

function makeMazeDFS(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const visited = Array.from({length:ry},()=>Array(rx).fill(false));
  const stack = [[0,0]];
  visited[0][0] = true; g[1][1] = 0;
  while(stack.length){
    const [cx,cy] = stack[stack.length-1];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=rx||ny<0||ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dy][cx*2+1+dx]=0;
      g[ny*2+1][nx*2+1]=0;
      visited[ny][nx]=true; stack.push([nx,ny]); moved=true; break;
    }
    if(!moved) stack.pop();
  }
  return g;
}
function makeMazePrim(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const inMaze = Array.from({length:ry},()=>Array(rx).fill(false));
  const frontier = [];
  inMaze[0][0] = true; g[1][1] = 0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=dx, ny=dy;
    if(nx>=0&&nx<rx&&ny>=0&&ny<ry) frontier.push([nx,ny,0,0]);
  }
  while(frontier.length){
    const i = Math.floor(r()*frontier.length);
    const [nx,ny,px,py] = frontier.splice(i,1)[0];
    if(inMaze[ny][nx]) continue;
    g[ny*2+1][nx*2+1] = 0;
    g[py*2+1 + (ny-py)][px*2+1 + (nx-px)] = 0;
    inMaze[ny][nx] = true;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ax=nx+dx, ay=ny+dy;
      if(ax>=0&&ax<rx&&ay>=0&&ay<ry&&!inMaze[ay][ax]) frontier.push([ax,ay,nx,ny]);
    }
  }
  return g;
}
function makeMazeKruskal(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  for(let y=0;y<ry;y++) for(let x=0;x<rx;x++) g[y*2+1][x*2+1]=0;
  const parent = new Int32Array(rx*ry);
  for(let i=0;i<rx*ry;i++) parent[i]=i;
  function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
  const walls = [];
  for(let y=0;y<ry;y++) for(let x=0;x<rx;x++){
    if(x+1<rx) walls.push([x,y,x+1,y]);
    if(y+1<ry) walls.push([x,y,x,y+1]);
  }
  for(let i=walls.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [walls[i],walls[j]]=[walls[j],walls[i]]; }
  for(const [x1,y1,x2,y2] of walls){
    const ra = find(y1*rx+x1), rb = find(y2*rx+x2);
    if(ra!==rb){ parent[ra] = rb; g[y1*2+1 + (y2-y1)][x1*2+1 + (x2-x1)] = 0; }
  }
  return g;
}
const MAZE_TYPES = [
  { name:'DFS',     fn: makeMazeDFS },
  { name:'Prim',    fn: makeMazePrim },
  { name:'Kruskal', fn: makeMazeKruskal },
];

// ===================================================================
// helpers
// ===================================================================
function manhattan(a,b){ return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]); }
function euclid(a,b){ const dx=a[0]-b[0],dy=a[1]-b[1]; return Math.hypot(dx,dy); }
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function neighbors(grid,c){
  const out=[];
  for(const [dx,dy] of N4){
    const x=c[0]+dx, y=c[1]+dy;
    if(x>=0&&x<W&&y>=0&&y<H&&grid[y][x]===0) out.push([x,y]);
  }
  return out;
}
function key(c){ return c[1]*W+c[0]; }

function validatePath(grid, path, start, goal){
  if(!path || path.length === 0) return {ok:false, reason:'empty path'};
  if(path[0][0] !== start[0] || path[0][1] !== start[1])
    return {ok:false, reason:'does not start at START'};
  const last = path[path.length - 1];
  if(last[0] !== goal[0] || last[1] !== goal[1])
    return {ok:false, reason:'does not end at GOAL'};
  for(let i=0; i<path.length; i++){
    const [x,y] = path[i];
    if(x<0||x>=W||y<0||y>=H) return {ok:false, reason:'out of bounds at '+i};
    if(grid[y][x] !== 0) return {ok:false, reason:'crosses wall at '+i};
    if(i>0){
      const [px,py] = path[i-1];
      if(Math.abs(x-px)+Math.abs(y-py) !== 1)
        return {ok:false, reason:'non-adjacent at '+i};
    }
  }
  return {ok:true};
}

// ---- time formatting ----
function fmtTime(ms){
  if(ms < 0.001) return (ms*1e6).toFixed(0)+'ns';
  if(ms < 1)     return (ms*1000).toFixed(0)+'μs';
  if(ms < 1000)  return ms.toFixed(2)+'ms';
  return (ms/1000).toFixed(3)+'s';
}

// ===================================================================
// MinHeap
// ===================================================================
class MinHeap {
  constructor(){ this.h=[]; }
  push(item){ this.h.push(item); this._up(this.h.length-1); }
  pop(){
    const top = this.h[0];
    const last = this.h.pop();
    if(this.h.length){ this.h[0]=last; this._down(0); }
    return top;
  }
  get size(){ return this.h.length; }
  _up(i){ const h=this.h; while(i>0){ const p=(i-1)>>1; if(h[p][0]<=h[i][0]) break; [h[p],h[i]]=[h[i],h[p]]; i=p; } }
  _down(i){
    const h=this.h, n=h.length;
    while(true){
      let l=2*i+1, r=2*i+2, s=i;
      if(l<n && h[l][0]<h[s][0]) s=l;
      if(r<n && h[r][0]<h[s][0]) s=r;
      if(s===i) break;
      [h[s],h[i]]=[h[i],h[s]]; i=s;
    }
  }
}

// ===================================================================
// A*
// ===================================================================
class AStar {
  constructor(grid, start, goal){
    this.grid=grid; this.start=start; this.goal=goal;
    this.open = new MinHeap();
    this.open.push([manhattan(start,goal), 0, start]);
    this.g = new Map(); this.g.set(key(start), 0);
    this.came = new Map();
    this.closed = new Set();
    this.visited  = new Set([key(start)]);
    this.generated = new Set([key(start)]);
    this.expanded  = new Set();
    this.frontier = new Set([key(start)]);
    this.done=false; this.exhausted=false; this.path=null;
    this.algMs = 0;
  }
  step(budget){
    const t0 = performance.now();
    let spent = 0;
    while(spent < budget && !this.done){
      if(this.open.size === 0){ this.done=true; this.exhausted=true; break; }
      const [,g,c] = this.open.pop();
      const kc = key(c);
      if(this.closed.has(kc)) continue;
      this.closed.add(kc);
      this.visited.add(kc);
      this.expanded.add(kc);
      this.frontier.delete(kc);
      spent++;
      if(c[0]===this.goal[0] && c[1]===this.goal[1]){
        this.done=true; this._recon(c); break;
      }
      for(const n of neighbors(this.grid,c)){
        const ng = g+1;
        const kn = key(n);
        if(this.closed.has(kn)) continue;
        const cur = this.g.get(kn);
        if(cur===undefined || ng < cur){
          this.g.set(kn, ng);
          this.came.set(kn, c);
          this.open.push([ng+manhattan(n,this.goal), ng, n]);
          this.frontier.add(kn);
          this.generated.add(kn);
          this.visited.add(kn);
        }
      }
    }
    this.algMs += performance.now() - t0;
  }
  _recon(end){
    const p=[]; let c=end;
    while(c){ p.push(c); c=this.came.get(key(c)); }
    p.reverse(); this.path=p;
  }
}

// ===================================================================
// LSB
// ===================================================================
class Branch {
  constructor(cell, path, cameFrom){
    this.cell = cell;
    this.path = path.slice();
    this.cameFrom = cameFrom;
    this.pathSet = new Set();
    for(const c of this.path) this.pathSet.add(key(c));
    this.stack = [];
    this.bestEver = manhattan(cell, GOAL);
    this.parkCount = 0;
    this.parked = false;
  }
  clone(){
    const b = new Branch(this.cell, this.path, this.cameFrom);
    b.bestEver = this.bestEver;
    b.parkCount = 0;
    b.stack = this.stack.map(s => ({
      cell: s.cell,
      options: s.options.slice(),
      nextIdx: s.nextIdx,
      pathIdx: s.pathIdx
    }));
    return b;
  }
  score(){ return euclid(this.cell, GOAL) + 0.25 * this.path.length; }
}

class LSB {
  constructor(grid, start, goal, opts={}){
    this.grid=grid; this.start=start; this.goal=goal;
    this.max_branches        = opts.max_branches        ?? 16;
    this.max_parked          = opts.max_parked          ?? 32;
    this.scar_threshold      = opts.scar_threshold      ?? 2.5;
    this.scar_decay          = opts.scar_decay          ?? 0.004;
    this.tryEps              = opts.tryEps              ?? 0.5;
    this.maxParksPerBranch   = opts.maxParksPerBranch   ?? 3;
    this.minActive           = opts.minActive           ?? 4;
    this.stallThreshold      = opts.stallThreshold      ?? 200;

    this.scar = new Map();
    const b = new Branch(start, [start], null);
    this.branches = [b];
    this.parked = [];
    this.done=false; this.exhausted=false; this.path=null;
    this.tick=0;
    this.lastNovelTick = 0;
    this.backtracks=0; this.parks=0; this.resumes=0; this.kills=0;

    this.visited   = new Set([key(start)]);
    this.generated = new Set([key(start)]);
    this.expanded  = new Set();

    this.frontier = new Set([key(start)]);
    this.dead = new Set();
    this.algMs = 0;
  }
  _scarAdd(c, amt){ this.scar.set(key(c), (this.scar.get(key(c))||0)+amt); }

  step(budget){
    const t0 = performance.now();
    outer:
    for(let i=0; i<budget && !this.done; i++){
      if(this.branches.length === 0){
        if(this.parked.length === 0){
          this.done = true; this.exhausted = true; break;
        }
        this._unpark(this.minActive);
      }
      this.tick++;
      const novelBefore = this.visited.size;

      const next = [];
      for(const b of this.branches){
        this.stepBranch(b, next);
        if(this.done) break outer;
      }

      next.sort((a,b) => a.score() - b.score());
      const keep = next.slice(0, this.max_branches);
      const overflow = next.slice(this.max_branches);
      this.branches = keep;
      for(const b of overflow){
        if(this.parked.length < this.max_parked){
          b.parked = true; this.parked.push(b); this.parks++;
        } else {
          const worstParked = this.parked[this.parked.length - 1];
          if(worstParked && b.score() < worstParked.score()){
            this.parked.pop();
            for(const c of worstParked.path){ this._scarAdd(c, 0.5); this.dead.add(key(c)); }
            this.kills++;
            b.parked = true; this.parked.push(b); this.parks++;
          } else {
            for(const c of b.path){ this._scarAdd(c, 0.5); this.dead.add(key(c)); }
            this.kills++;
          }
        }
      }
      this.frontier = new Set(this.branches.map(b => key(b.cell)));

      const novelAfter = this.visited.size;
      if(novelAfter > novelBefore){
        this.lastNovelTick = this.tick;
      } else if(this.tick - this.lastNovelTick > this.stallThreshold && this.parked.length > 0){
        this._unpark(2);
        this.lastNovelTick = this.tick;
      }

      if(this.scar_decay>0 && this.tick%60===0){
        for(const k of Array.from(this.scar.keys())){
          const v = this.scar.get(k)*(1-this.scar_decay);
          if(v<0.05) this.scar.delete(k); else this.scar.set(k,v);
        }
      }
    }
    this.algMs += performance.now() - t0;
  }

  _unpark(n){
    this.parked.sort((a,b) => a.score() - b.score());
    const take = Math.min(n, this.parked.length);
    for(let j=0; j<take; j++){
      const b = this.parked.shift();
      b.parked = false;
      this.branches.push(b);
      this.resumes++;
    }
  }

  _addGenerated(c){
    const k = key(c);
    if(!this.visited.has(k)){
      this.visited.add(k);
      this.generated.add(k);
    }
  }

  stepBranch(b, next){
    if(b.cell[0]===this.goal[0] && b.cell[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }
    this.expanded.add(key(b.cell));
    const opts = neighbors(this.grid, b.cell).filter(n => !b.pathSet.has(key(n)));
    if(opts.length === 0){
      const dead = this.backtrack(b, next);
      if(dead) return;
      next.push(b);
      return;
    }
    opts.sort((p,q) => euclid(p, this.goal) - euclid(q, this.goal));
    const primary = opts[0];
    if(opts.length > 1){
      const bestD = euclid(primary, this.goal);
      const tied = opts.filter(o => Math.abs(euclid(o, this.goal) - bestD) < this.tryEps);
      if(tied.length > 1){
        for(let i=1; i<tied.length; i++){
          const nb = b.clone();
          const nt = tied[i];
          nb.stack.push({
            cell: b.cell,
            options: opts.slice(),
            nextIdx: tied.length,
            pathIdx: b.path.length - 1
          });
          nb.path.push(nt);
          nb.pathSet.add(key(nt));
          nb.cameFrom = b.cell;
          nb.cell = nt;
          nb.bestEver = Math.min(nb.bestEver, manhattan(nt, this.goal));
          this._addGenerated(nt);
          next.push(nb);
        }
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: tied.length,
          pathIdx: b.path.length - 1
        });
      } else {
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: 1,
          pathIdx: b.path.length - 1
        });
      }
    }
    b.path.push(primary);
    b.pathSet.add(key(primary));
    b.cameFrom = b.cell;
    b.cell = primary;
    this._addGenerated(primary);
    const d = manhattan(primary, this.goal);
    if(d < b.bestEver) b.bestEver = d;
    if(primary[0]===this.goal[0] && primary[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }
    if(b.parkCount < this.maxParksPerBranch && this._shouldPark(b)){
      b.parkCount++;
      if(this.parked.length < this.max_parked){
        b.parked = true;
        this.parked.push(b);
        this.parks++;
        return;
      }
    }
    next.push(b);
  }

  _shouldPark(b){
    if(this.branches.length <= this.minActive) return false;
    const scored = this.branches.map(x => x.score()).sort((a,b)=>a-b);
    const median = scored[Math.floor(scored.length/2)];
    return b.score() > median * 1.5;
  }

  backtrack(b, next){
    this.backtracks++;
    while(b.stack.length > 0){
      const top = b.stack[b.stack.length - 1];
      if(top.nextIdx < top.options.length){
        const nt = top.options[top.nextIdx];
        top.nextIdx++;
        for(let i = b.path.length - 1; i > top.pathIdx; i--){
          b.pathSet.delete(key(b.path[i]));
        }
        b.path = b.path.slice(0, top.pathIdx + 1);
        b.path.push(nt);
        b.pathSet.add(key(nt));
        b.cameFrom = top.cell;
        b.cell = nt;
        this._addGenerated(nt);
        const d = manhattan(nt, this.goal);
        if(d < b.bestEver) b.bestEver = d;
        if(nt[0]===this.goal[0] && nt[1]===this.goal[1]){
          this.done=true; this.path=b.path; return false;
        }
        return false;
      }
      b.stack.pop();
    }
    for(const c of b.path){ this._scarAdd(c, 0.5); this.dead.add(key(c)); }
    this.kills++;
    return true;
  }
}

// ===================================================================
// stats snapshot
// ===================================================================
function getStats(algo, isLSB){
  const validPath = algo.path ? validatePath(algo.grid, algo.path, algo.start, algo.goal)
                              : {ok:false, reason:'no path'};
  return {
    expanded:  algo.expanded.size,
    generated: algo.generated ? algo.generated.size : null,
    uniqueVisited: algo.visited.size,
    pathLen: algo.path ? algo.path.length : null,
    pathValid: validPath.ok,
    pathReason: validPath.reason,
    success: algo.done && validPath.ok,
    exhausted: !!algo.exhausted,
    done: algo.done,
    frontier: algo.frontier.size,
    backtracks: isLSB ? algo.backtracks : null,
    parks: isLSB ? algo.parks : null,
    resumes: isLSB ? algo.resumes : null,
    kills: isLSB ? algo.kills : null,
    parkedCount: isLSB ? algo.parked.length : null,
    algMs: algo.algMs,
    isLSB
  };
}

// ===================================================================
// recording / playback
// ===================================================================
function recordFrames(algo, isLSB, maxTicks){
  const frames = [];
  const prevVisited  = new Set();
  const prevFrontier = new Set();
  const prevDead     = new Set();

  frames.push({
    addVisited: Array.from(algo.visited),
    addFrontier: Array.from(algo.frontier),
    remFrontier: [],
    addDead: algo.dead ? Array.from(algo.dead) : [],
    path: algo.path ? algo.path.slice() : null,
    parked: isLSB && algo.parked ? algo.parked.map(b => key(b.cell)) : null,
    stats: getStats(algo, isLSB)
  });
  for(const k of algo.visited) prevVisited.add(k);
  for(const k of algo.frontier) prevFrontier.add(k);
  if(algo.dead) for(const k of algo.dead) prevDead.add(k);

  let tick = 0;
  while(!algo.done && tick < maxTicks){
    algo.step(BUDGET_PER_TICK);
    tick++;

    const addVisited = [];
    for(const k of algo.visited) if(!prevVisited.has(k)){ addVisited.push(k); prevVisited.add(k); }
    const addFrontier = [];
    for(const k of algo.frontier) if(!prevFrontier.has(k)){ addFrontier.push(k); prevFrontier.add(k); }
    const remFrontier = [];
    for(const k of prevFrontier) if(!algo.frontier.has(k)) remFrontier.push(k);
    for(const k of remFrontier) prevFrontier.delete(k);
    const addDead = [];
    if(algo.dead){
      for(const k of algo.dead) if(!prevDead.has(k)){ addDead.push(k); prevDead.add(k); }
    }
    frames.push({
      addVisited, addFrontier, remFrontier, addDead,
      path: algo.path ? algo.path.slice() : null,
      parked: isLSB && algo.parked ? algo.parked.map(b => key(b.cell)) : null,
      stats: getStats(algo, isLSB)
    });
  }
  return frames;
}

function buildRecording(){
  const a = new AStar(grid, START, GOAL);
  const l = new LSB(grid, START, GOAL);
  const framesA = recordFrames(a, false, RECORD_MAX_TICKS);
  const framesL = recordFrames(l, true,  RECORD_MAX_TICKS);
  const ticks = Math.max(framesA.length, framesL.length);

  const idleA = framesA[framesA.length-1];
  while(framesA.length < ticks)
    framesA.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[],
                   path: idleA.path, parked: idleA.parked, stats: idleA.stats });
  const idleL = framesL[framesL.length-1];
  while(framesL.length < ticks)
    framesL.push({ addVisited:[], addFrontier:[], remFrontier:[], addDead:[],
                   path: idleL.path, parked: idleL.parked, stats: idleL.stats });
  return { framesA, framesL, ticks, grid, START, GOAL };
}

// ===================================================================
// playback
// ===================================================================
let recording = null;
let playbackIdx = -1;
let paused = false;
let finished = false;
let lastFrameTime = 0;
let tickAccumulator = 0;

const playbackA = { visited: new Set(), frontier: new Set(), dead: new Set() };
const playbackL = { visited: new Set(), frontier: new Set(), dead: new Set() };
let currentA = { path: null, parked: null, stats: null };
let currentL = { path: null, parked: null, stats: null };

function applyFrame(state, frame){
  for(const k of frame.addVisited) state.visited.add(k);
  for(const k of frame.addFrontier) state.frontier.add(k);
  for(const k of frame.remFrontier) state.frontier.delete(k);
  for(const k of frame.addDead) state.dead.add(k);
}
function advanceToFrame(target){
  if(target <= playbackIdx) return;
  while(playbackIdx < target){
    playbackIdx++;
    const fa = recording.framesA[playbackIdx];
    const fl = recording.framesL[playbackIdx];
    applyFrame(playbackA, fa);
    applyFrame(playbackL, fl);
    currentA.path = fa.path; currentA.parked = fa.parked; currentA.stats = fa.stats;
    currentL.path = fl.path; currentL.parked = fl.parked; currentL.stats = fl.stats;
  }
}
function resetPlayback(){
  playbackIdx = -1;
  tickAccumulator = 0;
  playbackA.visited.clear(); playbackA.frontier.clear(); playbackA.dead.clear();
  playbackL.visited.clear(); playbackL.frontier.clear(); playbackL.dead.clear();
  currentA = { path: null, parked: null, stats: null };
  currentL = { path: null, parked: null, stats: null };
  advanceToFrame(0);
}

// ===================================================================
// rendering
// ===================================================================
const cA = document.getElementById('cA');
const cL = document.getElementById('cL');
cA.width = W*CELL; cA.height = H*CELL;
cL.width = W*CELL; cL.height = H*CELL;
const ctxA = cA.getContext('2d');
const ctxL = cL.getContext('2d');

const COLOR = {
  wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', parked:'#f80', visited:'#2a4a7a', path:'#0ff', dead:'#a00'
};

function draw(ctx, grid, view, path, parked){
  ctx.fillStyle = COLOR.open;
  ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const pathSet = path ? new Set(path.map(key)) : null;
  const parkedSet = parked ? new Set(parked) : null;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const k = y*W+x;
      let col = null;
      if(grid[y][x]===1) col = COLOR.wall;
      else if(view.dead.has(k)) col = COLOR.dead;
      else if(view.visited.has(k)) col = COLOR.visited;
      if(parkedSet && parkedSet.has(k)) col = COLOR.parked;
      if(view.frontier.has(k)) col = COLOR.frontier;
      if(pathSet && pathSet.has(k)) col = COLOR.path;
      if(x===START[0]&&y===START[1]) col = COLOR.start;
      if(x===GOAL[0]&&y===GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle=col; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
    }
  }
}

function fmtStats(stats){
  if(!stats) return '';
  let s = `<div class="primary">expanded: <b>${stats.expanded}</b></div>`;
  if(stats.generated !== null) s += `generated: <b>${stats.generated}</b><br>`;
  s += `path: <b>${stats.pathLen ?? '—'}</b>`;
  if(stats.done) s += stats.pathValid ? ` <span style="color:#6f6">✓</span>` : ` <span style="color:#f88">✗</span>`;
  s += `<br>frontier: <b>${stats.frontier}</b><br>`;
  if(stats.isLSB){
    s += `bt: <b>${stats.backtracks}</b>  parks: <b>${stats.parks}</b>  res: <b>${stats.resumes}</b><br>`;
    s += `kills: <b>${stats.kills}</b>  parked: <b>${stats.parkedCount}</b><br>`;
  }
  s += `done: <b>${stats.done}</b>`;
  if(stats.exhausted) s += ` <span style="color:#f88">(exhausted)</span>`;
  if(stats.done) s += `  success: <b>${stats.success ? 'yes' : 'NO'}</b>`;
  s += `<br>alg time: <b>${fmtTime(stats.algMs)}</b>`;
  return s;
}

function renderCurrent(){
  draw(ctxA, recording.grid, playbackA, currentA.path, currentA.parked);
  draw(ctxL, recording.grid, playbackL, currentL.path, currentL.parked);
  document.getElementById('sA').innerHTML = fmtStats(currentA.stats);
  document.getElementById('sL').innerHTML = fmtStats(currentL.stats);
}

// ===================================================================
// speed control
// ===================================================================
function setSpeed(s){
  PLAYBACK_SPEED = s;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    const v = parseFloat(btn.dataset.sp);
    btn.classList.toggle('speed-on', Math.abs(v - s) < 1e-6);
  });
}

// ===================================================================
// driver
// ===================================================================
let grid = null;

function setScenario(name){
  if(name==='open'){        START=[0,0]; GOAL=[W-1,H-1]; grid = makeOpen(); }
  else if(name==='sparse'){ START=[0,0]; GOAL=[W-1,H-1]; grid = makeSparse(); }
  else if(name==='r020'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.20, freshSeed()); }
  else if(name==='r030'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.30, freshSeed()); }
  else if(name==='r038'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.38, freshSeed()); }
  else if(name==='maze_dfs'){     grid = makeMazeDFS(freshSeed());     START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_prim'){    grid = makeMazePrim(freshSeed());    START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_kruskal'){ grid = makeMazeKruskal(freshSeed()); START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_any'){
    const t = MAZE_TYPES[Math.floor(Math.random()*MAZE_TYPES.length)];
    grid = t.fn(freshSeed());
    START=[1,1]; GOAL=[W-3,H-3];
  }
  buildAndPlay();
}
function restartSame(){ buildAndPlay(); }

function buildAndPlay(){
  const banner = document.getElementById('banner');
  banner.style.display = 'block';
  banner.textContent = 'Calculating…';
  document.getElementById('sA').innerHTML = '';
  document.getElementById('sL').innerHTML = '';

  setTimeout(() => {
    const t0 = performance.now();
    recording = buildRecording();
    const computeMs = performance.now() - t0;
    banner.textContent = 'Computed in ' + fmtTime(computeMs) +
                         ' — playing back ' + recording.ticks + ' frames';
    setTimeout(() => { banner.style.display = 'none'; }, 1500);

    resetPlayback();
    paused = false; finished = false; lastFrameTime = 0;
    document.getElementById('pauseBtn').innerText = 'Pause';
    renderCurrent();
  }, 20);
}

function togglePause(){
  if(finished) return;
  paused = !paused;
  document.getElementById('pauseBtn').innerText = paused ? 'Resume' : 'Pause';
}

function loop(now){
  requestAnimationFrame(loop);
  if(paused || finished || !recording) return;
  if(now - lastFrameTime < TICK_DELAY) return;
  lastFrameTime = now;

  const lastIdx = recording.ticks - 1;

  // instant mode: jump to end immediately
  if(PLAYBACK_SPEED >= 9999){
    advanceToFrame(lastIdx);
    renderCurrent();
    finished = true;
    document.getElementById('pauseBtn').innerText = 'Done';
    return;
  }

  tickAccumulator += PLAYBACK_SPEED;
  const advanceBy = Math.floor(tickAccumulator);
  if(advanceBy <= 0){ renderCurrent(); return; }
  tickAccumulator -= advanceBy;

  const target = playbackIdx + advanceBy;
  if(target >= lastIdx){
    advanceToFrame(lastIdx);
    renderCurrent();
    finished = true;
    document.getElementById('pauseBtn').innerText = 'Done';
    return;
  }
  advanceToFrame(target);
  renderCurrent();
}

// ===================================================================
// mass test  (with timing reps)
// ===================================================================
const MASS_N = 12;
const MASS_MAX_ITERS = 20000;
const MASS_MIN_TIME_MS = 5;   // run until cumulative time exceeds this
const MASS_MAX_REPS = 30;
let lastSeeds = null;

function runOneOnce(factory, isLSB){
  const algo = factory();
  let iters = 0;
  while(!algo.done && iters < MASS_MAX_ITERS){ algo.step(BUDGET_PER_TICK); iters++; }
  const s = getStats(algo, isLSB);
  return {
    stats: s,
    algMs: algo.algMs,
    backtracks: s.backtracks, parks: s.parks,
    resumes: s.resumes, kills: s.kills
  };
}

// Run each algorithm multiple times on the same maze, average the timing.
// Structural results (counts, path) are identical between reps.
function runBench(factory, isLSB){
  let totalMs = 0, reps = 0;
  let last = null;
  while(reps < MASS_MAX_REPS){
    last = runOneOnce(factory, isLSB);
    totalMs += last.algMs;
    reps++;
    if(totalMs >= MASS_MIN_TIME_MS) break;
  }
  return {
    ...last,
    avgMs: totalMs / reps,
    reps: reps,
    totalMs: totalMs
  };
}

function massTest(reuse){
  paused = true;
  document.getElementById('pauseBtn').innerText = 'Resume';
  const out = document.getElementById('results');
  out.style.display = 'block';
  out.textContent = 'Running ' + MASS_N + ' mazes (timing reps until stable)…';

  setTimeout(() => {
    let plans;
    if(reuse && lastSeeds){ plans = lastSeeds.slice(); }
    else {
      plans = [];
      for(let i=0; i<MASS_N; i++){
        const t = MAZE_TYPES[i % MAZE_TYPES.length];
        plans.push({ type: t.name, fn: t.fn, seed: freshSeed() });
      }
      lastSeeds = plans;
    }

    const rows = [];
    let aSuccess=0, lSuccess=0;
    let aWins=0, lWins=0, ties=0;
    const acc = { aTime:0, lTime:0, aExp:0, lExp:0, aPath:0, lPath:0,
                  lBT:0, lParks:0, lRes:0, lKills:0, n:0 };

    for(const plan of plans){
      const g = plan.fn(plan.seed);
      const S = [1,1], G = [W-3,H-3];

      const ra = runBench(() => new AStar(g, S, G), false);
      const rl = runBench(() => new LSB(g, S, G), true);

      const aOk = ra.stats.success;
      const lOk = rl.stats.success;
      if(aOk) aSuccess++;
      if(lOk) lSuccess++;

      let verdict;
      if(!aOk && !lOk) verdict = 'both FAIL';
      else if(!lOk) verdict = 'A* (LSB fail)';
      else if(!aOk) verdict = 'LSB (A* fail)';
      else if(ra.stats.expanded < rl.stats.expanded) verdict = 'A*';  aWins++;
      else if(rl.stats.expanded < ra.stats.expanded) verdict = 'LSB'; lWins++;
      else { verdict = 'tie'; ties++; }

      if(aOk && lOk){
        acc.aTime += ra.avgMs; acc.lTime += rl.avgMs;
        acc.aExp += ra.stats.expanded; acc.lExp += rl.stats.expanded;
        acc.aPath += ra.stats.pathLen ?? 0; acc.lPath += rl.stats.pathLen ?? 0;
        acc.lBT += rl.backtracks ?? 0;
        acc.lParks += rl.parks ?? 0;
        acc.lRes += rl.resumes ?? 0;
        acc.lKills += rl.kills ?? 0;
        acc.n++;
      }
      rows.push({
        type: plan.type, seed: plan.seed,
        aTime: ra.avgMs, lTime: rl.avgMs,
        aReps: ra.reps, lReps: rl.reps,
        aExp: ra.stats.expanded, lExp: rl.stats.expanded,
        aPath: ra.stats.pathLen, lPath: rl.stats.pathLen,
        aSuccess: aOk, lSuccess: lOk,
        lReason: rl.stats.pathReason,
        lBT: rl.backtracks, lParks: rl.parks,
        lRes: rl.resumes, lKills: rl.kills,
        verdict
      });
    }

    const pad = (s,n)=>{ s=String(s); while(s.length<n) s+=' '; return s.slice(0,n); };
    const padL= (s,n)=>{ s=String(s); while(s.length<n) s=' '+s; return s.slice(-n); };

    let txt = '';
    txt += 'MASS TEST — ' + MASS_N + ' mazes (' + W + 'x' + H + ')' +
           (reuse ? '  [reused seeds]' : '  [fresh seeds]') + '\n';
    txt += 'Verdict by expanded-cells. Success requires validated path.\n';
    txt += 'Timing averaged over multiple reps (until ≥' + MASS_MIN_TIME_MS + 'ms cumulative).\n\n';
    txt += pad('type',9) + padL('seed',12) + padL('A*t',9) + padL('LSBt',9)
         + padL('A*exp',7) + padL('LSBexp',8)
         + padL('A*pth',7) + padL('LSBpth',8)
         + padL('ok',4) + padL('rep',5)
         + padL('LSBbt',7) + padL('park',6) + padL('res',5) + padL('kill',6)
         + '  verdict\n';
    txt += '─'.repeat(9+12+9+9+7+8+7+8+4+5+7+6+5+6+12) + '\n';
    for(const r of rows){
      txt += pad(r.type, 9)
          + padL(r.seed.toString(16), 12)
          + padL(fmtTime(r.aTime), 9)
          + padL(fmtTime(r.lTime), 9)
          + padL(r.aExp, 7)
          + padL(r.lExp, 8)
          + padL(r.aPath ?? '—', 7)
          + padL(r.lPath ?? '—', 8)
          + padL(r.aSuccess && r.lSuccess ? 'Y/Y' : (r.aSuccess?'Y/N':'N/N'), 4)
          + padL(r.aReps + '/' + r.lReps, 5)
          + padL(r.lBT ?? '—', 7)
          + padL(r.lParks ?? '—', 6)
          + padL(r.lRes ?? '—', 5)
          + padL(r.lKills ?? '—', 6)
          + '  ' + r.verdict + '\n';
      if(!r.lSuccess && r.lReason && r.lReason !== 'no path'){
        txt += '  ↳ LSB path invalid: ' + r.lReason + '\n';
      }
    }
    txt += '─'.repeat(9+12+9+9+7+8+7+8+4+5+7+6+5+6+12) + '\n';
    if(acc.n > 0){
      txt += pad('AVG', 9) + padL('', 12)
          + padL(fmtTime(acc.aTime/acc.n), 9)
          + padL(fmtTime(acc.lTime/acc.n), 9)
          + padL((acc.aExp/acc.n).toFixed(0), 7)
          + padL((acc.lExp/acc.n).toFixed(0), 8)
          + padL((acc.aPath/acc.n).toFixed(0), 7)
          + padL((acc.lPath/acc.n).toFixed(0), 8)
          + padL('', 4) + padL('', 5)
          + padL((acc.lBT/acc.n).toFixed(0), 7)
          + padL((acc.lParks/acc.n).toFixed(0), 6)
          + padL((acc.lRes/acc.n).toFixed(0), 5)
          + padL((acc.lKills/acc.n).toFixed(0), 6)
          + '  (n=' + acc.n + ')\n';
    }
    txt += '\nSUCCESS  A*: ' + aSuccess + '/' + MASS_N
         + '   LSB: ' + lSuccess + '/' + MASS_N + '\n';
    txt += 'WINS  A*: ' + aWins + '   LSB: ' + lWins + '   tie: ' + ties + '\n\n';

    txt += 'Per-type breakdown (both solved):\n';
    for(const t of MAZE_TYPES){
      const sub = rows.filter(r => r.type === t.name && r.aSuccess && r.lSuccess);
      if(sub.length === 0){ txt += '  ' + pad(t.name, 9) + '  (none)\n'; continue; }
      const aAvg = (sub.reduce((s,r)=>s+r.aExp,0) / sub.length).toFixed(0);
      const lAvg = (sub.reduce((s,r)=>s+r.lExp,0) / sub.length).toFixed(0);
      const lBT  = (sub.reduce((s,r)=>s+(r.lBT||0),0) / sub.length).toFixed(0);
      txt += '  ' + pad(t.name, 9) + '  A* exp ' + padL(aAvg, 6)
           + '   LSB exp ' + padL(lAvg, 6)
           + '   LSB avg bt ' + padL(lBT, 6)
           + '   n=' + sub.length + '\n';
    }

    out.textContent = txt;
  }, 30);
}

// ===================================================================
// start
// ===================================================================
setSpeed(1);   // default playback: 1 recorded tick per frame (~60 tps)
setScenario('maze_any');
requestAnimationFrame(loop);
</script>
