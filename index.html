<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSB vs A*</title>
<style>
  body { background:#111; color:#eee; font-family: monospace; margin:0; padding:12px; }
  h2 { margin: 4px 0; font-size: 15px; }
  canvas { display:block; image-rendering: pixelated; background:#000; margin-bottom:8px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .col { flex:1; min-width:320px; }
  .panel { background:#181818; padding:8px; border-radius:6px; }
  .stats { font-size:12px; line-height:1.5; color:#bbb; }
  .stats b { color:#fff; }
  button { background:#2a2a2a; color:#eee; border:1px solid #444; padding:8px 12px;
           border-radius:5px; font-family:monospace; font-size:13px; margin:3px; }
  button:active { background:#444; }
  .legend { font-size:11px; color:#888; margin-top:6px; }
  .sw { display:inline-block; width:10px; height:10px; vertical-align:middle; margin-right:4px; }
  pre#results { background:#0a0a0a; padding:10px; border-radius:6px; font-size:11px;
                line-height:1.4; overflow-x:auto; color:#ddd; margin-top:10px;
                border:1px solid #333; white-space:pre; }
  .win  { color:#6f6; }
  .lose { color:#f88; }
</style>
</head>
<body>

<div class="panel" style="margin-bottom:8px;">
  <button onclick="setScenario('open')">Open</button>
  <button onclick="setScenario('sparse')">Sparse blocks</button>
  <button onclick="setScenario('r020')">Random 0.20</button>
  <button onclick="setScenario('r030')">Random 0.30</button>
  <button onclick="setScenario('r038')">Dense 0.38</button>
  <button onclick="setScenario('maze1')">Perfect maze #1</button>
  <button onclick="setScenario('maze2')">Perfect maze #2</button>
  <button onclick="setScenario('maze3')">Perfect maze #3</button>
  <button onclick="togglePause()" id="pauseBtn">Pause</button>
  <button onclick="restart()">Restart</button>
  <button style="background:#333;border-color:#666" onclick="massTest()">▶ Mass test (10 mazes)</button>
</div>

<div class="row">
  <div class="col panel">
    <h2>A*</h2>
    <canvas id="cA" width="480" height="240"></canvas>
    <div class="stats" id="sA"></div>
  </div>
  <div class="col panel">
    <h2>LSB</h2>
    <canvas id="cL" width="480" height="240"></canvas>
    <div class="stats" id="sL"></div>
  </div>
</div>

<div class="legend panel">
  <span class="sw" style="background:#0a0"></span>start
  <span class="sw" style="background:#c0c"></span>goal
  <span class="sw" style="background:#555"></span>wall
  <span class="sw" style="background:#ff0"></span>branch head
  <span class="sw" style="background:#2a4a7a"></span>visited
  <span class="sw" style="background:#0ff"></span>final path
  <span class="sw" style="background:#a00"></span>dead (scarred)
</div>

<pre id="results" style="display:none"></pre>

<script>
// ---------- config ----------
const W = 60, H = 30;
const CELL = Math.floor(480 / W);
let START = [0, 0];
let GOAL  = [W-1, H-1];
let TICK_DELAY = 20;
let BUDGET_PER_TICK = 8;

// ---------- rng ----------
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

// ---------- maze gen ----------
function makeOpen(){
  return Array.from({length:H},()=>Array(W).fill(0));
}
function makeSparse(){
  const g = Array.from({length:H},()=>Array(W).fill(0));
  const blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(const [x0,y0,x1,y1] of blocks)
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}
function makeRandom(density, seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(r()<density) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}
function makePerfectMaze(seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const rx = Math.floor((W-1)/2);
  const ry = Math.floor((H-1)/2);
  const visited = Array.from({length:ry},()=>Array(rx).fill(false));
  const stack = [[0,0]];
  visited[0][0]=true;
  g[1][1]=0;
  while(stack.length){
    const [cx,cy] = stack[stack.length-1];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=rx||ny<0||ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dy][cx*2+1+dx]=0;
      g[ny*2+1][nx*2+1]=0;
      visited[ny][nx]=true;
      stack.push([nx,ny]);
      moved=true;
      break;
    }
    if(!moved) stack.pop();
  }
  return g;
}

// ---------- helpers ----------
function manhattan(a,b){ return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]); }
function euclid(a,b){ const dx=a[0]-b[0],dy=a[1]-b[1]; return Math.hypot(dx,dy); }
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function neighbors(grid,c){
  const out=[];
  for(const [dx,dy] of N4){
    const x=c[0]+dx, y=c[1]+dy;
    if(x>=0&&x<W&&y>=0&&y<H&&grid[y][x]===0) out.push([x,y]);
  }
  return out;
}
function key(c){ return c[1]*W+c[0]; }

// ---------- MinHeap ----------
class MinHeap {
  constructor(){ this.h=[]; }
  push(item){ this.h.push(item); this._up(this.h.length-1); }
  pop(){
    const top = this.h[0];
    const last = this.h.pop();
    if(this.h.length){ this.h[0]=last; this._down(0); }
    return top;
  }
  get size(){ return this.h.length; }
  _up(i){
    const h=this.h;
    while(i>0){
      const p=(i-1)>>1;
      if(h[p][0]<=h[i][0]) break;
      [h[p],h[i]]=[h[i],h[p]];
      i=p;
    }
  }
  _down(i){
    const h=this.h, n=h.length;
    while(true){
      let l=2*i+1, r=2*i+2, s=i;
      if(l<n && h[l][0]<h[s][0]) s=l;
      if(r<n && h[r][0]<h[s][0]) s=r;
      if(s===i) break;
      [h[s],h[i]]=[h[i],h[s]];
      i=s;
    }
  }
}

// ---------- A* ----------
class AStar {
  constructor(grid, start, goal){
    this.grid=grid; this.start=start; this.goal=goal;
    this.name="A*";
    this.open = new MinHeap();
    this.open.push([manhattan(start,goal), 0, start]);
    this.g = new Map(); this.g.set(key(start), 0);
    this.came = new Map();
    this.closed = new Set();
    this.visited = new Set([key(start)]);
    this.frontier = new Set([key(start)]);
    this.done=false; this.path=null; this.expanded=0; this.elapsed=null;
  }
  step(budget){
    let spent = 0;
    while(spent < budget && !this.done){
      if(this.open.size === 0){ this.done=true; return; }
      const [,g,c] = this.open.pop();
      const kc = key(c);
      if(this.closed.has(kc)) continue;
      this.closed.add(kc);
      this.visited.add(kc);
      this.frontier.delete(kc);
      this.expanded++;
      spent++;
      if(c[0]===this.goal[0] && c[1]===this.goal[1]){
        this.done=true; this._recon(c); return;
      }
      for(const n of neighbors(this.grid,c)){
        const ng = g+1;
        const kn = key(n);
        if(this.closed.has(kn)) continue;
        const cur = this.g.get(kn);
        if(cur===undefined || ng < cur){
          this.g.set(kn, ng);
          this.came.set(kn, c);
          this.open.push([ng+manhattan(n,this.goal), ng, n]);
          this.frontier.add(kn);
        }
      }
    }
  }
  _recon(end){
    const p=[]; let c=end;
    while(c){ p.push(c); c=this.came.get(key(c)); }
    p.reverse(); this.path=p;
  }
}

// ---------- LSB ----------
class Branch {
  constructor(cell, path, cameFrom){
    this.cell = cell;
    this.path = path.slice();
    this.cameFrom = cameFrom;
    this.pathSet = new Set();
    for(const c of this.path) this.pathSet.add(key(c));
    this.stack = [];
    this.best = 0;
  }
  clone(){
    const b = new Branch(this.cell, this.path, this.cameFrom);
    b.best = this.best;
    b.stack = this.stack.map(s => ({
      cell: s.cell,
      options: s.options.slice(),
      nextIdx: s.nextIdx,
      pathIdx: s.pathIdx
    }));
    return b;
  }
}

class LSB {
  constructor(grid, start, goal, opts={}){
    this.grid=grid; this.start=start; this.goal=goal;
    this.name="LSB";
    this.max_branches   = opts.max_branches   ?? 16;
    this.scar_threshold = opts.scar_threshold ?? 2.5;
    this.scar_decay     = opts.scar_decay     ?? 0.004;
    this.tryEps         = opts.tryEps         ?? 0.5;
    this.scar = new Map();
    const b = new Branch(start, [start], null);
    b.best = manhattan(start, goal);
    this.branches=[b];
    this.done=false; this.path=null; this.expanded=0; this.tick=0;
    this.backtracks=0; this.elapsed=null;
    this.visited = new Set([key(start)]);
    this.frontier = new Set([key(start)]);
    this.dead = new Set();
  }
  _scarAdd(c, amt){ this.scar.set(key(c), (this.scar.get(key(c))||0)+amt); }
  _scarGet(c){ return this.scar.get(key(c))||0; }

  step(budget){
    for(let i=0; i<budget && !this.done; i++){
      if(this.branches.length === 0){ this.done=true; return; }
      this.tick++;
      const next = [];
      for(const b of this.branches){
        this.stepBranch(b, next);
        if(this.done) return;
      }
      next.sort((a,b) => a.best - b.best);
      this.branches = next.slice(0, this.max_branches);
      this.frontier = new Set(this.branches.map(b => key(b.cell)));
      if(this.scar_decay>0 && this.tick%60===0){
        for(const k of Array.from(this.scar.keys())){
          const v = this.scar.get(k)*(1-this.scar_decay);
          if(v<0.05) this.scar.delete(k); else this.scar.set(k,v);
        }
      }
    }
  }

  stepBranch(b, next){
    if(b.cell[0]===this.goal[0] && b.cell[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }
    const opts = neighbors(this.grid, b.cell).filter(n => !b.pathSet.has(key(n)));
    if(opts.length === 0){
      const dead = this.backtrack(b, next);
      if(!dead) next.push(b);
      return;
    }
    opts.sort((p,q) => euclid(p, this.goal) - euclid(q, this.goal));
    const primary = opts[0];

    if(opts.length > 1){
      const bestD = euclid(primary, this.goal);
      const tied = opts.filter(o => Math.abs(euclid(o, this.goal) - bestD) < this.tryEps);

      if(tied.length > 1){
        for(let i=1; i<tied.length; i++){
          if(next.length + this.branches.length >= this.max_branches) break;
          const nb = b.clone();
          const nt = tied[i];
          nb.stack.push({
            cell: b.cell,
            options: opts.slice(),
            nextIdx: tied.length,
            pathIdx: b.path.length - 1
          });
          nb.path.push(nt);
          nb.pathSet.add(key(nt));
          nb.cameFrom = b.cell;
          nb.cell = nt;
          nb.best = Math.min(nb.best, manhattan(nt, this.goal));
          this.visited.add(key(nt));
          this.expanded++;
          next.push(nb);
        }
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: tied.length,
          pathIdx: b.path.length - 1
        });
      } else {
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: 1,
          pathIdx: b.path.length - 1
        });
      }
    }

    b.path.push(primary);
    b.pathSet.add(key(primary));
    b.cameFrom = b.cell;
    b.cell = primary;
    this.visited.add(key(primary));
    this.expanded++;
    const d = manhattan(primary, this.goal);
    if(d < b.best) b.best = d;

    if(primary[0]===this.goal[0] && primary[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }
    next.push(b);
  }

  backtrack(b, next){
    this.backtracks++;
    while(b.stack.length > 0){
      const top = b.stack[b.stack.length - 1];
      if(top.nextIdx < top.options.length){
        const nt = top.options[top.nextIdx];
        top.nextIdx++;
        for(let i = b.path.length - 1; i > top.pathIdx; i--){
          b.pathSet.delete(key(b.path[i]));
        }
        b.path = b.path.slice(0, top.pathIdx + 1);
        b.path.push(nt);
        b.pathSet.add(key(nt));
        b.cameFrom = top.cell;
        b.cell = nt;
        this.visited.add(key(nt));
        this.expanded++;
        const d = manhattan(nt, this.goal);
        if(d < b.best) b.best = d;
        if(nt[0]===this.goal[0] && nt[1]===this.goal[1]){
          this.done=true; this.path=b.path; return false;
        }
        return false;
      }
      b.stack.pop();
    }
    for(const c of b.path){
      this._scarAdd(c, 0.5);
      this.dead.add(key(c));
    }
    return true;
  }
}

// ---------- rendering ----------
const cA = document.getElementById('cA');
const cL = document.getElementById('cL');
cA.width = W*CELL; cA.height = H*CELL;
cL.width = W*CELL; cL.height = H*CELL;
const ctxA = cA.getContext('2d');
const ctxL = cL.getContext('2d');

const COLOR = {
  wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', visited:'#2a4a7a', path:'#0ff', dead:'#a00'
};

function draw(ctx, grid, algo){
  ctx.fillStyle = COLOR.open;
  ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const pathSet = algo.path ? new Set(algo.path.map(key)) : null;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const k = y*W+x;
      let col = null;
      if(grid[y][x]===1) col = COLOR.wall;
      else if(algo.dead && algo.dead.has(k)) col = COLOR.dead;
      else if(algo.visited.has(k)) col = COLOR.visited;
      if(algo.frontier.has(k)) col = COLOR.frontier;
      if(pathSet && pathSet.has(k)) col = COLOR.path;
      if(x===START[0]&&y===START[1]) col = COLOR.start;
      if(x===GOAL[0]&&y===GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle=col; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
    }
  }
}

function stats(algo){
  let s = `expanded: <b>${algo.expanded}</b><br>` +
          `unique cells: <b>${algo.visited.size}</b><br>` +
          `path length: <b>${algo.path?algo.path.length:'—'}</b><br>` +
          `frontier: <b>${algo.frontier.size}</b><br>`;
  if(algo.backtracks !== undefined) s += `backtracks: <b>${algo.backtracks}</b><br>`;
  s += `done: <b>${algo.done}</b><br>`;
  s += `time: <b>${algo.elapsed !== null ? (algo.elapsed/1000).toFixed(2)+'s' : '…'}</b>`;
  return s;
}

// ---------- driver ----------
let grid, a, l, paused=false, t0=0, lastFrame=0, finished=false;

function setScenario(name){
  if(name==='open'){        START=[0,0]; GOAL=[W-1,H-1]; grid = makeOpen(); }
  else if(name==='sparse'){ START=[0,0]; GOAL=[W-1,H-1]; grid = makeSparse(); }
  else if(name==='r020'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.20, 1); }
  else if(name==='r030'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.30, 2); }
  else if(name==='r038'){   START=[0,0]; GOAL=[W-1,H-1]; grid = makeRandom(0.38, 3); }
  else if(name==='maze1'){  grid = makePerfectMaze(1);  START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze2'){  grid = makePerfectMaze(7);  START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze3'){  grid = makePerfectMaze(42); START=[1,1]; GOAL=[W-3,H-3]; }
  restart();
}

function restart(){
  a = new AStar(grid, START, GOAL);
  l = new LSB(grid, START, GOAL);
  paused=false; finished=false;
  t0=performance.now();
  lastFrame=0;
  document.getElementById('pauseBtn').innerText = 'Pause';
  draw(ctxA, grid, a); draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);
}

function togglePause(){
  if(finished) return;
  paused = !paused;
  document.getElementById('pauseBtn').innerText = paused ? 'Resume' : 'Pause';
}

function loop(now){
  requestAnimationFrame(loop);
  if(paused || finished) return;
  if(now - lastFrame < TICK_DELAY) return;
  lastFrame = now;

  if(!a.done) a.step(BUDGET_PER_TICK);
  if(!l.done) l.step(BUDGET_PER_TICK);

  const tNow = performance.now();
  if(a.done && a.elapsed === null) a.elapsed = tNow - t0;
  if(l.done && l.elapsed === null) l.elapsed = tNow - t0;

  draw(ctxA, grid, a);
  draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);

  if(a.done && l.done){
    finished = true;
    document.getElementById('pauseBtn').innerText = 'Done';
  }
}

// ---------- mass test ----------
// Runs N random perfect mazes headless. Same start/goal per maze.
// Caps iterations so a stuck algorithm is marked DNF rather than hanging.
const MASS_N = 10;
const MASS_MAX_ITERS = 20000;

function runOne(grid, algo){
  // algo is a fresh instance. Step until done or cap.
  const t0 = performance.now();
  let iters = 0;
  while(!algo.done && iters < MASS_MAX_ITERS){
    algo.step(500);
    iters++;
  }
  const ms = performance.now() - t0;
  return {
    done: algo.done,
    expanded: algo.expanded,
    unique: algo.visited.size,
    pathLen: algo.path ? algo.path.length : null,
    backtracks: algo.backtracks !== undefined ? algo.backtracks : null,
    ms
  };
}

function massTest(){
  // Pause the live animation so it doesn't fight for the frame.
  paused = true;
  document.getElementById('pauseBtn').innerText = 'Resume';
  const out = document.getElementById('results');
  out.style.display = 'block';
  out.textContent = 'Running ' + MASS_N + ' perfect mazes...\n';

  // Defer so the "Running..." message paints before the synchronous block.
  setTimeout(() => {
    const rows = [];
    let aWins = 0, lWins = 0, ties = 0;
    let sumATime=0, sumLTime=0, sumAUniq=0, sumLUniq=0, sumAPath=0, sumLPath=0, sumLBT=0;
    let aDNF=0, lDNF=0;

    for(let i=1; i<=MASS_N; i++){
      const g = makePerfectMaze(i * 1013);
      const S = [1,1];
      const G = [W-3,H-3];
      const aa = new AStar(g, S, G);
      const ll = new LSB(g, S, G);
      const ra = runOne(g, aa);
      const rl = runOne(g, ll);

      sumATime += ra.ms;
      sumLTime += rl.ms;
      sumAUniq += ra.unique;
      sumLUniq += rl.unique;
      sumAPath += ra.pathLen ?? 0;
      sumLPath += rl.pathLen ?? 0;
      sumLBT   += rl.backtracks ?? 0;
      if(!ra.done) aDNF++;
      if(!rl.done) lDNF++;

      // "winner" = fewer unique cells (fairer than wall time on JS engines)
      let verdict;
      if(!rl.done) verdict = 'A* (LSB DNF)';
      else if(!ra.done) verdict = 'LSB (A* DNF)';
      else if(rl.unique < ra.unique) { verdict = 'LSB'; lWins++; }
      else if(ra.unique < rl.unique) { verdict = 'A*';  aWins++; }
      else { verdict = 'tie'; ties++; }

      rows.push({
        seed: i*1013,
        aTime: ra.ms, lTime: rl.ms,
        aUniq: ra.unique, lUniq: rl.unique,
        aPath: ra.pathLen, lPath: rl.pathLen,
        lBT: rl.backtracks,
        aDone: ra.done, lDone: rl.done,
        verdict
      });
    }

    const pad = (s, n) => {
      s = String(s);
      while(s.length < n) s += ' ';
      return s.slice(0, n);
    };
    const padL = (s, n) => {
      s = String(s);
      while(s.length < n) s = ' ' + s;
      return s.slice(-n);
    };

    let txt = '';
    txt += 'MASS TEST — ' + MASS_N + ' perfect mazes (size ' + W + 'x' + H + ')\n';
    txt += 'Winner by unique-cells-touched (lower is better).\n';
    txt += '\n';
    txt += pad('seed',7) + padL('A*ms',8) + padL('LSBms',8) +
           padL('A*uniq',8) + padL('LSBuniq',9) +
           padL('A*path',8) + padL('LSBpath',9) +
           padL('LSBbt',7) + '  verdict\n';
    txt += '─'.repeat(7+8+8+8+9+8+9+7+10) + '\n';
    for(const r of rows){
      txt += pad(r.seed, 7)
          + padL(r.aTime.toFixed(1), 8)
          + padL(r.lTime.toFixed(1), 8)
          + padL(r.aDone ? r.aUniq : 'DNF', 8)
          + padL(r.lDone ? r.lUniq : 'DNF', 9)
          + padL(r.aPath ?? '—', 8)
          + padL(r.lPath ?? '—', 9)
          + padL(r.lBT ?? '—', 7)
          + '  ' + r.verdict + '\n';
    }
    txt += '─'.repeat(7+8+8+8+9+8+9+7+10) + '\n';
    txt += pad('AVG', 7)
        + padL((sumATime/MASS_N).toFixed(1), 8)
        + padL((sumLTime/MASS_N).toFixed(1), 8)
        + padL((sumAUniq/MASS_N).toFixed(0), 8)
        + padL((sumLUniq/MASS_N).toFixed(0), 9)
        + padL((sumAPath/MASS_N).toFixed(0), 8)
        + padL((sumLPath/MASS_N).toFixed(0), 9)
        + padL((sumLBT/MASS_N).toFixed(0), 7)
        + '\n\n';
    txt += 'WINS  A*: ' + aWins + '   LSB: ' + lWins + '   tie: ' + ties + '\n';
    txt += 'DNF   A*: ' + aDNF + '   LSB: ' + lDNF + '\n';
    txt += '\n';
    txt += 'Totals over ' + MASS_N + ' mazes:\n';
    txt += '  A*  total unique: ' + sumAUniq + '   total time: ' + sumATime.toFixed(0) + ' ms\n';
    txt += '  LSB total unique: ' + sumLUniq + '   total time: ' + sumLTime.toFixed(0) + ' ms\n';
    txt += '  LSB total backtracks: ' + sumLBT + '\n';

    out.textContent = txt;
  }, 30);
}

setScenario('maze1');
requestAnimationFrame(loop);
</script>
