<html>

<body>

  <span class="sw" style="background:#2a4a7a"></span>visited

<pre id="results" style="display:none"></pre>

<script>
// ---------- config ----------
const W = 60, H = 30;
const CELL = Math.floor(480 / W);
let START = [0, 0];
let GOAL  = [W-1, H-1];
let TICK_DELAY = 20;
let BUDGET_PER_TICK = 8;
let lastMazeType = '—';

// ---------- rng ----------
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

// ---------- fresh seeds ----------
let seedCounter = 0;
function freshSeed(){
  seedCounter++;
  // Mix wall-clock, Math.random, and a counter so consecutive calls never collide
  const t = Date.now() >>> 0;
  const r = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
  return ((t ^ r ^ (seedCounter * 2654435761)) >>> 0);
}

// ---------- random obstacle grids ----------
function makeOpen(){ return Array.from({length:H},()=>Array(W).fill(0)); }
function makeSparse(){
  const g = Array.from({length:H},()=>Array(W).fill(0));
  const blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(const [x0,y0,x1,y1] of blocks)
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}
function makeRandom(density, seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(r()<density) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}

// ---------- maze generators ----------
// Grid convention: odd/odd coords are "rooms", everything else is a wall.
// All three algorithms produce a *perfect maze* (a spanning tree).
// rx = number of rooms across, ry = number of rooms down.
function roomDims(){
  return [Math.floor((W-1)/2), Math.floor((H-1)/2)];
}

// Recursive backtracker — long winding corridors, few big dead ends
function makeMazeDFS(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const visited = Array.from({length:ry},()=>Array(rx).fill(false));
  const stack = [[0,0]];
  visited[0][0] = true;
  g[1][1] = 0;
  while(stack.length){
    const [cx,cy] = stack[stack.length-1];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=rx||ny<0||ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dy][cx*2+1+dx]=0;
      g[ny*2+1][nx*2+1]=0;
      visited[ny][nx]=true;
      stack.push([nx,ny]);
      moved=true;
      break;
    }
    if(!moved) stack.pop();
  }
  return g;
}

// Prim's — bushy, many short dead ends
function makeMazePrim(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const inMaze = Array.from({length:ry},()=>Array(rx).fill(false));
  const frontier = [];
  inMaze[0][0] = true;
  g[1][1] = 0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=dx, ny=dy;
    if(nx>=0&&nx<rx&&ny>=0&&ny<ry) frontier.push([nx,ny,0,0]);
  }
  while(frontier.length){
    const i = Math.floor(r()*frontier.length);
    const [nx,ny,px,py] = frontier.splice(i,1)[0];
    if(inMaze[ny][nx]) continue;
    g[ny*2+1][nx*2+1] = 0;
    g[py*2+1 + (ny-py)][px*2+1 + (nx-px)] = 0;
    inMaze[ny][nx] = true;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ax=nx+dx, ay=ny+dy;
      if(ax>=0&&ax<rx&&ay>=0&&ay<ry&&!inMaze[ay][ax]) frontier.push([ax,ay,nx,ny]);
    }
  }
  return g;
}

// Kruskal's — uniform texture, lots of small passages
function makeMazeKruskal(seed){
  const r = rng(seed);
  const [rx, ry] = roomDims();
  const g = Array.from({length:H},()=>Array(W).fill(1));
  // carve all rooms
  for(let y=0;y<ry;y++) for(let x=0;x<rx;x++) g[y*2+1][x*2+1]=0;
  // DSU
  const parent = new Int32Array(rx*ry);
  for(let i=0;i<rx*ry;i++) parent[i]=i;
  function find(x){
    while(parent[x]!==x){
      parent[x] = parent[parent[x]];
      x = parent[x];
    }
    return x;
  }
  // walls between rooms
  const walls = [];
  for(let y=0;y<ry;y++) for(let x=0;x<rx;x++){
    if(x+1<rx) walls.push([x,y,x+1,y]);
    if(y+1<ry) walls.push([x,y,x,y+1]);
  }
  for(let i=walls.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [walls[i],walls[j]]=[walls[j],walls[i]]; }
  for(const [x1,y1,x2,y2] of walls){
    const ra = find(y1*rx+x1), rb = find(y2*rx+x2);
    if(ra!==rb){
      parent[ra] = rb;
      const wx = x1*2+1 + (x2-x1);
      const wy = y1*2+1 + (y2-y1);
      g[wy][wx] = 0;
    }
  }
  return g;
}

const MAZE_TYPES = [
  { name:'DFS',     fn: makeMazeDFS },
  { name:'Prim',    fn: makeMazePrim },
  { name:'Kruskal', fn: makeMazeKruskal },
];

function makeMazeOfType(typeName, seed){
  const t = MAZE_TYPES.find(t => t.name === typeName);
  return t ? t.fn(seed) : makeMazeDFS(seed);
}

// ---------- helpers ----------
function manhattan(a,b){ return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]); }
function euclid(a,b){ const dx=a[0]-b[0],dy=a[1]-b[1]; return Math.hypot(dx,dy); }
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function neighbors(grid,c){
  const out=[];
  for(const [dx,dy] of N4){
    const x=c[0]+dx, y=c[1]+dy;
    if(x>=0&&x<W&&y>=0&&y<H&&grid[y][x]===0) out.push([x,y]);
  }
  return out;
}
function key(c){ return c[1]*W+c[0]; }

// ---------- MinHeap ----------
class MinHeap {
  constructor(){ this.h=[]; }
  push(item){ this.h.push(item); this._up(this.h.length-1); }
  pop(){
    const top = this.h[0];
    const last = this.h.pop();
    if(this.h.length){ this.h[0]=last; this._down(0); }
    return top;
  }
  get size(){ return this.h.length; }
  _up(i){
    const h=this.h;
    while(i>0){
      const p=(i-1)>>1;
      if(h[p][0]<=h[i][0]) break;
      [h[p],h[i]]=[h[i],h[p]];
      i=p;
    }
  }
  _down(i){
    const h=this.h, n=h.length;
    while(true){
      let l=2*i+1, r=2*i+2, s=i;
      if(l<n && h[l][0]<h[s][0]) s=l;
      if(r<n && h[r][0]<h[s][0]) s=r;
      if(s===i) break;
      [h[s],h[i]]=[h[i],h[s]];
      i=s;
    }
  }
}

// ---------- A* ----------
class AStar {
  constructor(grid, start, goal){
    this.grid=grid; this.start=start; this.goal=goal;
    this.name="A*";
    this.open = new MinHeap();
    this.open.push([manhattan(start,goal), 0, start]);
    this.g = new Map(); this.g.set(key(start), 0);
    this.came = new Map();
    this.closed = new Set();
    this.visited = new Set([key(start)]);
    this.frontier = new Set([key(start)]);
    this.done=false; this.path=null; this.expanded=0; this.elapsed=null;
  }
  step(budget){
    let spent = 0;
    while(spent < budget && !this.done){
      if(this.open.size === 0){ this.done=true; return; }
      const [,g,c] = this.open.pop();
      const kc = key(c);
      if(this.closed.has(kc)) continue;
      this.closed.add(kc);
      this.visited.add(kc);
      this.frontier.delete(kc);
      this.expanded++;
      spent++;
      if(c[0]===this.goal[0] && c[1]===this.goal[1]){
        this.done=true; this._recon(c); return;
      }
      for(const n of neighbors(this.grid,c)){
        const ng = g+1;
        const kn = key(n);
        if(this.closed.has(kn)) continue;
        const cur = this.g.get(kn);
        if(cur===undefined || ng < cur){
          this.g.set(kn, ng);
          this.came.set(kn, c);
          this.open.push([ng+manhattan(n,this.goal), ng, n]);
          this.frontier.add(kn);
        }
      }
    }
  }
  _recon(end){
    const p=[]; let c=end;
    while(c){ p.push(c); c=this.came.get(key(c)); }
    p.reverse(); this.path=p;
  }
}

// ---------- LSB ----------
class Branch {
  constructor(cell, path, cameFrom){
    this.cell = cell;
    this.path = path.slice();
    this.cameFrom = cameFrom;
    this.pathSet = new Set();
    for(const c of this.path) this.pathSet.add(key(c));
    this.stack = [];
    this.best = 0;
    this.stepsWithoutProgress = 0;
    this.parkCount = 0;
    this.parked = false;
  }
  clone(){
    const b = new Branch(this.cell, this.path, this.cameFrom);
    b.best = this.best;
    b.stepsWithoutProgress = this.stepsWithoutProgress;
    b.parkCount = 0;
    b.stack = this.stack.map(s => ({
      cell: s.cell,
      options: s.options.slice(),
      nextIdx: s.nextIdx,
      pathIdx: s.pathIdx
    }));
    return b;
  }
}

class LSB {
  constructor(grid, start, goal, opts={}){
    this.grid=grid; this.start=start; this.goal=goal;
    this.name="LSB";
    this.max_branches        = opts.max_branches        ?? 16;
    this.scar_threshold      = opts.scar_threshold      ?? 2.5;
    this.scar_decay          = opts.scar_decay          ?? 0.004;
    this.tryEps              = opts.tryEps              ?? 0.5;
    this.progressThreshold   = opts.progressThreshold   ?? 100;
    this.maxParksPerBranch   = opts.maxParksPerBranch   ?? 3;
    this.minActive           = opts.minActive           ?? 4;

    this.scar = new Map();
    const b = new Branch(start, [start], null);
    b.best = manhattan(start, goal);
    this.branches = [b];
    this.parked = [];
    this.done=false; this.path=null; this.expanded=0; this.tick=0;
    this.backtracks=0;
    this.parks=0; this.resumes=0; this.kills=0;
    this.elapsed=null;
    this.visited = new Set([key(start)]);
    this.frontier = new Set([key(start)]);
    this.dead = new Set();
  }
  _scarAdd(c, amt){ this.scar.set(key(c), (this.scar.get(key(c))||0)+amt); }
  _scarGet(c){ return this.scar.get(key(c))||0; }

  step(budget){
    for(let i=0; i<budget && !this.done; i++){
      if(this.branches.length === 0){
        if(this.parked.length === 0){ this.done = true; return; }
        this._unpark();
      }
      this.tick++;
      const next = [];
      for(const b of this.branches){
        this.stepBranch(b, next);
        if(this.done) return;
      }
      next.sort((a,b) => a.best - b.best);
      this.branches = next.slice(0, this.max_branches);
      this.frontier = new Set(this.branches.map(b => key(b.cell)));

      if(this.scar_decay>0 && this.tick%60===0){
        for(const k of Array.from(this.scar.keys())){
          const v = this.scar.get(k)*(1-this.scar_decay);
          if(v<0.05) this.scar.delete(k); else this.scar.set(k,v);
        }
      }
    }
  }

  _unpark(){
    this.parked.sort((a,b) => a.best - b.best);
    const n = Math.min(this.minActive, this.parked.length);
    for(let j=0; j<n; j++){
      const b = this.parked.shift();
      b.stepsWithoutProgress = 0;
      b.parked = false;
      this.branches.push(b);
      this.resumes++;
    }
  }

  _updateProgress(b, stepCell){
    const k = key(stepCell);
    const isNew = !this.visited.has(k);
    this.visited.add(k);
    if(isNew){
      b.stepsWithoutProgress = 0;
    } else {
      b.stepsWithoutProgress++;
    }
  }

  _checkPark(b){
    if(b.stepsWithoutProgress < this.progressThreshold) return false;
    b.parkCount++;
    if(b.parkCount >= this.maxParksPerBranch){
      for(const c of b.path){ this._scarAdd(c, 0.5); this.dead.add(key(c)); }
      this.kills++;
      return true;
    }
    b.parked = true;
    this.parked.push(b);
    this.parks++;
    return true;
  }

  stepBranch(b, next){
    if(b.cell[0]===this.goal[0] && b.cell[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }
    const opts = neighbors(this.grid, b.cell).filter(n => !b.pathSet.has(key(n)));

    if(opts.length === 0){
      const dead = this.backtrack(b, next);
      if(dead) return;
      this._updateProgress(b, b.cell);
      if(this._checkPark(b)) return;
      next.push(b);
      return;
    }

    opts.sort((p,q) => euclid(p, this.goal) - euclid(q, this.goal));
    const primary = opts[0];

    if(opts.length > 1){
      const bestD = euclid(primary, this.goal);
      const tied = opts.filter(o => Math.abs(euclid(o, this.goal) - bestD) < this.tryEps);
      if(tied.length > 1){
        for(let i=1; i<tied.length; i++){
          if(next.length + this.branches.length >= this.max_branches) break;
          const nb = b.clone();
          const nt = tied[i];
          nb.stack.push({
            cell: b.cell,
            options: opts.slice(),
            nextIdx: tied.length,
            pathIdx: b.path.length - 1
          });
          nb.path.push(nt);
          nb.pathSet.add(key(nt));
          nb.cameFrom = b.cell;
          nb.cell = nt;
          nb.best = Math.min(nb.best, manhattan(nt, this.goal));
          this.visited.add(key(nt));
          this.expanded++;
          next.push(nb);
        }
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: tied.length,
          pathIdx: b.path.length - 1
        });
      } else {
        b.stack.push({
          cell: b.cell,
          options: opts.slice(),
          nextIdx: 1,
          pathIdx: b.path.length - 1
        });
      }
    }

    b.path.push(primary);
    b.pathSet.add(key(primary));
    b.cameFrom = b.cell;
    b.cell = primary;
    this.expanded++;
    const d = manhattan(primary, this.goal);
    if(d < b.best) b.best = d;

    if(primary[0]===this.goal[0] && primary[1]===this.goal[1]){
      this.done=true; this.path=b.path; return;
    }

    this._updateProgress(b, primary);
    if(this._checkPark(b)) return;
    next.push(b);
  }

  backtrack(b, next){
    this.backtracks++;
    while(b.stack.length > 0){
      const top = b.stack[b.stack.length - 1];
      if(top.nextIdx < top.options.length){
        const nt = top.options[top.nextIdx];
        top.nextIdx++;
        for(let i = b.path.length - 1; i > top.pathIdx; i--){
          b.pathSet.delete(key(b.path[i]));
        }
        b.path = b.path.slice(0, top.pathIdx + 1);
        b.path.push(nt);
        b.pathSet.add(key(nt));
        b.cameFrom = top.cell;
        b.cell = nt;
        this.expanded++;
        const d = manhattan(nt, this.goal);
        if(d < b.best) b.best = d;
        if(nt[0]===this.goal[0] && nt[1]===this.goal[1]){
          this.done=true; this.path=b.path; return false;
        }
        return false;
      }
      b.stack.pop();
    }
    for(const c of b.path){
      this._scarAdd(c, 0.5);
      this.dead.add(key(c));
    }
    this.kills++;
    return true;
  }
}

// ---------- rendering ----------
const cA = document.getElementById('cA');
const cL = document.getElementById('cL');
cA.width = W*CELL; cA.height = H*CELL;
cL.width = W*CELL; cL.height = H*CELL;
const ctxA = cA.getContext('2d');
const ctxL = cL.getContext('2d');

const COLOR = {
  wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', parked:'#f80', visited:'#2a4a7a', path:'#0ff', dead:'#a00'
};

function draw(ctx, grid, algo){
  ctx.fillStyle = COLOR.open;
  ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const pathSet = algo.path ? new Set(algo.path.map(key)) : null;
  const parkedSet = algo.parked ? new Set(algo.parked.map(b => key(b.cell))) : null;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const k = y*W+x;
      let col = null;
      if(grid[y][x]===1) col = COLOR.wall;
      else if(algo.dead && algo.dead.has(k)) col = COLOR.dead;
      else if(algo.visited.has(k)) col = COLOR.visited;
      if(parkedSet && parkedSet.has(k)) col = COLOR.parked;
      if(algo.frontier.has(k)) col = COLOR.frontier;
      if(pathSet && pathSet.has(k)) col = COLOR.path;
      if(x===START[0]&&y===START[1]) col = COLOR.start;
      if(x===GOAL[0]&&y===GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle=col; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
    }
  }
}

function stats(algo){
  let s = `expanded: <b>${algo.expanded}</b><br>` +
          `unique cells: <b>${algo.visited.size}</b><br>` +
          `path length: <b>${algo.path?algo.path.length:'—'}</b><br>` +
          `frontier: <b>${algo.frontier.size}</b><br>`;
  if(algo.backtracks !== undefined)
    s += `backtracks: <b>${algo.backtracks}</b><br>` +
         `parks: <b>${algo.parks}</b>  resumes: <b>${algo.resumes}</b><br>` +
         `kills: <b>${algo.kills}</b>  parked: <b>${algo.parked.length}</b><br>`;
  s += `done: <b>${algo.done}</b><br>`;
  s += `time: <b>${algo.elapsed !== null ? (algo.elapsed/1000).toFixed(2)+'s' : '…'}</b>`;
  return s;
}

// ---------- driver ----------
let grid, a, l, paused=false, t0=0, lastFrame=0, finished=false;

function setScenario(name){
  if(name==='open'){        START=[0,0]; GOAL=[W-1,H-1]; lastMazeType='—'; grid = makeOpen(); }
  else if(name==='sparse'){ START=[0,0]; GOAL=[W-1,H-1]; lastMazeType='—'; grid = makeSparse(); }
  else if(name==='r020'){   START=[0,0]; GOAL=[W-1,H-1]; lastMazeType='—'; grid = makeRandom(0.20, freshSeed()); }
  else if(name==='r030'){   START=[0,0]; GOAL=[W-1,H-1]; lastMazeType='—'; grid = makeRandom(0.30, freshSeed()); }
  else if(name==='r038'){   START=[0,0]; GOAL=[W-1,H-1]; lastMazeType='—'; grid = makeRandom(0.38, freshSeed()); }
  else if(name==='maze_dfs'){     lastMazeType='DFS';     grid = makeMazeDFS(freshSeed());     START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_prim'){    lastMazeType='Prim';    grid = makeMazePrim(freshSeed());    START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_kruskal'){ lastMazeType='Kruskal'; grid = makeMazeKruskal(freshSeed()); START=[1,1]; GOAL=[W-3,H-3]; }
  else if(name==='maze_any'){
    const t = MAZE_TYPES[Math.floor(Math.random()*MAZE_TYPES.length)];
    lastMazeType = t.name;
    grid = t.fn(freshSeed());
    START=[1,1]; GOAL=[W-3,H-3];
  }
  restart();
}

function restart(){
  a = new AStar(grid, START, GOAL);
  l = new LSB(grid, START, GOAL);
  paused=false; finished=false;
  t0=performance.now();
  lastFrame=0;
  document.getElementById('pauseBtn').innerText = 'Pause';
  draw(ctxA, grid, a); draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);
}

function togglePause(){
  if(finished) return;
  paused = !paused;
  document.getElementById('pauseBtn').innerText = paused ? 'Resume' : 'Pause';
}

function loop(now){
  requestAnimationFrame(loop);
  if(paused || finished) return;
  if(now - lastFrame < TICK_DELAY) return;
  lastFrame = now;

  if(!a.done) a.step(BUDGET_PER_TICK);
  if(!l.done) l.step(BUDGET_PER_TICK);

  const tNow = performance.now();
  if(a.done && a.elapsed === null) a.elapsed = tNow - t0;
  if(l.done && l.elapsed === null) l.elapsed = tNow - t0;

  draw(ctxA, grid, a);
  draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);

  if(a.done && l.done){
    finished = true;
    document.getElementById('pauseBtn').innerText = 'Done';
  }
}

// ---------- mass test ----------
const MASS_N = 12;              // 12 mazes = 4 of each type
const MASS_MAX_ITERS = 20000;

function runOne(algo){
  const t0 = performance.now();
  let iters = 0;
  while(!algo.done && iters < MASS_MAX_ITERS){
    algo.step(500);
    iters++;
  }
  const ms = performance.now() - t0;
  return {
    done: algo.done,
    expanded: algo.expanded,
    unique: algo.visited.size,
    pathLen: algo.path ? algo.path.length : null,
    backtracks: algo.backtracks !== undefined ? algo.backtracks : null,
    parks: algo.parks !== undefined ? algo.parks : null,
    resumes: algo.resumes !== undefined ? algo.resumes : null,
    kills: algo.kills !== undefined ? algo.kills : null,
    ms
  };
}

function massTest(){
  paused = true;
  document.getElementById('pauseBtn').innerText = 'Resume';
  const out = document.getElementById('results');
  out.style.display = 'block';
  out.textContent = 'Running ' + MASS_N + ' fresh mazes...';

  setTimeout(() => {
    const rows = [];
    let aWins=0, lWins=0, ties=0;
    let sumATime=0, sumLTime=0, sumAUniq=0, sumLUniq=0;
    let sumAPath=0, sumLPath=0, sumLBT=0, sumLParks=0, sumLRes=0, sumLKills=0;
    let aDNF=0, lDNF=0;

    // Cycle through DFS, Prim, Kruskal so we get 4 of each
    for(let i=0; i<MASS_N; i++){
      const type = MAZE_TYPES[i % MAZE_TYPES.length];
      const seed = freshSeed();
      const g = type.fn(seed);
      const S = [1,1], G = [W-3,H-3];
      const ra = runOne(new AStar(g, S, G));
      const rl = runOne(new LSB(g, S, G));

      sumATime+=ra.ms; sumLTime+=rl.ms;
      sumAUniq+=ra.unique; sumLUniq+=rl.unique;
      sumAPath+=ra.pathLen??0; sumLPath+=rl.pathLen??0;
      sumLBT += rl.backtracks??0;
      sumLParks += rl.parks??0;
      sumLRes += rl.resumes??0;
      sumLKills += rl.kills??0;
      if(!ra.done) aDNF++;
      if(!rl.done) lDNF++;

      let verdict;
      if(!rl.done && !ra.done) verdict = 'both DNF';
      else if(!rl.done) verdict = 'A* (LSB DNF)';
      else if(!ra.done) verdict = 'LSB (A* DNF)';
      else if(rl.unique < ra.unique){ verdict = 'LSB'; lWins++; }
      else if(ra.unique < rl.unique){ verdict = 'A*';  aWins++; }
      else { verdict = 'tie'; ties++; }

      rows.push({ type: type.name, seed,
                  aTime:ra.ms, lTime:rl.ms,
                  aUniq:ra.unique, lUniq:rl.unique,
                  aPath:ra.pathLen, lPath:rl.pathLen,
                  lBT:rl.backtracks, lParks:rl.parks,
                  lRes:rl.resumes, lKills:rl.kills,
                  aDone:ra.done, lDone:rl.done, verdict });
    }

    const pad = (s,n)=>{ s=String(s); while(s.length<n) s+=' '; return s.slice(0,n); };
    const padL= (s,n)=>{ s=String(s); while(s.length<n) s=' '+s; return s.slice(-n); };

    let txt = '';
    txt += 'MASS TEST — ' + MASS_N + ' fresh mazes (' + W + 'x' + H + ')\n';
    txt += 'All seeds randomised per-run. Verdict by unique-cells-touched.\n\n';
    txt += pad('type',9) + padL('A*ms',8) + padL('LSBms',8)
         + padL('A*uniq',8) + padL('LSBuniq',9)
         + padL('A*path',8) + padL('LSBpath',9)
         + padL('LSBbt',7) + padL('park',6) + padL('res',5) + padL('kill',6)
         + '  verdict\n';
    txt += '─'.repeat(9+8+8+8+9+8+9+7+6+5+6+10) + '\n';
    for(const r of rows){
      txt += pad(r.type, 9)
          + padL(r.aTime.toFixed(1), 8)
          + padL(r.lTime.toFixed(1), 8)
          + padL(r.aDone ? r.aUniq : 'DNF', 8)
          + padL(r.lDone ? r.lUniq : 'DNF', 9)
          + padL(r.aPath ?? '—', 8)
          + padL(r.lPath ?? '—', 9)
          + padL(r.lBT ?? '—', 7)
          + padL(r.lParks ?? '—', 6)
          + padL(r.lRes ?? '—', 5)
          + padL(r.lKills ?? '—', 6)
          + '  ' + r.verdict + '\n';
    }
    txt += '─'.repeat(9+8+8+8+9+8+9+7+6+5+6+10) + '\n';
    txt += pad('AVG', 9)
        + padL((sumATime/MASS_N).toFixed(1), 8)
        + padL((sumLTime/MASS_N).toFixed(1), 8)
        + padL((sumAUniq/MASS_N).toFixed(0), 8)
        + padL((sumLUniq/MASS_N).toFixed(0), 9)
        + padL((sumAPath/MASS_N).toFixed(0), 8)
        + padL((sumLPath/MASS_N).toFixed(0), 9)
        + padL((sumLBT/MASS_N).toFixed(0), 7)
        + padL((sumLParks/MASS_N).toFixed(0), 6)
        + padL((sumLRes/MASS_N).toFixed(0), 5)
        + padL((sumLKills/MASS_N).toFixed(0), 6)
        + '\n\n';
    txt += 'WINS  A*: ' + aWins + '   LSB: ' + lWins + '   tie: ' + ties + '\n';
    txt += 'DNF   A*: ' + aDNF + '   LSB: ' + lDNF + '\n\n';
    txt += 'Per-type breakdown (unique cells, avg):\n';
    for(const t of MAZE_TYPES){
      const sub = rows.filter(r => r.type === t.name);
      const aAvg = (sub.reduce((s,r)=>s+r.aUniq,0) / sub.length).toFixed(0);
      const lAvg = (sub.reduce((s,r)=>s+r.lUniq,0) / sub.length).toFixed(0);
      const lBT  = (sub.reduce((s,r)=>s+(r.lBT||0),0) / sub.length).toFixed(0);
      txt += '  ' + pad(t.name, 9) + '  A* ' + padL(aAvg, 6) + '   LSB ' + padL(lAvg, 6)
           + '   LSB avg backtracks ' + padL(lBT, 6) + '\n';
    }

    out.textContent = txt;
  }, 30);
}

setScenario('maze_any');
requestAnimationFrame(loop);
</script>
