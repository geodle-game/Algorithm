<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSB vs A*</title>
<style>
  body { background:#111; color:#eee; font-family: monospace; margin:0; padding:12px; }
  h2 { margin: 4px 0; font-size: 15px; }
  canvas { display:block; image-rendering: pixelated; background:#000; margin-bottom:8px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .col { flex:1; min-width:320px; }
  .panel { background:#181818; padding:8px; border-radius:6px; }
  .stats { font-size:12px; line-height:1.5; color:#bbb; }
  .stats b { color:#fff; }
  button { background:#2a2a2a; color:#eee; border:1px solid #444; padding:8px 12px;
           border-radius:5px; font-family:monospace; font-size:13px; margin:3px; }
  button:active { background:#444; }
  .legend { font-size:11px; color:#888; margin-top:6px; }
  .sw { display:inline-block; width:10px; height:10px; vertical-align:middle; margin-right:4px; }
</style>
</head>
<body>

<div class="panel" style="margin-bottom:8px;">
  <button onclick="setScenario('open')">Open</button>
  <button onclick="setScenario('sparse')">Sparse blocks</button>
  <button onclick="setScenario('r020')">Random 0.20</button>
  <button onclick="setScenario('r030')">Random 0.30</button>
  <button onclick="setScenario('r038')">Dense 0.38</button>
  <button onclick="setScenario('maze1')">Perfect maze #1</button>
  <button onclick="setScenario('maze2')">Perfect maze #2</button>
  <button onclick="setScenario('maze3')">Perfect maze #3</button>
  <button onclick="togglePause()" id="pauseBtn">Pause</button>
  <button onclick="restart()">Restart</button>
</div>

<div class="row">
  <div class="col panel">
    <h2>A*</h2>
    <canvas id="cA" width="480" height="240"></canvas>
    <div class="stats" id="sA"></div>
  </div>
  <div class="col panel">
    <h2>LSB</h2>
    <canvas id="cL" width="480" height="240"></canvas>
    <div class="stats" id="sL"></div>
  </div>
</div>

<div class="legend panel">
  <span class="sw" style="background:#0a0"></span>start
  <span class="sw" style="background:#c0c"></span>goal
  <span class="sw" style="background:#555"></span>wall
  <span class="sw" style="background:#ff0"></span>frontier
  <span class="sw" style="background:#2a4a7a"></span>visited
  <span class="sw" style="background:#0ff"></span>final path
  <span class="sw" style="background:#a00"></span>dead (LSB scars)
</div>

<script>
// ---------- config ----------
const W = 60, H = 30;
const CELL = Math.floor(480 / W);
const START = [0, 0];
const GOAL = [W-1, H-1];
let TICK_DELAY = 30;
let BUDGET_PER_TICK = 6;

// ---------- maze gen ----------
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

function makeOpen(){ return Array.from({length:H},()=>Array(W).fill(0)); }

function makeSparse(){
  const g = Array.from({length:H},()=>Array(W).fill(0));
  const blocks = [[10,5,16,24],[26,12,32,28],[36,4,44,14],[48,18,58,26]];
  for(const [x0,y0,x1,y1] of blocks)
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}

function makeRandom(density, seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(r()<density) g[y][x]=1;
  g[0][0]=0; g[H-1][W-1]=0;
  return g;
}

// Perfect maze (recursive backtracker) — same topology as mazegenerator.net.
function makePerfectMaze(seed){
  const r = rng(seed);
  const g = Array.from({length:H},()=>Array(W).fill(1));
  const rx = Math.floor((W-1)/2);
  const ry = Math.floor((H-1)/2);
  const visited = Array.from({length:ry},()=>Array(rx).fill(false));
  const stack = [[0,0]];
  visited[0][0]=true;
  g[1][1]=0;
  while(stack.length){
    const [cx,cy] = stack[stack.length-1];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=rx||ny<0||ny>=ry) continue;
      if(visited[ny][nx]) continue;
      g[cy*2+1+dy][cx*2+1+dx]=0;
      g[ny*2+1][nx*2+1]=0;
      visited[ny][nx]=true;
      stack.push([nx,ny]);
      moved=true;
      break;
    }
    if(!moved) stack.pop();
  }
  // open corners + punch entrances
  g[0][0]=0;
  g[H-1][W-1]=0;
  if(g[1][0]!==0) g[1][0]=0;
  if(g[0][1]!==0) g[0][1]=0;
  if(g[H-2][W-1]!==0) g[H-2][W-1]=0;
  if(g[H-1][W-2]!==0) g[H-1][W-2]=0;
  return g;
}

// ---------- helpers ----------
function manhattan(a,b){ return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]); }
function euclid(a,b){ const dx=a[0]-b[0],dy=a[1]-b[1]; return Math.hypot(dx,dy); }
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function neighbors(grid,c){
  const out=[];
  for(const [dx,dy] of N4){
    const x=c[0]+dx, y=c[1]+dy;
    if(x>=0&&x<W&&y>=0&&y<H&&grid[y][x]===0) out.push([x,y]);
  }
  return out;
}
function key(c){ return c[1]*W+c[0]; }

// Bresenham line cells from a to b, excluding a, including b
function lineCells(a,b){
  let [x0,y0]=a, [x1,y1]=b;
  const cells=[];
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy;
  let x=x0, y=y0;
  while(!(x===x1&&y===y1) && cells.length<400){
    const e2 = 2*err;
    if(e2 > -dy){ err-=dy; x+=sx; }
    if(e2 < dx){ err+=dx; y+=sy; }
    cells.push([x,y]);
  }
  return cells;
}

// ---------- A* ----------
class AStar {
  constructor(grid){
    this.grid=grid;
    this.name="A*";
    this.open=[[manhattan(START,GOAL),0,START]];
    this.g={[key(START)]:0};
    this.came={};
    this.closed=new Set();
    this.visited=new Set([key(START)]);
    this.frontier=new Set([key(START)]);
    this.done=false;
    this.path=null;
    this.expanded=0;
  }
  step(budget){
    for(let i=0;i<budget && !this.done;i++){
      if(!this.open.length){ this.done=true; return; }
      let bi=0; for(let j=1;j<this.open.length;j++) if(this.open[j][0]<this.open[bi][0]) bi=j;
      const [f,g,c]=this.open.splice(bi,1)[0];
      if(this.closed.has(key(c))){ i--; continue; }
      this.closed.add(key(c));
      this.visited.add(key(c));
      this.frontier.delete(key(c));
      this.expanded++;
      if(c[0]===GOAL[0]&&c[1]===GOAL[1]){
        this.done=true; this._recon(c); return;
      }
      for(const n of neighbors(this.grid,c)){
        const ng=g+1;
        const kn=key(n);
        if(this.g[kn]===undefined||ng<this.g[kn]){
          this.g[kn]=ng; this.came[kn]=c;
          this.open.push([ng+manhattan(n,GOAL),ng,n]);
          this.frontier.add(kn);
        }
      }
    }
  }
  _recon(end){
    const p=[]; let c=end;
    while(c){ p.push(c); c=this.came[key(c)]; }
    p.reverse(); this.path=p;
  }
}

// ---------- LSB ----------
class Branch {
  constructor(cell,path,last){ this.cell=cell; this.path=path; this.last=last; this.best=0; this.stagnant=0; }
}
class LSB {
  constructor(grid, opts={}){
    this.grid=grid; this.name="LSB";
    this.max_branches = opts.max_branches ?? 20;
    this.stag_limit = opts.stag_limit ?? 200;
    this.scar_threshold = opts.scar_threshold ?? 2.5;
    this.scar_decay = opts.scar_decay ?? 0.004;
    this.lookahead = opts.lookahead ?? 3;
    this.scar = new Map();
    const b = new Branch(START,[START],null);
    b.best = manhattan(START,GOAL);
    this.branches=[b];
    this.done=false; this.path=null; this.expanded=0; this.tick=0;
    this.visited=new Set([key(START)]);
    this.frontier=new Set([key(START)]);
    this.dead=new Set();
  }
  _scarAdd(c, amt){ this.scar.set(key(c), (this.scar.get(key(c))||0)+amt); }
  _scarGet(c){ return this.scar.get(key(c))||0; }
  step(budget){
    for(let i=0;i<budget && !this.done;i++){
      if(!this.branches.length){ this.done=true; return; }
      this.tick++;
      const next=[];
      for(const b of this.branches){
        const ray = lineCells(b.cell, GOAL);
        let blocked=null;
        for(let k=this.lookahead;k<ray.length;k++){
          const [x,y]=ray[k];
          if(x<0||x>=W||y<0||y>=H){ blocked=ray[k]; break; }
          if(this.grid[y][x]===1){ blocked=ray[k]; break; }
        }
        let stepCell;
        if(!blocked){
          stepCell = ray[0] || null;
          if(!stepCell){
            this.done=true; this.path=b.path; return;
          }
        } else {
          const cands = neighbors(this.grid, blocked).filter(n=>!(n[0]===b.cell[0]&&n[1]===b.cell[1]));
          if(!cands.length){
            for(const c of b.path){ this._scarAdd(c,1); this.dead.add(key(c)); }
            continue;
          }
          cands.sort((p,q)=>euclid(p,GOAL)-euclid(q,GOAL));
          const bd = euclid(cands[0],GOAL);
          const tied = cands.filter(c=>euclid(c,GOAL)===bd);
          if(tied.length>1 && this.branches.length+next.length<this.max_branches){
            for(let t=1;t<tied.length;t++){
              const nb = new Branch(tied[t], b.path.concat([tied[t]]), b.cell);
              nb.best = manhattan(tied[t],GOAL);
              next.push(nb);
            }
          }
          stepCell = tied[0];
        }
        if(!stepCell) continue;

        if(this._scarGet(stepCell)>this.scar_threshold &&
           manhattan(stepCell,GOAL)>=b.best){
          const alt = neighbors(this.grid, stepCell).filter(c=>this._scarGet(c)<=this.scar_threshold);
          if(alt.length){
            alt.sort((p,q)=>euclid(p,GOAL)-euclid(q,GOAL));
            stepCell = alt[0];
          }
        }

        b.path = b.path.concat([stepCell]);
        b.last = b.cell;
        b.cell = stepCell;
        this.expanded++;
        this.visited.add(key(stepCell));
        if(b.last) this.frontier.delete(key(b.last));
        this.frontier.add(key(stepCell));

        const d = manhattan(stepCell,GOAL);
        if(d<b.best){ b.best=d; b.stagnant=0; } else b.stagnant++;

        if(stepCell[0]===GOAL[0]&&stepCell[1]===GOAL[1]){
          this.done=true; this.path=b.path; return;
        }

        if(b.stagnant>this.stag_limit){
          for(const c of b.path){ this._scarAdd(c,1); this.dead.add(key(c)); }
          continue;
        }
        next.push(b);
      }
      next.sort((a,b)=>a.best-b.best);
      this.branches = next.slice(0,this.max_branches);
      if(this.scar_decay>0 && this.tick%60===0){
        for(const k of Array.from(this.scar.keys())){
          const v = this.scar.get(k)*(1-this.scar_decay);
          if(v<0.05) this.scar.delete(k); else this.scar.set(k,v);
        }
      }
    }
  }
}

// ---------- rendering ----------
const cA = document.getElementById('cA');
const cL = document.getElementById('cL');
cA.width = W*CELL; cA.height = H*CELL;
cL.width = W*CELL; cL.height = H*CELL;
const ctxA = cA.getContext('2d');
const ctxL = cL.getContext('2d');

const COLOR = {
  wall:'#555', open:'#000', start:'#0a0', goal:'#c0c',
  frontier:'#ff0', visited:'#2a4a7a', path:'#0ff', dead:'#a00'
};

function draw(ctx, grid, algo){
  ctx.fillStyle = COLOR.open; ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  const pathSet = algo.path ? new Set(algo.path.map(key)) : null;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const k = y*W+x;
      let col = null;
      if(grid[y][x]===1) col = COLOR.wall;
      else if(algo.dead && algo.dead.has(k)) col = COLOR.dead;
      else if(algo.visited.has(k)) col = COLOR.visited;
      if(algo.frontier.has(k)) col = COLOR.frontier;
      if(pathSet && pathSet.has(k)) col = COLOR.path;
      if(x===START[0]&&y===START[1]) col = COLOR.start;
      if(x===GOAL[0]&&y===GOAL[1]) col = COLOR.goal;
      if(col){ ctx.fillStyle=col; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
    }
  }
}

function stats(algo){
  return `expanded: <b>${algo.expanded}</b><br>` +
         `path length: <b>${algo.path?algo.path.length:'—'}</b><br>` +
         `frontier: <b>${algo.frontier.size}</b><br>` +
         `done: <b>${algo.done}</b>`;
}

// ---------- driver ----------
let grid, a, l, paused=false, tick=0, t0=0, lastFrame=0;

function setScenario(name){
  if(name==='open') grid = makeOpen();
  else if(name==='sparse') grid = makeSparse();
  else if(name==='r020') grid = makeRandom(0.20, 1);
  else if(name==='r030') grid = makeRandom(0.30, 2);
  else if(name==='r038') grid = makeRandom(0.38, 3);
  else if(name==='maze1') grid = makePerfectMaze(1);
  else if(name==='maze2') grid = makePerfectMaze(7);
  else if(name==='maze3') grid = makePerfectMaze(42);
  restart();
}

function restart(){
  a = new AStar(grid);
  l = new LSB(grid);
  tick=0; t0=performance.now();
  paused=false;
  document.getElementById('pauseBtn').innerText = 'Pause';
  draw(ctxA, grid, a); draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);
}

function togglePause(){ paused=!paused; document.getElementById('pauseBtn').innerText = paused?'Resume':'Pause'; }

function loop(now){
  requestAnimationFrame(loop);
  if(paused) return;
  if(now-lastFrame < TICK_DELAY) return;
  lastFrame = now;

  if(!a.done) a.step(BUDGET_PER_TICK);
  if(!l.done) l.step(BUDGET_PER_TICK);
  tick++;

  draw(ctxA, grid, a); draw(ctxL, grid, l);
  document.getElementById('sA').innerHTML = stats(a);
  document.getElementById('sL').innerHTML = stats(l);

  if(a.done && l.done){
    const el = ((performance.now()-t0)/1000).toFixed(2);
    document.getElementById('sA').innerHTML += `<br>time: <b>${el}s</b>`;
    document.getElementById('sL').innerHTML += `<br>time: <b>${el}s</b>`;
    paused = true;
    document.getElementById('pauseBtn').innerText = 'Resume';
  }
}

setScenario('maze1');
requestAnimationFrame(loop);
</script>
</body>
</html>
